name: Temporary WG-6C Rust Integration

on:
  push:
    branches: [wg6c-lakes-closed-basins]

permissions:
  contents: write

concurrency:
  group: temporary-wg6c-rust
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg6c-lakes-closed-basins
          fetch-depth: 0
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup default 1.98.1
      - name: Apply WG-6C Rust integration
        run: python scripts/temp-wg6c-rust.py
      - name: Format WG-6C Rust files
        run: |
          rustfmt +1.98.1 --edition 2021 rust/interlink-worldgen/src/lib.rs
          rustfmt +1.98.1 --edition 2021 rust/interlink-worldgen/src/lakes.rs
          rustfmt +1.98.1 --edition 2021 rust/interlink-worldgen-wasm/src/climate_bridge.rs
          rustfmt +1.98.1 --edition 2021 rust/interlink-worldgen-wasm/src/lib.rs
          rustfmt +1.98.1 --edition 2021 rust/interlink-worldgen-cli/examples/lake_performance.rs
      - name: Test standalone workspace
        run: cargo +1.98.1 test --workspace
      - name: Compile browser bridge
        run: cargo +1.98.1 check -p interlink-worldgen-wasm --target wasm32-unknown-unknown
      - name: WG-6C L4 diagnostic
        run: cargo +1.98.1 run --release -p interlink-worldgen-cli --example lake_performance -- --seed ci-wg6c-lakes --coarse-level 3 --level 4 --plates 12 --runs 1
      - name: Commit WG-6C Rust integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/interlink-worldgen/src/lib.rs rust/interlink-worldgen/src/lakes.rs rust/interlink-worldgen-wasm/src/climate_bridge.rs rust/interlink-worldgen-wasm/src/lib.rs rust/interlink-worldgen-cli/examples/lake_performance.rs
          if git diff --cached --quiet; then
            echo 'No WG-6C Rust changes to commit.'
            exit 0
          fi
          git commit -m 'Integrate WG-6C lake equilibrium into physical pipeline'
          git push origin HEAD:wg6c-lakes-closed-basins
