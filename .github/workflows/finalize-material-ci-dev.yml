name: Finalize material-aware CI

on:
  push:
    branches:
      - feat/material-aware-boundary-tectonics

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/material-aware-boundary-tectonics
          fetch-depth: 0
      - name: Fold material identity gate into canonical CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          old = """      - name: Verify boundary-first modern plate geometry\n        run: cargo run --release -p interlink-worldgen-cli --example boundary_network_geometry_acceptance\n      - name: Verify event-driven tectonic morphology\n"""
          new = """      - name: Verify boundary-first modern plate geometry\n        run: cargo run --release -p interlink-worldgen-cli --example boundary_network_geometry_acceptance\n      - name: Verify material-aware plate/crust identity\n        run: cargo run --release -p interlink-worldgen-cli --example plate_crust_identity_acceptance\n      - name: Verify event-driven tectonic morphology\n"""
          if old not in s:
              raise SystemExit('canonical CI insertion point not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/material-aware-tectonics.yml
          rm .github/workflows/finalize-material-ci-dev.yml
      - name: Commit canonical CI integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml .github/workflows/material-aware-tectonics.yml .github/workflows/finalize-material-ci-dev.yml
          git commit -m 'ci(worldgen): gate material-aware plate identity' || exit 0
          git push origin HEAD:feat/material-aware-boundary-tectonics
