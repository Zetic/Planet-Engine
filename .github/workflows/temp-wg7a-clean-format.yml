name: Temporary WG-7A Format Cleanup

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'wg7a-fluvial-erosion-sediment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg7a-fluvial-erosion-sediment
          fetch-depth: 0
      - name: Restore unrelated formatting changes
        run: |
          git fetch origin main
          git checkout origin/main -- \
            rust/interlink-worldgen-cli/examples/drainage_performance.rs \
            rust/interlink-worldgen-cli/examples/hydroclimate_closure.rs \
            rust/interlink-worldgen/src/hydroclimate.rs \
            rust/interlink-worldgen/tests/crust_plate_independence.rs \
            rust/interlink-worldgen/tests/geology_ensemble.rs \
            rust/interlink-worldgen/tests/tectonic_plate_distribution.rs \
            rust/interlink-worldgen/tests/topography_ensemble.rs
          rm -f .github/workflows/temp-wg7a-clean-format.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove unrelated WG-7A formatting changes'
          git push origin HEAD:wg7a-fluvial-erosion-sediment
