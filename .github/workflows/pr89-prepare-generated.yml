name: PR89 Prepare Generated Artifacts

on:
  push:
    branches:
      - interlink-pr89-freeboard-observability-fix

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: interlink-pr89-freeboard-observability-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Node dependencies
        run: npm ci
      - name: Install pinned Rust and browser target
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.98.1
      - name: Install pinned wasm-bindgen CLI
        run: cargo +1.98.1 install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Typecheck browser source
        run: npm run typecheck
      - name: Build browser source
        run: npm run build
      - name: Check browser WASM bridge
        run: npm run check:worldgen-wasm
      - name: Rebuild committed WASM package
        run: npm run build:worldgen-wasm
      - name: Run browser regressions
        run: npm run test:ts
      - name: Commit generated artifacts
        run: |
          git add dist src/wasm-worldgen
          if git diff --cached --quiet; then
            echo "Generated artifacts already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh v24 calibration artifacts"
          git push origin HEAD:interlink-pr89-freeboard-observability-fix
