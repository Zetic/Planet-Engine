name: Validate and commit memory rewrite

on:
  push:
    branches: [perf/l8-memory-architecture]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-memory-rewrite
  cancel-in-progress: true

jobs:
  rewrite:
    if: ${{ !contains(github.event.head_commit.message, '[memory-rewrite]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUST_VERSION: '1.98.1'
      WASM_BINDGEN_VERSION: '0.2.127'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/l8-memory-architecture
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reapply source rewrite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-memory-architecture.yml').read_text()
          start = workflow.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = workflow.index('\n          PY\n', start)
          code = workflow[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in code.splitlines())
          Path('/tmp/memory-rewrite.py').write_text(code)
          PY
          python3 /tmp/memory-rewrite.py
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('tests').glob('*.test.ts'):
              text = path.read_text()
              text = text.replace('assert.equal(WORLDGEN_PROTOCOL_VERSION, 18)', 'assert.equal(WORLDGEN_PROTOCOL_VERSION, 19)')
              text = text.replace('WORLDGEN_PROTOCOL_VERSION = 18', 'WORLDGEN_PROTOCOL_VERSION = 19')
              path.write_text(text)
          PY
          cargo fmt --all
      - name: Compile source rewrite
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target wasm32-unknown-unknown
          rustup default "${RUST_VERSION}"
          cargo check --workspace --all-targets
          cargo test -p interlink-worldgen seasonal
          cargo check -p interlink-worldgen-wasm --target wasm32-unknown-unknown
      - name: Rebuild committed browser WASM
        run: |
          cargo install --locked wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}"
          npm run build:worldgen-wasm
      - name: Validate browser contract
        run: |
          npm ci
          npm run build
          npm run test:ts
      - name: Commit rewrite
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust src tests docs
          git commit -m 'perf(worldgen): compact L8 stage lifetimes [memory-rewrite]'
          git push origin HEAD:perf/l8-memory-architecture
