name: Temporary WG-7C Browser Integration

on:
  push:
    branches: [wg7c-post-erosion-hydrology]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg7c-post-erosion-hydrology
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install toolchains
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.98.1
          npm ci
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Integrate protocol, worker, Lab, and browser diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Protocol v17 and WG-7C result contract.
          p = Path('src/worldgen/protocol.ts')
          s = p.read_text()
          if 'export const WORLDGEN_PROTOCOL_VERSION = 16;' not in s:
              raise SystemExit('protocol v16 target missing')
          s = s.replace('export const WORLDGEN_PROTOCOL_VERSION = 16;', 'export const WORLDGEN_PROTOCOL_VERSION = 17;', 1)
          marker = 'export interface WorldgenClimateResult {'
          if marker not in s:
              raise SystemExit('WorldgenClimateResult marker missing')
          reconciliation_interface = '''export interface WorldgenPostErosionHydrologyMetrics {\n  sampleCount: number;\n  preErosionLakeCount: number;\n  postErosionLakeCount: number;\n  lakeKindChangedSampleCount: number;\n  lakeAddedSampleCount: number;\n  lakeRemovedSampleCount: number;\n  flowRegimeChangedSampleCount: number;\n  maximumAbsoluteLakeDepthChangeM: number;\n  maximumAbsoluteAnnualRealizedDischargeChangeM3S: number;\n  maximumAbsoluteFlowPresenceChange: number;\n  reconciledRunoffConservationRelativeError: number;\n  reconciledLakeWaterBalanceRelativeError: number;\n  reconciledSeasonalRoutingRelativeError: number;\n  reconciledSeasonalWaterBalanceRelativeError: number;\n  reconciliationParameterHash: string;\n  topographyHash: string;\n  climateHash: string;\n  preErosionDrainageHash: string;\n  preErosionRunoffHash: string;\n  preErosionLakeHash: string;\n  preErosionSeasonalHash: string;\n  terrainEvolutionHash: string;\n  evolvedSurfaceHash: string;\n  postErosionDrainageHash: string;\n  reconciledRunoffHash: string;\n  reconciledLakeHash: string;\n  reconciledSeasonalHash: string;\n  postErosionHydrologyHash: string;\n}\n\n'''
          if 'WorldgenPostErosionHydrologyMetrics' not in s:
              s = s.replace(marker, reconciliation_interface + marker, 1)
          tail = '  postErosionPotentialDischargeM3S: Float32Array;\n}'
          if tail not in s:
              raise SystemExit('WorldgenClimateResult WG-7B tail missing')
          replacement = '''  postErosionPotentialDischargeM3S: Float32Array;\n  reconciliationStage: WorldgenStageMetadata;\n  reconciliationMetrics: WorldgenPostErosionHydrologyMetrics;\n  lakeKindChangedMask: Uint8Array;\n  lakeDepthDeltaM: Float32Array;\n  annualRealizedDischargeDeltaM3S: Float32Array;\n  flowRegimeChangedMask: Uint8Array;\n  flowPresenceDelta: Float32Array;\n}'''
          s = s.replace(tail, replacement, 1)
          p.write_text(s)

          # Worker/WASM contract and packaging.
          p = Path('src/worldgen/worldgenWorker.ts')
          s = p.read_text()
          m = re.search(r'(interface WasmClimate \{.*?)(\n  free\(\): void;\n\})', s, re.S)
          if not m:
              raise SystemExit('WasmClimate interface block missing')
          methods = '''\n  reconciliation_stage_id(): string; reconciliation_stage_version(): number; reconciliation_stage_seed_hex(): string; post_erosion_hydrology_hash_hex(): string; reconciliation_parameter_hash_hex(): string;\n  reconciliation_topography_hash_hex(): string; reconciliation_climate_hash_hex(): string; reconciliation_pre_erosion_drainage_hash_hex(): string; reconciliation_pre_erosion_runoff_hash_hex(): string; reconciliation_pre_erosion_lake_hash_hex(): string; reconciliation_pre_erosion_seasonal_hash_hex(): string;\n  reconciliation_terrain_evolution_hash_hex(): string; reconciliation_evolved_surface_hash_hex(): string; reconciliation_post_erosion_drainage_hash_hex(): string; reconciliation_reconciled_runoff_hash_hex(): string; reconciliation_reconciled_lake_hash_hex(): string; reconciliation_reconciled_seasonal_hash_hex(): string;\n  pre_erosion_lake_count(): number; post_erosion_lake_count(): number; lake_kind_changed_sample_count(): number; lake_added_sample_count(): number; lake_removed_sample_count(): number; flow_regime_changed_sample_count(): number; maximum_absolute_lake_depth_change_m(): number; maximum_absolute_annual_realized_discharge_change_m3_s(): number; maximum_absolute_flow_presence_change(): number;\n  reconciled_runoff_conservation_relative_error(): number; reconciled_lake_water_balance_relative_error(): number; reconciled_seasonal_routing_relative_error(): number; reconciled_seasonal_water_balance_relative_error(): number;\n  reconciliation_lake_kind_changed_mask(): Uint8Array; reconciliation_lake_depth_delta_m(): Float32Array; reconciliation_annual_realized_discharge_delta_m3_s(): Float32Array; reconciliation_flow_regime_changed_mask(): Uint8Array; reconciliation_flow_presence_delta(): Float32Array;'''
          if 'reconciliation_stage_id()' not in m.group(0):
              s = s[:m.start(2)] + methods + s[m.start(2):]

          old = "    progress('packaging', 15, 16, 0, 1);"
          if old not in s: raise SystemExit('worker packaging start target missing')
          s = s.replace(old, "    progress('packaging', 16, 17, 0, 1);", 1)
          old = "    progress('packaging', 15, 16, 1, 1);"
          if old not in s: raise SystemExit('worker packaging end target missing')
          s = s.replace(old, "    progress('packaging', 16, 17, 1, 1);", 1)

          old = '''    const evolvedSolidElevationM = output.evolved_solid_elevation_m(); const terrainDeltaM = output.terrain_delta_m(); const appliedErosionM = output.applied_erosion_m(); const appliedDepositionM = output.applied_deposition_m(); const receiverChangedMask = output.receiver_changed_mask(); const postErosionContributingAreaM2 = output.post_erosion_contributing_area_m2(); const postErosionPotentialDischargeM3S = output.post_erosion_potential_discharge_m3_s();'''
          new = old + '''\n    const lakeKindChangedMask = output.reconciliation_lake_kind_changed_mask(); const lakeDepthDeltaM = output.reconciliation_lake_depth_delta_m(); const annualRealizedDischargeDeltaM3S = output.reconciliation_annual_realized_discharge_delta_m3_s(); const flowRegimeChangedMask = output.reconciliation_flow_regime_changed_mask(); const flowPresenceDelta = output.reconciliation_flow_presence_delta();'''
          if old not in s: raise SystemExit('worker WG-7B extraction target missing')
          s = s.replace(old, new, 1)

          old = '''      evolvedSolidElevationM, terrainDeltaM, appliedErosionM, appliedDepositionM, receiverChangedMask, postErosionContributingAreaM2, postErosionPotentialDischargeM3S,\n    };'''
          new = '''      evolvedSolidElevationM, terrainDeltaM, appliedErosionM, appliedDepositionM, receiverChangedMask, postErosionContributingAreaM2, postErosionPotentialDischargeM3S,\n      reconciliationStage: { id: output.reconciliation_stage_id(), version: output.reconciliation_stage_version(), stageSeed: output.reconciliation_stage_seed_hex(), durationMs: 0 },\n      reconciliationMetrics: { sampleCount: output.fine_sample_count(), preErosionLakeCount: output.pre_erosion_lake_count(), postErosionLakeCount: output.post_erosion_lake_count(), lakeKindChangedSampleCount: output.lake_kind_changed_sample_count(), lakeAddedSampleCount: output.lake_added_sample_count(), lakeRemovedSampleCount: output.lake_removed_sample_count(), flowRegimeChangedSampleCount: output.flow_regime_changed_sample_count(), maximumAbsoluteLakeDepthChangeM: output.maximum_absolute_lake_depth_change_m(), maximumAbsoluteAnnualRealizedDischargeChangeM3S: output.maximum_absolute_annual_realized_discharge_change_m3_s(), maximumAbsoluteFlowPresenceChange: output.maximum_absolute_flow_presence_change(), reconciledRunoffConservationRelativeError: output.reconciled_runoff_conservation_relative_error(), reconciledLakeWaterBalanceRelativeError: output.reconciled_lake_water_balance_relative_error(), reconciledSeasonalRoutingRelativeError: output.reconciled_seasonal_routing_relative_error(), reconciledSeasonalWaterBalanceRelativeError: output.reconciled_seasonal_water_balance_relative_error(), reconciliationParameterHash: output.reconciliation_parameter_hash_hex(), topographyHash: output.reconciliation_topography_hash_hex(), climateHash: output.reconciliation_climate_hash_hex(), preErosionDrainageHash: output.reconciliation_pre_erosion_drainage_hash_hex(), preErosionRunoffHash: output.reconciliation_pre_erosion_runoff_hash_hex(), preErosionLakeHash: output.reconciliation_pre_erosion_lake_hash_hex(), preErosionSeasonalHash: output.reconciliation_pre_erosion_seasonal_hash_hex(), terrainEvolutionHash: output.reconciliation_terrain_evolution_hash_hex(), evolvedSurfaceHash: output.reconciliation_evolved_surface_hash_hex(), postErosionDrainageHash: output.reconciliation_post_erosion_drainage_hash_hex(), reconciledRunoffHash: output.reconciliation_reconciled_runoff_hash_hex(), reconciledLakeHash: output.reconciliation_reconciled_lake_hash_hex(), reconciledSeasonalHash: output.reconciliation_reconciled_seasonal_hash_hex(), postErosionHydrologyHash: output.post_erosion_hydrology_hash_hex() },\n      lakeKindChangedMask, lakeDepthDeltaM, annualRealizedDischargeDeltaM3S, flowRegimeChangedMask, flowPresenceDelta,\n    };'''
          if old not in s: raise SystemExit('worker result tail target missing')
          s = s.replace(old, new, 1)

          old = 'result.postErosionContributingAreaM2.buffer, result.postErosionPotentialDischargeM3S.buffer]); return;'
          new = 'result.postErosionContributingAreaM2.buffer, result.postErosionPotentialDischargeM3S.buffer, result.lakeKindChangedMask.buffer, result.lakeDepthDeltaM.buffer, result.annualRealizedDischargeDeltaM3S.buffer, result.flowRegimeChangedMask.buffer, result.flowPresenceDelta.buffer]); return;'
          if old not in s: raise SystemExit('worker transfer-list tail target missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Lab: final hydrology is reconciled, with explicit WG-7C delta modes and ancestry checks.
          p = Path('src/worldgen/diagnostics/worldgenClimateLabStandalone.ts')
          s = p.read_text()
          old = "const EVOLUTION_MODES = new Set(['evolution-solid-elevation', 'evolution-terrain-delta', 'evolution-applied-erosion', 'evolution-applied-deposition', 'evolution-receiver-change', 'evolution-contributing-area', 'evolution-potential-discharge']);"
          if old not in s: raise SystemExit('Lab evolution-mode marker missing')
          s = s.replace(old, "const RECONCILIATION_MODES = new Set(['reconciliation-lake-depth-delta', 'reconciliation-lake-change', 'reconciliation-realized-discharge-delta', 'reconciliation-flow-presence-delta', 'reconciliation-flow-regime-change']);\n" + old, 1)

          old = "    case 'evolution-solid-elevation': return { values: result.evolvedSolidElevationM, minimum: -12_000, maximum: 8_000, lowHue: 225, highHue: 25 };"
          cases = '''    case 'reconciliation-lake-depth-delta': {\n      const bound = Math.max(0.01, result.reconciliationMetrics.maximumAbsoluteLakeDepthChangeM);\n      return { values: result.lakeDepthDeltaM, minimum: -bound, maximum: bound, lowHue: 25, highHue: 205 };\n    }\n    case 'reconciliation-lake-change': {\n      for (let index = 0; index < scalarScratch.length; index += 1) scalarScratch[index] = result.lakeKindChangedMask[index]!;\n      return { values: scalarScratch, minimum: 0, maximum: 1, lowHue: 210, highHue: 5 };\n    }\n    case 'reconciliation-realized-discharge-delta': {\n      const bound = Math.max(1e-6, result.reconciliationMetrics.maximumAbsoluteAnnualRealizedDischargeChangeM3S);\n      return { values: result.annualRealizedDischargeDeltaM3S, minimum: -bound, maximum: bound, lowHue: 25, highHue: 205 };\n    }\n    case 'reconciliation-flow-presence-delta': {\n      const bound = Math.max(1e-6, result.reconciliationMetrics.maximumAbsoluteFlowPresenceChange);\n      return { values: result.flowPresenceDelta, minimum: -bound, maximum: bound, lowHue: 25, highHue: 205 };\n    }\n    case 'reconciliation-flow-regime-change': {\n      for (let index = 0; index < scalarScratch.length; index += 1) scalarScratch[index] = result.flowRegimeChangedMask[index]!;\n      return { values: scalarScratch, minimum: 0, maximum: 1, lowHue: 210, highHue: 5 };\n    }\n'''
          if old not in s: raise SystemExit('Lab scalar WG-7B marker missing')
          s = s.replace(old, cases + old, 1)

          old = "  if (EVOLUTION_MODES.has(mode) && result.submergedMask[sample]) return '#102c43';"
          if old not in s: raise SystemExit('Lab submerged evolution marker missing')
          s = s.replace(old, "  if (RECONCILIATION_MODES.has(mode) && result.submergedMask[sample]) return '#102c43';\n" + old, 1)

          old = "  'bounded-terrain-evolution': 'Bounded terrain evolution',\n  packaging: 'Packaging / transfer',"
          if old not in s: raise SystemExit('Lab generation stage labels marker missing')
          s = s.replace(old, "  'bounded-terrain-evolution': 'Bounded terrain evolution',\n  'post-erosion-hydrology': 'Post-erosion hydrology reconciliation',\n  packaging: 'Packaging / transfer',", 1)

          old = "  metric(metrics, 'WG-7B evolution hash', result.evolutionMetrics.terrainEvolutionHash);\n}"
          if old not in s: raise SystemExit('Lab metric-tail marker missing')
          new = '''  metric(metrics, 'WG-7B evolution hash', result.evolutionMetrics.terrainEvolutionHash);\n  metric(metrics, 'WG-7C stage', `${result.reconciliationStage.id}@${result.reconciliationStage.version}`);\n  metric(metrics, 'WG-7C lakes before / after', `${result.reconciliationMetrics.preErosionLakeCount.toLocaleString()} / ${result.reconciliationMetrics.postErosionLakeCount.toLocaleString()}`);\n  metric(metrics, 'WG-7C lake state changes', `${result.reconciliationMetrics.lakeKindChangedSampleCount.toLocaleString()} changed · ${result.reconciliationMetrics.lakeAddedSampleCount.toLocaleString()} added · ${result.reconciliationMetrics.lakeRemovedSampleCount.toLocaleString()} removed`);\n  metric(metrics, 'WG-7C max lake depth Δ', `${result.reconciliationMetrics.maximumAbsoluteLakeDepthChangeM.toFixed(3)} m`);\n  metric(metrics, 'WG-7C flow regime changes', result.reconciliationMetrics.flowRegimeChangedSampleCount.toLocaleString());\n  metric(metrics, 'WG-7C max annual realized-flow Δ', `${result.reconciliationMetrics.maximumAbsoluteAnnualRealizedDischargeChangeM3S.toFixed(1)} m³/s`);\n  metric(metrics, 'WG-7C runoff / lake closure', `${result.reconciliationMetrics.reconciledRunoffConservationRelativeError.toExponential(2)} / ${result.reconciliationMetrics.reconciledLakeWaterBalanceRelativeError.toExponential(2)}`);\n  metric(metrics, 'WG-7C seasonal routing / water closure', `${result.reconciliationMetrics.reconciledSeasonalRoutingRelativeError.toExponential(2)} / ${result.reconciliationMetrics.reconciledSeasonalWaterBalanceRelativeError.toExponential(2)}`);\n  metric(metrics, 'WG-7C reconciled hashes', `${result.reconciliationMetrics.reconciledRunoffHash} / ${result.reconciliationMetrics.reconciledLakeHash} / ${result.reconciliationMetrics.reconciledSeasonalHash}`);\n  metric(metrics, 'WG-7C reconciliation hash', result.reconciliationMetrics.postErosionHydrologyHash);\n}'''
          s = s.replace(old, new, 1)

          old = '''    if (loaded.erosionMetrics.seasonalHydrologyHash !== loaded.seasonalMetrics.seasonalHydrologyHash) throw new Error('WG-7A seasonal identity does not match accepted WG-6D hydrology.');\n    if (loaded.evolutionMetrics.topographyHash !== loaded.metrics.topographyHash) throw new Error('WG-7B topography identity does not match accepted WG-4 terrain.');\n    if (loaded.evolutionMetrics.drainageHash !== loaded.drainageMetrics.drainageHash) throw new Error('WG-7B drainage identity does not match accepted WG-6A topology.');\n    if (loaded.evolutionMetrics.runoffHash !== loaded.runoffMetrics.runoffHash) throw new Error('WG-7B runoff identity does not match accepted WG-6B runoff.');\n    if (loaded.evolutionMetrics.lakeHash !== loaded.lakeMetrics.lakeHash) throw new Error('WG-7B lake identity does not match accepted WG-6C state.');\n    if (loaded.evolutionMetrics.fluvialErosionHash !== loaded.erosionMetrics.fluvialErosionHash) throw new Error('WG-7B erosion identity does not match accepted WG-7A forcing.');'''
          new = '''    if (loaded.erosionMetrics.seasonalHydrologyHash !== loaded.reconciliationMetrics.preErosionSeasonalHash) throw new Error('WG-7A seasonal identity does not match WG-7C pre-erosion WG-6D ancestry.');\n    if (loaded.erosionMetrics.lakeHash !== loaded.reconciliationMetrics.preErosionLakeHash) throw new Error('WG-7A lake identity does not match WG-7C pre-erosion WG-6C ancestry.');\n    if (loaded.evolutionMetrics.topographyHash !== loaded.metrics.topographyHash) throw new Error('WG-7B topography identity does not match accepted WG-4 terrain.');\n    if (loaded.evolutionMetrics.drainageHash !== loaded.reconciliationMetrics.preErosionDrainageHash) throw new Error('WG-7B drainage identity does not match WG-7C pre-erosion WG-6A ancestry.');\n    if (loaded.evolutionMetrics.runoffHash !== loaded.reconciliationMetrics.preErosionRunoffHash) throw new Error('WG-7B runoff identity does not match WG-7C pre-erosion WG-6B ancestry.');\n    if (loaded.evolutionMetrics.lakeHash !== loaded.reconciliationMetrics.preErosionLakeHash) throw new Error('WG-7B lake identity does not match WG-7C pre-erosion WG-6C ancestry.');\n    if (loaded.evolutionMetrics.fluvialErosionHash !== loaded.erosionMetrics.fluvialErosionHash) throw new Error('WG-7B erosion identity does not match accepted WG-7A forcing.');\n    if (loaded.reconciliationMetrics.topographyHash !== loaded.metrics.topographyHash || loaded.reconciliationMetrics.climateHash !== loaded.metrics.climateHash) throw new Error('WG-7C immutable WG-4/WG-5 ancestry mismatch.');\n    if (loaded.reconciliationMetrics.terrainEvolutionHash !== loaded.evolutionMetrics.terrainEvolutionHash || loaded.reconciliationMetrics.evolvedSurfaceHash !== loaded.evolutionMetrics.evolvedSurfaceHash) throw new Error('WG-7C WG-7B terrain ancestry mismatch.');\n    if (loaded.reconciliationMetrics.postErosionDrainageHash !== loaded.drainageMetrics.drainageHash) throw new Error('WG-7C final drainage identity mismatch.');\n    if (loaded.reconciliationMetrics.reconciledRunoffHash !== loaded.runoffMetrics.runoffHash) throw new Error('WG-7C final runoff identity mismatch.');\n    if (loaded.reconciliationMetrics.reconciledLakeHash !== loaded.lakeMetrics.lakeHash) throw new Error('WG-7C final lake identity mismatch.');\n    if (loaded.reconciliationMetrics.reconciledSeasonalHash !== loaded.seasonalMetrics.seasonalHydrologyHash) throw new Error('WG-7C final seasonal identity mismatch.');'''
          if old not in s: raise SystemExit('Lab ancestry-check block missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Lab page/frontier and WG-7C delta options.
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('Through WG-7B', 'Through WG-7C')
          s = s.replace('THROUGH WG-7B', 'THROUGH WG-7C')
          s = s.replace('value="interlink-wg7b"', 'value="interlink-wg7c"')
          s = s.replace('Current physical frontier: WG-7B', 'Current physical frontier: WG-7C')
          old = '''          <optgroup label="Geomorphology · Evolved terrain / rebuilt drainage (WG-7B)">'''
          new = '''          <optgroup label="Hydrology · Post-erosion reconciliation (WG-7C)">\n            <option value="reconciliation-lake-depth-delta">Lake depth change after erosion</option>\n            <option value="reconciliation-lake-change">Lake state changed</option>\n            <option value="reconciliation-realized-discharge-delta">Annual realized-discharge change</option>\n            <option value="reconciliation-flow-presence-delta">Flow-presence change</option>\n            <option value="reconciliation-flow-regime-change">Flow regime changed</option>\n          </optgroup>\n          <optgroup label="Geomorphology · Evolved terrain / rebuilt drainage (WG-7B)">'''
          if old not in s: raise SystemExit('index WG-7B optgroup marker missing')
          s = s.replace(old, new, 1)
          s = s.replace('Generate one deterministic physical planet through WG-7B, then inspect', 'Generate one deterministic physical planet through WG-7C, then inspect', 1)
          old = '<p>The WG-4 ocean mask/coastline remains fixed in WG-7B v1. Drainage is rebuilt exactly once on the evolved surface and accepted WG-6B local runoff is rerouted over that new DAG for post-erosion diagnostics; climate, lake equilibrium, and seasonal hydrology are not iterated. Coastline migration, evolving lake capacity/spill thresholds, delta/coastal construction, hillslope transport, glaciers, weathering/soil/lithology, resources, Regions, Features, and gameplay integration remain downstream.</p>'
          new = '<p>The WG-4 ocean mask/coastline remains fixed. WG-7B rebuilds drainage once on the evolved surface; WG-7C then rebinds the exact accepted local runoff to that DAG, recomputes lake equilibrium against evolved elevation, and reruns seasonal realized flow/lake storage without rerunning WG-5 climate or mutating terrain again. The browser retains the reconciled drainage/runoff/lake/seasonal state as the final hydrology while pre-erosion WG-6 ancestry survives as compact WG-7C hashes and change diagnostics. Coastline migration, sediment-driven lake infill/capacity change, delta/coastal construction, hillslope transport, glaciers, weathering/soil/lithology, resources, Regions, Features, and gameplay integration remain downstream.</p>'
          if old not in s: raise SystemExit('index WG-7B frontier paragraph missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # README pipeline/current ownership.
          p = Path('README.md')
          s = p.read_text()
          s = s.replace('bounded terrain evolution with one post-erosion drainage rebuild, planetary physical profiles', 'bounded terrain evolution with one post-erosion drainage rebuild, final post-erosion hydrology reconciliation, planetary physical profiles', 1)
          old = 'WG-7B bounded terrain evolution + rebuilt drainage\n```'
          if old not in s: raise SystemExit('README pipeline tail missing')
          s = s.replace(old, 'WG-7B bounded terrain evolution + rebuilt drainage\n          ↓\nWG-7C post-erosion hydrology reconciliation\n```', 1)
          old = 'WG-7B applies WG-7A incision over a bounded channel/valley footprint to a distinct evolved terrain state, chooses one adaptive direct geomorphic horizon capped by resolved elevation change, recomputes sediment from the actually applied erosion volume, and conserves that mass into ordinary land deposition plus lake and terminal/ocean sinks. It then rebuilds WG-6A drainage exactly once on the evolved surface and reroutes accepted WG-6B local runoff over that new DAG. WG-4 identity and its ocean mask remain unchanged; WG-5 climate, WG-6C lake equilibrium, and WG-6D seasonal hydrology are not iterated in WG-7B v1.\n'
          new = old + '\nWG-7C closes that deliberate one-stage feedback gap without introducing a climate/terrain iteration loop. It keeps WG-4 sea level/ocean mask and WG-5 climate immutable, rebinds the exact accepted WG-6B local runoff field to the WG-7B drainage graph, recomputes WG-6C lake equilibrium on evolved solid elevation, and reruns WG-6D seasonal lake/realized-flow dynamics. Browser/WASM transport exposes the reconciled drainage/runoff/lake/seasonal state as final hydrology and retains only compact pre/post identities and delta fields rather than a second full seasonal phase state.\n'
          if old not in s: raise SystemExit('README WG-7B paragraph missing')
          s = s.replace(old, new, 1)
          s = s.replace('bash scripts/check-wg7b-evolution.sh\n', 'bash scripts/check-wg7b-evolution.sh\nbash scripts/check-wg7c-reconciliation.sh\n', 1)
          p.write_text(s)

          # Browser regression specific to WG-7C.
          p = Path('tests/wg7Reconciliation.test.ts')
          p.write_text('''import assert from 'node:assert/strict';\nimport fs from 'node:fs';\nimport test from 'node:test';\nimport { WORLDGEN_PROTOCOL_VERSION } from '../dist/worldgen/protocol.js';\n\ntest('WG-7C cumulative browser contract is protocol v17 and memory-conscious', () => {\n  assert.equal(WORLDGEN_PROTOCOL_VERSION, 17);\n  const protocol = fs.readFileSync('src/worldgen/protocol.ts', 'utf8');\n  const worker = fs.readFileSync('src/worldgen/worldgenWorker.ts', 'utf8');\n  const bridge = fs.readFileSync('rust/interlink-worldgen-wasm/src/climate_bridge.rs', 'utf8');\n  const html = fs.readFileSync('index.html', 'utf8');\n  const lab = fs.readFileSync('src/worldgen/diagnostics/worldgenClimateLabStandalone.ts', 'utf8');\n  for (const field of ['reconciliationStage', 'reconciliationMetrics', 'lakeKindChangedMask', 'lakeDepthDeltaM', 'annualRealizedDischargeDeltaM3S', 'flowRegimeChangedMask', 'flowPresenceDelta']) {\n    assert.match(protocol, new RegExp(field));\n    assert.match(worker, new RegExp(field));\n  }\n  assert.match(bridge, /generate_post_erosion_hydrology/);\n  assert.match(bridge, /post-erosion-hydrology/);\n  assert.match(bridge, /reconciliation: PostErosionHydrologyState/);\n  assert.doesNotMatch(bridge, /\\n    seasonal: SeasonalHydrologyState,/);\n  assert.doesNotMatch(bridge, /\\n    runoff: RunoffState,/);\n  assert.doesNotMatch(bridge, /\\n    lakes: LakeState,/);\n  assert.match(worker, /progress\\('packaging', 16, 17/);\n  for (const mode of ['reconciliation-lake-depth-delta', 'reconciliation-lake-change', 'reconciliation-realized-discharge-delta', 'reconciliation-flow-presence-delta', 'reconciliation-flow-regime-change']) {\n    assert.match(html, new RegExp(mode));\n    assert.match(lab, new RegExp(mode));\n  }\n  assert.match(html, /Current physical frontier: WG-7C/);\n  assert.match(lab, /WG-7C reconciliation hash/);\n  assert.match(lab, /reconciliationMetrics\\.preErosionSeasonalHash/);\n  assert.match(lab, /reconciliationMetrics\\.reconciledSeasonalHash/);\n});\n''')

          # WG-7B browser test advances with cumulative protocol while preserving WG-7B coverage.
          p = Path('tests/wg7TerrainEvolution.test.ts')
          s = p.read_text()
          s = s.replace("test('WG-7B cumulative browser contract is protocol v16 and single-request'", "test('WG-7B cumulative browser contract remains present in protocol v17 and single-request'", 1)
          s = s.replace('assert.equal(WORLDGEN_PROTOCOL_VERSION, 16);', 'assert.equal(WORLDGEN_PROTOCOL_VERSION, 17);', 1)
          s = s.replace("assert.match(html, /Current physical frontier: WG-7B/);", "assert.match(html, /Current physical frontier: WG-7C/);", 1)
          p.write_text(s)
          PY
