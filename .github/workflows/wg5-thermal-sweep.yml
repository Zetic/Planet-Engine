name: Temporary WG-5 Thermal Budget Sweep

on:
  push:
    branches: [wg5-thermal-budget-calibration]

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg5-thermal-budget-calibration
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Mixed-layer convergence sweep
        run: |
          set -uo pipefail
          for spec in \
            '0.24 1.20 15.0' \
            '0.24 1.20 18.0' \
            '0.25 1.20 15.0' \
            '0.25 1.20 18.0' \
            '0.25 1.20 20.0'; do
            read -r reflectivity longwave depth <<< "${spec}"
            echo "===== CANDIDATE REFLECTIVITY=${reflectivity} LW=${longwave} DEPTH=${depth} ====="
            git checkout -- rust/interlink-worldgen/src/climate.rs rust/interlink-worldgen/src/climate_calibration.rs
            SW_REFLECTIVITY="${reflectivity}" LW_OPTICAL_DEPTH="${longwave}" HEAT_DIFFUSIVITY=2000000.0 AIR_SEA_EXCHANGE=8.0 MIXED_LAYER_DEPTH="${depth}" HEAT_SOLVER_ITERS=20 \
              python scripts/wg5_thermal_sweep_patch.py
            SURFACE_ALBEDO_COUPLING=0.25 python scripts/wg5_thermal_coupling_patch.py
            cargo fmt --all
            echo '--- L6 acceptance ---'
            cargo run --release -q -p interlink-worldgen-cli -- climate \
              --seed interlink-wg5 --coarse-level 4 --level 6 --plates 16 || echo 'L6_ACCEPTANCE_FAILED'
            echo '--- L7 acceptance ---'
            cargo run --release -q -p interlink-worldgen-cli -- climate \
              --seed ci-wg5-l7 --coarse-level 5 --level 7 --plates 24 || echo 'L7_ACCEPTANCE_FAILED'
          done
