name: Temporary WG-5 Thermal Budget Sweep

on:
  push:
    branches: [wg5-thermal-budget-calibration]

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg5-thermal-budget-calibration
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Trace preferred L7 candidate
        run: |
          set -euo pipefail
          SW_REFLECTIVITY=0.25 LW_OPTICAL_DEPTH=1.20 HEAT_DIFFUSIVITY=2000000.0 AIR_SEA_EXCHANGE=8.0 MIXED_LAYER_DEPTH=15.0 HEAT_SOLVER_ITERS=20 \
            python scripts/wg5_thermal_sweep_patch.py
          SURFACE_ALBEDO_COUPLING=0.25 python scripts/wg5_thermal_coupling_patch.py
          python scripts/wg5_thermal_trace_patch.py
          sed -i 's/maximum_spinup_years: 10/maximum_spinup_years: 24/' rust/interlink-worldgen/src/climate.rs
          cargo fmt --all
          cargo run --release -q -p interlink-worldgen-cli -- climate \
            --seed ci-wg5-l7 --coarse-level 5 --level 7 --plates 24
