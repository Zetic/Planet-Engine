name: Refresh PR61 WASM package

on:
  push:
    branches: [feat/wg4-tectonic-province-topography]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-pr61-wasm
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[wasm-refresh]') }}
    runs-on: ubuntu-latest
    env:
      RUST_VERSION: '1.98.1'
      WASM_BINDGEN_VERSION: '0.2.127'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wg4-tectonic-province-topography
      - name: Install pinned Rust and browser target
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target wasm32-unknown-unknown
          rustup default "${RUST_VERSION}"
      - uses: actions/cache@v4
        id: wasm-bindgen-cache
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: ${{ runner.os }}-wasm-bindgen-cli-${{ env.WASM_BINDGEN_VERSION }}-rust-${{ env.RUST_VERSION }}
      - name: Install pinned wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install --locked wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}"
      - name: Rebuild browser WASM package
        run: npm run build:worldgen-wasm
      - name: Commit refreshed package
        run: |
          if git diff --quiet -- src/wasm-worldgen; then
            echo 'WASM package already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/wasm-worldgen
          git commit -m 'build(wasm): refresh tectonic topography package [wasm-refresh]'
          git push origin HEAD:feat/wg4-tectonic-province-topography
