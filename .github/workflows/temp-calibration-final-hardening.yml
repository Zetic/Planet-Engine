name: Temporary calibration export hardening carrier

on:
  push:
    branches: [llm-calibration-observability]
    paths:
      - '.github/workflows/temp-calibration-final-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: llm-calibration-observability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply hardening patch
        run: python3 scripts/temp-harden-calibration.py
      - name: Validate packet and Pages integration
        run: |
          npm run build
          npm run test:ts
          cargo test -p interlink-worldgen world_calibration --lib
          cargo run --release -p interlink-worldgen-cli --bin calibration-report -- --seed ci-calibration-packet --coarse-level 3 --level 4 --plates 12 --format json > /tmp/planet-calibration.json
          python3 -c "import json; p=json.load(open('/tmp/planet-calibration.json')); assert p['schema']=='planet-engine-calibration@1'; assert p['fidelity']['source']=='native'; assert p['fidelity']['canonical_dual_cell_area'] is True"
      - name: Push validated non-workflow changes
        run: |
          rm scripts/temp-harden-calibration.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- ':!.github/workflows'
          git commit -m "fix(observability): bind packet identity and fidelity"
          git push origin HEAD:llm-calibration-observability
