name: Temporary calibration export hardening carrier

on:
  push:
    branches: [llm-calibration-observability]
    paths:
      - '.github/workflows/temp-calibration-final-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: llm-calibration-observability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Harden packet identity and fidelity metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Browser packet identifies its fidelity limits in-band.
          replace('src/worldgen/calibrationPacket.ts',
                  "    schema: WORLD_CALIBRATION_SCHEMA,\n    run: {",
                  "    schema: WORLD_CALIBRATION_SCHEMA,\n    fidelity: {\n      source: 'github-pages',\n      canonical_dual_cell_area: false,\n      complete_internal_lake_budget: false,\n      approximation_notes: [\n        'continental component area uses equal-sample area because protocol v18 does not transport dual-cell area',\n        'derived topography percentiles and means are unweighted sample summaries',\n        'per-lake gross inflow and evaporation are unavailable in protocol v18 and remain null',\n      ],\n    },\n    run: {")

          replace('src/worldgen/calibrationPacket.ts',
                  "    `Schema: \\`${packet.schema}\\``,\n    `Seed: \\`${seed}\\` · L${result.coarseLevel}",
                  "    `Schema: \\`${packet.schema}\\``,\n    'Fidelity: GitHub Pages packet · equal-sample continental area / unweighted derived topography summaries · partial per-lake budget',\n    `Seed: \\`${seed}\\` · L${result.coarseLevel}")

          # Native serializer advertises that it has canonical topology/lake internals.
          replace('rust/interlink-worldgen/src/world_calibration.rs',
                  '        let _ = writeln!(out, "  \\\"schema\\\": \\\"{}@{}\\\",", WORLD_CALIBRATION_SCHEMA_ID, WORLD_CALIBRATION_SCHEMA_VERSION);\n        let _ = writeln!(out, "  \\\"run\\\": {{");',
                  '        let _ = writeln!(out, "  \\\"schema\\\": \\\"{}@{}\\\",", WORLD_CALIBRATION_SCHEMA_ID, WORLD_CALIBRATION_SCHEMA_VERSION);\n        let _ = writeln!(out, "  \\\"fidelity\\\": {{\\\"source\\\":\\\"native\\\",\\\"canonical_dual_cell_area\\\":true,\\\"complete_internal_lake_budget\\\":true,\\\"approximation_notes\\\":[]}},");\n        let _ = writeln!(out, "  \\\"run\\\": {{");')

          replace('rust/interlink-worldgen/src/world_calibration.rs',
                  '        let _ = writeln!(out, "Schema: `{}@{}`", WORLD_CALIBRATION_SCHEMA_ID, WORLD_CALIBRATION_SCHEMA_VERSION);\n        let _ = writeln!(out, "Seed:',
                  '        let _ = writeln!(out, "Schema: `{}@{}`", WORLD_CALIBRATION_SCHEMA_ID, WORLD_CALIBRATION_SCHEMA_VERSION);\n        let _ = writeln!(out, "Fidelity: native canonical dual-cell areas + complete internal lake budget");\n        let _ = writeln!(out, "Seed:')

          controller = Path('src/worldgen/diagnostics/worldgenClimateLabStandalone.ts')
          text = controller.read_text()
          marker = 'let current: WorldgenClimateResult | null = null;'
          if marker not in text:
              raise SystemExit('current result declaration not found')
          text = text.replace(marker, marker + "\nlet currentCalibrationRequest: { seed: string; plateCount: number } | null = null;", 1)
          text = text.replace('function calibrationFileStem(): string {\n  const normalized = seed.value.trim()', 'function calibrationFileStem(value: string): string {\n  const normalized = value.trim()', 1)
          text = text.replace('  if (!current) return;\n  try {\n    await navigator.clipboard.writeText(worldCalibrationMarkdown(current, seed.value, Number(plates.value)));', '  if (!current || !currentCalibrationRequest) return;\n  try {\n    await navigator.clipboard.writeText(worldCalibrationMarkdown(current, currentCalibrationRequest.seed, currentCalibrationRequest.plateCount));', 1)
          text = text.replace('  if (!current) return;\n  const blob = new Blob([worldCalibrationJson(current, seed.value, Number(plates.value))]', '  if (!current || !currentCalibrationRequest) return;\n  const blob = new Blob([worldCalibrationJson(current, currentCalibrationRequest.seed, currentCalibrationRequest.plateCount)]', 1)
          text = text.replace('anchor.download = `planet-calibration-${calibrationFileStem()}.json`;', 'anchor.download = `planet-calibration-${calibrationFileStem(currentCalibrationRequest.seed)}.json`;', 1)
          text = text.replace('    current = loaded;\n    copyCalibration.disabled = false;', '    current = loaded;\n    currentCalibrationRequest = { seed: request.seed, plateCount: request.plateCount };\n    copyCalibration.disabled = false;', 1)
          controller.write_text(text)

          test = Path('tests/calibrationPacket.test.ts')
          text = test.read_text()
          text = text.replace('    assert.match(packet, /RANKED_LIMIT = 8/);', "    assert.match(packet, /RANKED_LIMIT = 8/);\n    assert.match(packet, /canonical_dual_cell_area: false/);\n    assert.match(packet, /approximation_notes/);")
          text = text.replace("    assert.match(controller, /worldCalibrationJson/);", "    assert.match(controller, /worldCalibrationJson/);\n    assert.match(controller, /currentCalibrationRequest/);\n    assert.match(controller, /seed: request.seed, plateCount: request.plateCount/);")
          test.write_text(text)

          docs = Path('docs/worldgen-rewrite/CALIBRATION_OBSERVABILITY.md')
          text = docs.read_text()
          text = text.replace('The browser does not export raw per-cell arrays. It aggregates them locally first. Because protocol v18 does not transport dual-cell area or every internal per-lake water-budget term, the Pages packet estimates continental component area from equal sample area and leaves unavailable per-lake terms null.', 'The browser does not export raw per-cell arrays. It aggregates them locally first. Because protocol v18 does not transport dual-cell area or every internal per-lake water-budget term, the Pages packet estimates continental component area from equal sample area, uses unweighted sample summaries for derived topography percentiles/means, and leaves unavailable per-lake terms null. These limitations are recorded in the packet itself under `fidelity`, so a detached JSON/Markdown export remains self-describing.')
          docs.write_text(text)
          PY
          npm run build
          npm run test:ts
          cargo test -p interlink-worldgen world_calibration --lib
          cargo run --release -p interlink-worldgen-cli --bin calibration-report -- --seed ci-calibration-packet --coarse-level 3 --level 4 --plates 12 --format json > /tmp/planet-calibration.json
          python3 - <<'PY'
          import json
          packet=json.load(open('/tmp/planet-calibration.json'))
          assert packet['schema']=='planet-engine-calibration@1'
          assert packet['fidelity']['source']=='native'
          assert packet['fidelity']['canonical_dual_cell_area'] is True
          PY
      - name: Push validated non-workflow changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- ':!.github/workflows'
          git commit -m "fix(observability): bind packet identity and fidelity"
          git push origin HEAD:llm-calibration-observability
