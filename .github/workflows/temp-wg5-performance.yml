name: Temporary WG-5 Performance Experiment

on:
  push:
    branches:
      - wg5-performance

jobs:
  evaluate-atmospheric-exit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Establish L6 baseline
        run: |
          RUNS=1 bash scripts/benchmark-wg5-performance.sh l6 | tee /tmp/wg5-before-bench.txt
          cargo run --release -q -p interlink-worldgen-cli -- climate \
            --seed ci-wg5-performance --coarse-level 4 --level 6 --plates 16 \
            | tee /tmp/wg5-before-detail.txt
      - name: Apply atmospheric relative-residual exit
        run: |
          python scripts/temp-wg5-performance-experiment.py
          rustfmt --edition 2021 rust/interlink-worldgen/src/climate.rs
          cargo test -p interlink-worldgen --lib --no-run
      - name: Benchmark candidate twice
        run: |
          RUNS=1 bash scripts/benchmark-wg5-performance.sh l6 | tee /tmp/wg5-after-1.txt
          RUNS=1 bash scripts/benchmark-wg5-performance.sh l6 | tee /tmp/wg5-after-2.txt
          cargo run --release -q -p interlink-worldgen-cli -- climate \
            --seed ci-wg5-performance --coarse-level 4 --level 6 --plates 16 \
            | tee /tmp/wg5-after-detail.txt
      - name: Compare L6 performance and physics
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          def bench(path):
              text = Path(path).read_text()
              run = re.search(
                  r'run=1 climate_ms=([0-9.]+).*?spinup_years=(\d+).*?mean_temperature_k=([0-9.]+) '
                  r'mean_precipitation_mm=([0-9.]+) moisture_error=([^ ]+) climate_hash=([0-9a-f]+)',
                  text,
              )
              if not run:
                  raise SystemExit(f'benchmark output missing in {path}')
              return {
                  'ms': float(run.group(1)), 'years': int(run.group(2)),
                  'temp': float(run.group(3)), 'precip': float(run.group(4)),
                  'moisture': float(run.group(5)), 'hash': run.group(6),
              }

          def detail(path):
              text = Path(path).read_text()
              temp = re.search(
                  r'temperature_k min=([^ ]+) mean=([^ ]+) max=([^ ]+) land_mean=([^ ]+) ocean_mean=([^ ]+) final_rms_change=([^\n]+)', text)
              wind = re.search(r'winds_m_s mean=([^ ]+) max=([^\n]+)', text)
              precip = re.search(r'precipitation_mm_year mean=([^ ]+) p95=([^\n]+)', text)
              moisture = re.search(r'moisture_budget .*? relative_error=([^\n]+)', text)
              identity = re.search(r'climate_hash=([0-9a-f]+)', text)
              if not all((temp, wind, precip, moisture, identity)):
                  raise SystemExit(f'detailed climate output missing in {path}')
              return {
                  'hash': identity.group(1), 'temp': float(temp.group(2)),
                  'land': float(temp.group(4)), 'ocean': float(temp.group(5)),
                  'rms': float(temp.group(6)), 'wind_mean': float(wind.group(1)),
                  'wind_max': float(wind.group(2)), 'precip': float(precip.group(1)),
                  'precip_p95': float(precip.group(2)), 'moisture': float(moisture.group(1)),
              }

          before = bench('/tmp/wg5-before-bench.txt')
          after1 = bench('/tmp/wg5-after-1.txt')
          after2 = bench('/tmp/wg5-after-2.txt')
          before_detail = detail('/tmp/wg5-before-detail.txt')
          after_detail = detail('/tmp/wg5-after-detail.txt')
          if before['hash'] != 'd8129323cf26fd1f':
              raise SystemExit(f'unexpected baseline hash {before["hash"]}')
          if after1['hash'] != after2['hash'] or after1['hash'] != after_detail['hash']:
              raise SystemExit('candidate is not deterministic across repeated L6 runs')
          reduction = (1.0 - after1['ms'] / before['ms']) * 100.0
          print(f'wg5_atmos_exit_performance before_ms={before["ms"]:.3f} after_ms={after1["ms"]:.3f} reduction={reduction:.2f}%')
          print(f'wg5_atmos_exit_identity before_hash={before["hash"]} after_hash={after1["hash"]} after_repeat_hash={after2["hash"]}')
          print(
              'wg5_atmos_exit_physics '
              f'temp_delta_k={after_detail["temp"]-before_detail["temp"]:+.6f} '
              f'land_temp_delta_k={after_detail["land"]-before_detail["land"]:+.6f} '
              f'ocean_temp_delta_k={after_detail["ocean"]-before_detail["ocean"]:+.6f} '
              f'rms_before={before_detail["rms"]:.6f} rms_after={after_detail["rms"]:.6f} '
              f'precip_delta_mm={after_detail["precip"]-before_detail["precip"]:+.6f} '
              f'precip_p95_delta_mm={after_detail["precip_p95"]-before_detail["precip_p95"]:+.6f} '
              f'wind_mean_delta={after_detail["wind_mean"]-before_detail["wind_mean"]:+.6f} '
              f'wind_max_delta={after_detail["wind_max"]-before_detail["wind_max"]:+.6f} '
              f'moisture_error={after_detail["moisture"]:.6e} spinup_years={after1["years"]}'
          )
          if reduction < 5.0:
              raise SystemExit('candidate speedup is below 5% numerical-optimization threshold')
          if after_detail['rms'] > 0.08:
              raise SystemExit('candidate violates thermal convergence acceptance')
          if after_detail['moisture'] > 1.0e-10:
              raise SystemExit('candidate violates moisture conservation acceptance')
          if after1['years'] > 10:
              raise SystemExit('candidate exceeds maximum spin-up years')
          PY
