name: Temporary WG-6D Rustfmt Cleanup

on:
  pull_request:

permissions:
  contents: write

jobs:
  clean:
    if: github.event.pull_request.head.ref == 'wg6d-seasonal-hydrology'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Restore unrelated Rust files from main
        run: |
          git fetch origin main
          git checkout origin/main -- \
            rust/interlink-worldgen-cli/examples/drainage_performance.rs \
            rust/interlink-worldgen-cli/examples/hydroclimate_closure.rs \
            rust/interlink-worldgen/src/hydroclimate.rs \
            rust/interlink-worldgen/tests/crust_plate_independence.rs \
            rust/interlink-worldgen/tests/geology_ensemble.rs \
            rust/interlink-worldgen/tests/tectonic_plate_distribution.rs \
            rust/interlink-worldgen/tests/topography_ensemble.rs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/interlink-worldgen-cli/examples/drainage_performance.rs rust/interlink-worldgen-cli/examples/hydroclimate_closure.rs rust/interlink-worldgen/src/hydroclimate.rs rust/interlink-worldgen/tests/crust_plate_independence.rs rust/interlink-worldgen/tests/geology_ensemble.rs rust/interlink-worldgen/tests/tectonic_plate_distribution.rs rust/interlink-worldgen/tests/topography_ensemble.rs
          git commit -m "Remove unrelated WG-6D formatting noise"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
