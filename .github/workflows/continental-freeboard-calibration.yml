name: Continental Freeboard Calibration

on:
  pull_request:
    paths:
      - 'rust/interlink-worldgen/**'
      - 'rust/interlink-worldgen-cli/examples/continental_freeboard_diagnostic.rs'
      - '.github/workflows/continental-freeboard-calibration.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    name: Continental freeboard diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run continental freeboard diagnostic
        run: cargo run --release -p interlink-worldgen-cli --example continental_freeboard_diagnostic
