name: Transitional Margin Calibration

on:
  pull_request:
    paths:
      - 'rust/interlink-worldgen/**'
      - 'rust/interlink-worldgen-cli/examples/continental_hypsometry_acceptance.rs'
      - '.github/workflows/transitional-margin-calibration.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  calibration:
    name: Production transitional-margin calibration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Verify production margin and hypsometry state
        run: cargo run --release -p interlink-worldgen-cli --example continental_hypsometry_acceptance
