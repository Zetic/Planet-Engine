name: PR87 Refresh Generated Artifacts

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: write

concurrency:
  group: pr87-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.head_ref == 'interlink-pr87-calibration-causal-observability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Node dependencies
        run: npm ci
      - name: Install pinned Rust and browser target
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.98.1
      - name: Install pinned wasm-bindgen CLI
        run: cargo +1.98.1 install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Rebuild committed browser output
        run: npm run build
      - name: Rebuild committed browser WASM package
        run: npm run build:worldgen-wasm
      - name: Commit generated artifacts
        run: |
          git add dist src/wasm-worldgen
          if git diff --cached --quiet; then
            echo "Generated artifacts already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh calibration browser artifacts"
          git push origin HEAD:${{ github.head_ref }}
