name: Temporary WG-4 Ridge Response Profiles

on:
  push:
    branches:
      - wg4-ridge-response-calibration

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Baseline ridge profile
        run: cargo run --release -p interlink-worldgen-cli --example wg4_ridge_depth_profiles
      - name: Oceanic base 0.10 / amplitude 0.75
        run: |
          git checkout -- rust/interlink-worldgen/src/topography.rs
          python3 scripts/temp-wg4-ridge-profile.py --base 0.10 --multiplier 0.75 --width-km 450
          cargo run --release -p interlink-worldgen-cli --example wg4_ridge_depth_profiles
      - name: Oceanic base 0.10 / amplitude 0.50
        run: |
          git checkout -- rust/interlink-worldgen/src/topography.rs
          python3 scripts/temp-wg4-ridge-profile.py --base 0.10 --multiplier 0.50 --width-km 450
          cargo run --release -p interlink-worldgen-cli --example wg4_ridge_depth_profiles
      - name: Oceanic base 0.10 / amplitude 0.35
        run: |
          git checkout -- rust/interlink-worldgen/src/topography.rs
          python3 scripts/temp-wg4-ridge-profile.py --base 0.10 --multiplier 0.35 --width-km 450
          cargo run --release -p interlink-worldgen-cli --example wg4_ridge_depth_profiles
      - name: Oceanic base 0.00 / amplitude 0.50
        run: |
          git checkout -- rust/interlink-worldgen/src/topography.rs
          python3 scripts/temp-wg4-ridge-profile.py --base 0.00 --multiplier 0.50 --width-km 450
          cargo run --release -p interlink-worldgen-cli --example wg4_ridge_depth_profiles
