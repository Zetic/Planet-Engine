name: Validate WG-4.5 lithology substrate

on:
  push:
    branches:
      - feat/wg45-lithology-substrate

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wg45-lithology-substrate
          fetch-depth: 0
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Apply WG-4.5 wiring
        run: python3 scripts/apply-wg45-lithology-wiring.py
      - name: Format
        run: cargo fmt --all
      - name: Compile workspace
        run: cargo check --workspace --all-targets
      - name: Verify lithology substrate
        run: cargo run --release -p interlink-worldgen-cli --example lithology_substrate_acceptance
      - name: Commit validated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/interlink-worldgen/src/lib.rs \
            rust/interlink-worldgen/src/lithology.rs \
            rust/interlink-worldgen-cli/examples/lithology_substrate_acceptance.rs
          git commit -m 'feat(worldgen): establish lithology substrate' || exit 0
          git push origin HEAD:feat/wg45-lithology-substrate
