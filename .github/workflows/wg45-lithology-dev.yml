name: Validate WG-4.5 lithology substrate

on:
  push:
    branches:
      - feat/wg45-lithology-substrate

permissions:
  contents: write

env:
  RUST_VERSION: '1.98.1'
  WASM_BINDGEN_VERSION: '0.2.127'

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wg45-lithology-substrate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Rust
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target wasm32-unknown-unknown
          rustup default "${RUST_VERSION}"
      - name: Install pinned wasm-bindgen CLI
        run: cargo +${RUST_VERSION} install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - run: npm ci
      - name: Apply WG-4.5 wiring
        run: |
          python3 scripts/apply-wg45-lithology-wiring.py || true
          python3 scripts/apply-wg45-browser-wiring.py
          python3 scripts/fix-wg45-browser-metrics.py
          python3 scripts/fix-wg45-protocol-v22.py
          python3 scripts/apply-wg45-calibration-wiring.py
      - name: Format
        run: cargo fmt --all
      - name: Compile workspace
        run: cargo check --workspace --all-targets
      - name: Verify lithology substrate
        run: cargo run --release -p interlink-worldgen-cli --example lithology_substrate_acceptance
      - name: Verify calibration identity
        run: |
          cargo run --release -p interlink-worldgen-cli --bin calibration-report -- --seed interlink-wg7c --coarse-level 3 --level 4 --plates 12 --format json > /tmp/wg45-calibration.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/wg45-calibration.json'))
          assert p['run']['engine_version'] == 21
          assert p['hashes']['lithology']
          PY
      - name: Compile browser bridge
        run: cargo check -p interlink-worldgen-wasm --target wasm32-unknown-unknown
      - name: Rebuild browser WASM package
        run: npm run build:worldgen-wasm
      - name: Build browser modules
        run: npm run build
      - name: Run browser regressions
        run: npm run test:ts
      - name: Commit validated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/interlink-worldgen/src/lib.rs \
            rust/interlink-worldgen/src/lithology.rs \
            rust/interlink-worldgen/src/world_calibration.rs \
            rust/interlink-worldgen-cli/src/bin/calibration-report.rs \
            rust/interlink-worldgen-cli/examples/lithology_substrate_acceptance.rs \
            rust/interlink-worldgen-wasm/src/lib.rs \
            rust/interlink-worldgen-wasm/src/climate_bridge.rs \
            src/worldgen/protocol.ts \
            src/worldgen/worldgenWorker.ts \
            src/worldgen/diagnostics/worldgenClimateLabStandalone.ts \
            src/worldgen/calibrationPacket.ts \
            index.html \
            tests \
            dist/worldgen \
            src/wasm-worldgen
          git commit -m 'feat(worldgen): expose WG-4.5 lithology substrate' || exit 0
          git push origin HEAD:feat/wg45-lithology-substrate
