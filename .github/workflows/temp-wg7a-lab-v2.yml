name: Temporary WG-7A Lab Integration V2

on:
  pull_request:

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'wg7a-fluvial-erosion-sediment'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg7a-fluvial-erosion-sediment
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Apply WG-7A Lab integration
        run: |
          python scripts/temp-wg7a-lab.py
          python scripts/temp-wg7a-lab-testfix.py
      - name: Build and test cumulative browser Lab
        run: |
          npm run build
          npm run test:ts
      - name: Remove temporary tooling
        run: |
          rm -f scripts/temp-wg7a-lab.py
          rm -f scripts/temp-wg7a-lab-testfix.py
          rm -f .github/workflows/temp-wg7a-lab-v2.yml
      - name: Commit WG-7A Lab integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate WG-7A into the cumulative Planet Engine Lab'
          git push origin HEAD:wg7a-fluvial-erosion-sediment
