name: Temporary WG-7A Browser Integration

on:
  pull_request:

permissions:
  contents: write

env:
  RUST_VERSION: '1.98.1'
  WASM_BINDGEN_VERSION: '0.2.127'

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'wg7a-fluvial-erosion-sediment'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg7a-fluvial-erosion-sediment
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser dependencies
        run: npm ci
      - name: Install pinned Rust and browser target
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup default "${RUST_VERSION}"
      - name: Restore wasm-bindgen CLI cache
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: ${{ runner.os }}-wasm-bindgen-cli-${{ env.WASM_BINDGEN_VERSION }}-rust-${{ env.RUST_VERSION }}
      - name: Install pinned wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo +${RUST_VERSION} install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - name: Apply WG-7A browser integration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/temp-wg7a-browser.py')
          text = path.read_text()
          bad = '    raise SystemExit(f"worker packaging progress: expected two targets, found {text.count("progress(\'packaging\', 13, 14,")}")'
          good = '    raise SystemExit("worker packaging progress: expected two targets, found " + str(text.count("progress(\'packaging\', 13, 14,")))'
          if bad not in text:
              raise SystemExit('temporary transformer repair target not found')
          path.write_text(text.replace(bad, good, 1))
          PY
          python scripts/temp-wg7a-browser.py
          rustfmt --edition 2021 rust/interlink-worldgen-wasm/src/climate_bridge.rs rust/interlink-worldgen-wasm/src/lib.rs
      - name: Validate Rust and rebuild committed WASM package
        run: |
          cargo check -p interlink-worldgen-wasm --target wasm32-unknown-unknown
          npm run build:worldgen-wasm
          cargo test --workspace
          bash scripts/check-wg7a-erosion.sh
      - name: Build and test browser protocol
        run: |
          npm run build
          npm run test:ts
      - name: Remove temporary tooling
        run: |
          rm -f scripts/temp-wg7a-browser.py
          rm -f .github/workflows/temp-wg7a-browser.yml
      - name: Commit WG-7A browser integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Expose WG-7A erosion through browser and WASM'
          git push origin HEAD:wg7a-fluvial-erosion-sediment
