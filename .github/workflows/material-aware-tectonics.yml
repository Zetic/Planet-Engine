name: Material-Aware Tectonic Identity

on:
  pull_request:
    paths:
      - 'rust/interlink-worldgen/**'
      - 'rust/interlink-worldgen-cli/examples/plate_crust_identity_acceptance.rs'
      - '.github/workflows/material-aware-tectonics.yml'
  push:
    branches: [main]
    paths:
      - 'rust/interlink-worldgen/**'
      - 'rust/interlink-worldgen-cli/examples/plate_crust_identity_acceptance.rs'
      - '.github/workflows/material-aware-tectonics.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    name: Plate / crust identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Compile worldgen targets
        run: cargo check -p interlink-worldgen -p interlink-worldgen-cli --all-targets
      - name: Verify material-aware plate/crust relationship
        run: cargo run --release -p interlink-worldgen-cli --example plate_crust_identity_acceptance
      - name: Preserve boundary geometry gate
        run: cargo run --release -p interlink-worldgen-cli --example boundary_network_geometry_acceptance
