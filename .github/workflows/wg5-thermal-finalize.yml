name: Temporary WG-5 Thermal Production Finalization

on:
  push:
    branches: [wg5-thermal-budget-calibration]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg5-thermal-budget-calibration
          fetch-depth: 0
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Apply selected stage-3 thermal model
        run: |
          set -euo pipefail
          SW_REFLECTIVITY=0.25 LW_OPTICAL_DEPTH=1.20 HEAT_DIFFUSIVITY=2000000.0 AIR_SEA_EXCHANGE=8.0 MIXED_LAYER_DEPTH=14.0 HEAT_SOLVER_ITERS=20 \
            python scripts/wg5_thermal_sweep_patch.py
          SURFACE_ALBEDO_COUPLING=0.25 python scripts/wg5_thermal_coupling_patch.py
          python scripts/wg5_thermal_finalize_patch.py
          python scripts/wg5_thermal_finalize_test_patch.py
          python scripts/wg5_thermal_airless_patch.py
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Validate Rust workspace
        run: cargo test --workspace
      - name: Run WG-5 quality calibration ensemble
        run: bash scripts/run-wg5-calibration.sh quality
      - name: Restore wasm-bindgen CLI cache
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: ${{ runner.os }}-wasm-bindgen-cli-0.2.127
      - name: Install pinned wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Install browser dependencies
        run: npm ci
      - name: Rebuild committed browser WASM package
        run: npm run build:worldgen-wasm
      - name: Validate browser build and contracts
        run: |
          npm run build
          npm run test:ts
      - name: Commit production WG-5 thermal changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            rust/interlink-worldgen/src/climate.rs \
            rust/interlink-worldgen/src/climate_calibration.rs \
            rust/interlink-worldgen/tests/climate_calibration.rs \
            rust/interlink-worldgen/tests/climate_ensemble.rs \
            rust/interlink-worldgen-cli/examples/climate_calibration.rs \
            rust/interlink-worldgen-wasm/src/climate_bridge.rs \
            rust/interlink-worldgen-wasm/tests/climate_bridge.rs \
            docs/worldgen-rewrite/WG5_CLIMATE.md \
            docs/worldgen-rewrite/WG5_CALIBRATION.md \
            src/wasm-worldgen
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No production changes staged'; exit 1; }
          git commit -m 'Rebuild WG-5 thermal budget and heat redistribution'
          git push origin HEAD:wg5-thermal-budget-calibration
