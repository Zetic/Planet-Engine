name: Temporary WG-7A Fixed Ancestry

on:
  pull_request:

permissions:
  contents: write

jobs:
  benchmark:
    if: github.event.pull_request.head.ref == 'wg7a-fluvial-erosion-sediment'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg7a-fluvial-erosion-sediment
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Benchmark accepted WG-5 ancestry
        run: |
          set -euxo pipefail
          cargo run --release -p interlink-worldgen-cli --example erosion_performance -- --seed ci-wg5-l7 --coarse-level 5 --level 6 --plates 24 --runs 3
          cargo run --release -p interlink-worldgen-cli --example erosion_performance -- --seed ci-wg5-l7 --coarse-level 5 --level 7 --plates 24 --runs 3
      - name: Remove temporary workflow
        run: rm -f .github/workflows/temp-wg7a-ancestry.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary WG-7A ancestry diagnostic'
          git push origin HEAD:wg7a-fluvial-erosion-sediment
