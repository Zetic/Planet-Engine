name: Temporary WG-6D Lab Integration

on:
  pull_request:

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'wg6d-seasonal-hydrology'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Add cumulative WG-6D Lab diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match for replacement, found {count}')
              p.write_text(text.replace(old, new, 1))

          lab = 'src/worldgen/diagnostics/worldgenClimateLabStandalone.ts'
          replace_once(
              lab,
              "    case 'seasonal-precipitation': return { values: seasonalPhaseRate(result.precipitationPhaseRateMmYear, result.metrics.orbitalPhaseCount, result.metrics.fineSampleCount, phase, seasonalScratch), minimum: 0, maximum: 5_000, lowHue: 45, highHue: 205 };\n",
              """    case 'seasonal-precipitation': return { values: seasonalPhaseRate(result.precipitationPhaseRateMmYear, result.metrics.orbitalPhaseCount, result.metrics.fineSampleCount, phase, seasonalScratch), minimum: 0, maximum: 5_000, lowHue: 45, highHue: 205 };\n    case 'seasonal-realized-discharge': {\n      seasonalPhaseRate(result.seasonalPhaseRealizedDischargeM3S, result.seasonalMetrics.orbitalPhaseCount, result.seasonalMetrics.sampleCount, phase, seasonalScratch);\n      for (let index = 0; index < scalarScratch.length; index += 1) scalarScratch[index] = Math.log1p(Math.max(0, seasonalScratch[index]!));\n      return { values: scalarScratch, minimum: 0, maximum: Math.log1p(Math.max(1e-6, result.seasonalMetrics.maximumPhaseRealizedDischargeM3S)), lowHue: 205, highHue: 25 };\n    }\n    case 'seasonal-flow-presence': return { values: result.seasonalFlowPresenceFraction, minimum: 0, maximum: 1, lowHue: 42, highHue: 205 };\n    case 'seasonal-snow-storage': {\n      seasonalPhaseRate(result.seasonalPhaseSnowStorageMm, result.seasonalMetrics.orbitalPhaseCount, result.seasonalMetrics.sampleCount, phase, seasonalScratch);\n      for (let index = 0; index < scalarScratch.length; index += 1) {\n        const value = Math.max(0, seasonalScratch[index]!);\n        scalarScratch[index] = value / (value + 500);\n      }\n      return { values: scalarScratch, minimum: 0, maximum: 1, lowHue: 225, highHue: 175 };\n    }\n""",
          )
          replace_once(
              lab,
              "  if (mode === 'structural-zones') return structuralColor(result.structuralZoneKind[sample]!);\n",
              """  if (mode === 'structural-zones') return structuralColor(result.structuralZoneKind[sample]!);\n  if (mode === 'seasonal-flow-regime') {\n    if (result.submergedMask[sample]) return '#102c43';\n    const regime = result.seasonalFlowRegime[sample]!;\n    if (regime === 2) return '#4ea7dd';\n    if (regime === 1) return '#e3a54f';\n    return '#31423c';\n  }\n""",
          )
          old_phase_modes = "['seasonal-temperature', 'seasonal-sst', 'seasonal-precipitation']"
          text = Path(lab).read_text()
          if text.count(old_phase_modes) != 2:
              raise SystemExit(f'{lab}: expected two phase-mode cache lists, found {text.count(old_phase_modes)}')
          text = text.replace(old_phase_modes, "['seasonal-temperature', 'seasonal-sst', 'seasonal-precipitation', 'seasonal-realized-discharge', 'seasonal-snow-storage']")
          Path(lab).write_text(text)
          replace_once(
              lab,
              "  'lake-equilibrium': 'Lake equilibrium',\n  packaging: 'Packaging / transfer',",
              "  'lake-equilibrium': 'Lake equilibrium',\n  'seasonal-hydrology': 'Seasonal hydrology',\n  packaging: 'Packaging / transfer',",
          )
          replace_once(
              lab,
              "  metric(metrics, 'WG-6C lake hash', result.lakeMetrics.lakeHash);\n}",
              """  metric(metrics, 'WG-6C lake hash', result.lakeMetrics.lakeHash);\n  metric(metrics, 'WG-6D / stage', `v${result.engineVersion} · ${result.seasonalStage.id}@${result.seasonalStage.version}`);\n  metric(metrics, 'WG-6D flow regimes', `${result.seasonalMetrics.dryFlowSampleCount.toLocaleString()} dry · ${result.seasonalMetrics.intermittentFlowSampleCount.toLocaleString()} intermittent · ${result.seasonalMetrics.perennialFlowSampleCount.toLocaleString()} perennial`);\n  metric(metrics, 'WG-6D snowmelt runoff', `${(result.seasonalMetrics.snowmeltRunoffFraction * 100).toFixed(2)}% of seasonal runoff timing`);\n  metric(metrics, 'WG-6D max phase realized flow', `${result.seasonalMetrics.maximumPhaseRealizedDischargeM3S.toFixed(1)} m³/s`);\n  metric(metrics, 'WG-6D routing / water closure', `${result.seasonalMetrics.seasonalRoutingConservationRelativeError.toExponential(2)} / ${result.seasonalMetrics.seasonalWaterBalanceRelativeError.toExponential(2)}`);\n  metric(metrics, 'WG-6D lake cycle', `${result.seasonalMetrics.lakeSpinupYears} years · ${result.seasonalMetrics.finalLakeSurfaceCycleChangeM.toFixed(4)} m surface drift · ${result.seasonalMetrics.maximumSeasonalLakeLevelRangeM.toFixed(3)} m max seasonal range`);\n  metric(metrics, 'WG-6D seasonal hash', result.seasonalMetrics.seasonalHydrologyHash);\n}",
          )
          replace_once(
              lab,
              "    if (loaded.lakeMetrics.runoffHash !== loaded.runoffMetrics.runoffHash) throw new Error('WG-6C runoff identity does not match accepted WG-6B runoff.');\n",
              """    if (loaded.lakeMetrics.runoffHash !== loaded.runoffMetrics.runoffHash) throw new Error('WG-6C runoff identity does not match accepted WG-6B runoff.');\n    if (loaded.seasonalMetrics.climateHash !== loaded.metrics.climateHash) throw new Error('WG-6D climate identity does not match accepted WG-5 forcing.');\n    if (loaded.seasonalMetrics.drainageHash !== loaded.drainageMetrics.drainageHash) throw new Error('WG-6D drainage identity does not match accepted WG-6A topology.');\n    if (loaded.seasonalMetrics.runoffHash !== loaded.runoffMetrics.runoffHash) throw new Error('WG-6D runoff identity does not match accepted WG-6B runoff.');\n    if (loaded.seasonalMetrics.lakeHash !== loaded.lakeMetrics.lakeHash) throw new Error('WG-6D lake identity does not match accepted WG-6C state.');\n""",
          )
          replace_once(
              lab,
              "  status.textContent = 'Generating one physical planet through WG-5 coupled climate in Rust/WASM…';",
              "  status.textContent = 'Generating one physical planet through WG-6D seasonal hydrology in Rust/WASM…';",
          )
          replace_once(
              lab,
              "    generationStep.textContent = `${loaded.metrics.spinupYears} climate spin-up years · ${loaded.drainageMetrics.basinCount.toLocaleString()} basins · ${loaded.lakeMetrics.lakeCount.toLocaleString()} equilibrium lakes`;\n    generationTimer.textContent = formatDuration(performance.now() - generationStartedAt);\n    status.textContent = `Planet ready through WG-6C: ${loaded.metrics.fineSampleCount.toLocaleString()} samples, ${loaded.lakeMetrics.lakeCount.toLocaleString()} equilibrium lakes, max realized discharge ${loaded.lakeMetrics.maximumRealizedDischargeM3S.toFixed(1)} m³/s.`;",
              """    generationStep.textContent = `${loaded.metrics.spinupYears} climate spin-up years · ${loaded.drainageMetrics.basinCount.toLocaleString()} basins · ${loaded.lakeMetrics.lakeCount.toLocaleString()} equilibrium lakes · ${loaded.seasonalMetrics.intermittentFlowSampleCount.toLocaleString()} intermittent flow cells`;\n    generationTimer.textContent = formatDuration(performance.now() - generationStartedAt);\n    status.textContent = `Planet ready through WG-6D: ${loaded.metrics.fineSampleCount.toLocaleString()} samples, ${loaded.lakeMetrics.lakeCount.toLocaleString()} equilibrium lakes, ${loaded.seasonalMetrics.intermittentFlowSampleCount.toLocaleString()} intermittent and ${loaded.seasonalMetrics.perennialFlowSampleCount.toLocaleString()} perennial realized-flow cells.`;""",
          )

          index = 'index.html'
          replace_once(index, '<title>Planet Engine · Through WG-6C</title>', '<title>Planet Engine · Through WG-6D</title>')
          replace_once(index, '<p class="worldgen-lab-kicker">PLANET ENGINE · THROUGH WG-6C</p>', '<p class="worldgen-lab-kicker">PLANET ENGINE · THROUGH WG-6D</p>')
          replace_once(index, 'Generate one deterministic physical planet through WG-6C, then inspect topology, tectonics, geology, lithosphere, topography, climate, and terrain-driven drainage from one matched physical surface.', 'Generate one deterministic physical planet through WG-6D, then inspect topology, tectonics, geology, lithosphere, topography, climate, drainage, lakes, snowmelt timing, and seasonal realized flow from one matched physical state.')
          replace_once(index, 'value="interlink-wg6c"', 'value="interlink-wg6d"')
          replace_once(
              index,
              '          <optgroup label="Hydrology · Lakes / realized flow (WG-6C)">',
              '''          <optgroup label="Hydrology · Seasonal flow / storage (WG-6D)">\n            <option value="seasonal-realized-discharge">Seasonal realized discharge</option>\n            <option value="seasonal-flow-presence">Realized-flow presence fraction</option>\n            <option value="seasonal-flow-regime">Intermittent / perennial flow regime</option>\n            <option value="seasonal-snow-storage">Seasonal snow storage</option>\n          </optgroup>\n          <optgroup label="Hydrology · Lakes / realized flow (WG-6C)">''',
          )
          replace_once(index, '<strong>Current physical frontier: WG-6C</strong>', '<strong>Current physical frontier: WG-6D</strong>')
          replace_once(
              index,
              '<p>One generation runs the accepted topology, tectonic, geological, lithospheric, multiresolution inheritance, WG-4 topography, WG-5 coupled climate, WG-6A drainage topology, WG-6B annual runoff/discharge, and WG-6C lake equilibrium in one cumulative Rust/WASM result. WG-6C is required to reference the exact accepted WG-5, WG-6A, and WG-6B identities.</p>',
              '<p>One generation runs the accepted topology, tectonic, geological, lithospheric, multiresolution inheritance, WG-4 topography, WG-5 coupled climate, WG-6A drainage topology, WG-6B annual runoff/discharge, WG-6C lake equilibrium, and WG-6D seasonal hydrology in one cumulative Rust/WASM result. WG-6D references the exact accepted WG-5, WG-6A, WG-6B, and WG-6C identities.</p>',
          )
          replace_once(
              index,
              '<p>Overlays remain independent of the selected diagnostic, so drainage basins and contributing area can be compared directly against topographic contours, coastlines, tectonic boundaries, winds, and currents. Seasonal precipitation displays the retained final spin-up-year orbital phases; WG-6A remains terrain-only; WG-6B produces potential routed discharge; WG-6C closes depression water balance into dry basins, endorheic lakes, or overflowing lakes and exposes realized discharge.</p>',
              '<p>Overlays remain independent of the selected diagnostic, so seasonal hydrology can be compared directly against topography, coastlines, tectonic boundaries, winds, and currents. WG-6D uses the retained WG-5 orbital phases, carries snow storage and snowmelt timing, routes phase discharge over WG-6A, and advances WG-6C lake control volumes through the year before classifying realized flow as dry, intermittent, or perennial.</p>',
          )
          replace_once(
              index,
              '<p>The physical surface remains pre-erosional. Seasonal discharge and snowmelt timing, river incision, sediment transport, glacier flow, detailed lithology, resource deposits, Regions, Features, and gameplay integration remain downstream.</p>',
              '<p>The physical surface remains pre-erosional. River incision, sediment transport, glacier flow, detailed lithology, resource deposits, Regions, Features, and gameplay integration remain downstream.</p>',
          )

          pages = Path('tests/pages.test.ts')
          pages.write_text(pages.read_text().replace('through WG-6C', 'through WG-6D'))
          topography_test = Path('tests/wg4Topography.test.ts')
          topography_test.write_text(topography_test.read_text().replace('cumulatively through WG-6C', 'cumulatively through WG-6D'))
          PY
          cat > tests/wg6Seasonal.test.ts <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import test from 'node:test';
          import { WORLDGEN_PROTOCOL_VERSION } from '../dist/worldgen/protocol.js';

          test('WG-6D cumulative browser contract is protocol v14 and single-request', () => {
            assert.equal(WORLDGEN_PROTOCOL_VERSION, 14);
            const protocol = fs.readFileSync('src/worldgen/protocol.ts', 'utf8');
            const worker = fs.readFileSync('src/worldgen/worldgenWorker.ts', 'utf8');
            const lab = fs.readFileSync('src/worldgen/diagnostics/worldgenClimateLabStandalone.ts', 'utf8');
            const html = fs.readFileSync('index.html', 'utf8');
            for (const field of [
              'seasonalStage', 'seasonalMetrics', 'seasonalPhaseLocalRunoffM3S',
              'seasonalPhaseSnowmeltRunoffM3S', 'seasonalPhaseSnowStorageMm',
              'seasonalPhasePotentialDischargeM3S', 'seasonalPhaseRealizedDischargeM3S',
              'seasonalFlowPresenceFraction', 'seasonalFlowRegime',
              'seasonalPhaseLakeSurfaceElevationM', 'seasonalPhaseLakeAreaM2', 'seasonalPhaseLakeVolumeM3',
            ]) {
              assert.match(protocol, new RegExp(field));
              assert.match(worker, new RegExp(field));
            }
            for (const mode of ['seasonal-realized-discharge', 'seasonal-flow-presence', 'seasonal-flow-regime', 'seasonal-snow-storage']) {
              assert.match(html, new RegExp(mode));
              assert.match(lab, new RegExp(mode));
            }
            assert.match(lab, /loaded\.seasonalMetrics\.climateHash !== loaded\.metrics\.climateHash/);
            assert.match(lab, /loaded\.seasonalMetrics\.drainageHash !== loaded\.drainageMetrics\.drainageHash/);
            assert.match(lab, /loaded\.seasonalMetrics\.runoffHash !== loaded\.runoffMetrics\.runoffHash/);
            assert.match(lab, /loaded\.seasonalMetrics\.lakeHash !== loaded\.lakeMetrics\.lakeHash/);
            assert.doesNotMatch(lab, /client\.generateDrainage\(/);
            assert.match(lab, /client\.generateClimate\(request, handleGenerationProgress\)/);
          });
          EOF
          sed -i 's/^          //' tests/wg6Seasonal.test.ts
      - name: Build and validate cumulative Lab
        run: |
          npm run build
          npm run test:ts
      - name: Commit WG-6D Lab integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html src/worldgen/diagnostics/worldgenClimateLabStandalone.ts dist/worldgen/diagnostics/worldgenClimateLabStandalone.js tests/pages.test.ts tests/wg4Topography.test.ts tests/wg6Seasonal.test.ts
          git commit -m "Add WG-6D seasonal diagnostics to Planet Engine Lab"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
