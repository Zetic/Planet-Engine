name: Temporary WG-7C Reconciliation Smoke

on:
  push:
    branches:
      - wg7c-post-erosion-hydrology

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg7c-post-erosion-hydrology
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run WG-7C L4 smoke
        run: |
          cargo run --release -p interlink-worldgen-cli --example post_erosion_hydrology_performance -- --seed ci-wg7c-reconciliation --coarse-level 3 --level 4 --plates 12 --runs 1
      - name: Self-clean
        run: |
          rm .github/workflows/temp-wg7c-smoke.yml
          git config user.name "Zetic"
          git config user.email "105380590+Zetic@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary WG-7C reconciliation smoke"
          git push origin HEAD:wg7c-post-erosion-hydrology
