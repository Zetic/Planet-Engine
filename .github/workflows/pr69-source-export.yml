name: PR69 Source Export

on:
  pull_request:
    paths:
      - '.github/workflows/pr69-source-export.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: pr69-source-snapshot
          path: rust/interlink-worldgen/src/orogen_provinces.rs
