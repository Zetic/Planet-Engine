name: PR70 Smoke Diagnose

on:
  push:
    branches: [feat/tectonic-structural-strands]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Tectonic history smoke
        run: cargo +1.98.1 run -p interlink-worldgen-cli --example tectonic_history_smoke
      - name: Pre-orogenic smoke
        run: cargo +1.98.1 run -p interlink-worldgen-cli --example pre_orogenic_lithosphere_smoke
      - name: Orogen province smoke
        run: cargo +1.98.1 run -p interlink-worldgen-cli --example tectonic_orogen_provinces_smoke
      - name: Topography cutover smoke
        run: cargo +1.98.1 run -p interlink-worldgen-cli --example tectonic_topography_cutover_smoke
