name: Finalize memory architecture phase 2

on:
  push:
    branches: [perf/l8-memory-architecture]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite:
    if: ${{ contains(github.event.head_commit.message, '[phase2-driver]') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUST_VERSION: '1.98.1'
      WASM_BINDGEN_VERSION: '0.2.127'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/l8-memory-architecture
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply corrected phase 2 rewrite
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-memory-phase2.yml').read_text()
          start = workflow.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = workflow.index('\n          PY\n', start)
          code = workflow[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in code.splitlines())

          broken = (
              "for method in [\n"
              "    'faces', 'outlet_sample', 'outlet_kind', 'drainage_order', 'local_runoff_m3_s',\n"
              "    'lake_spill_samples', 'stream_power_index', 'sediment_transport_capacity_kg_s',\n"
              "    'runoff_stage_id', 'runoff_stage_version', 'runoff_stage_seed_hex',\n"
              "]:\n"
              "    ib, n = re.subn(rf'\\s*{method}\\(\\):\\s*[^;]+;', '', ib, count=1)\n"
              "    if n != 1: raise SystemExit(f'worker interface method not removed: {method} ({n})')\n"
          )
          fixed = (
              "method_signatures = {\n"
              "    'faces': 'faces(): Uint32Array;',\n"
              "    'outlet_sample': 'outlet_sample(): Uint32Array;',\n"
              "    'outlet_kind': 'outlet_kind(): Uint8Array;',\n"
              "    'drainage_order': 'drainage_order(): Uint32Array;',\n"
              "    'local_runoff_m3_s': 'local_runoff_m3_s(): Float32Array;',\n"
              "    'lake_spill_samples': 'lake_spill_samples(): Uint32Array;',\n"
              "    'stream_power_index': 'stream_power_index(): Float32Array;',\n"
              "    'sediment_transport_capacity_kg_s': 'sediment_transport_capacity_kg_s(): Float32Array;',\n"
              "    'runoff_stage_id': 'runoff_stage_id(): string;',\n"
              "    'runoff_stage_version': 'runoff_stage_version(): number;',\n"
              "    'runoff_stage_seed_hex': 'runoff_stage_seed_hex(): string;',\n"
              "}\n"
              "for method, signature in method_signatures.items():\n"
              "    n = ib.count(signature)\n"
              "    if n != 1: raise SystemExit(f'worker interface method not removed: {method} ({n})')\n"
              "    ib = ib.replace(signature, '', 1)\n"
          )
          if broken not in code:
              raise SystemExit('worker interface rewrite patch target missing')
          code = code.replace(broken, fixed, 1)
          Path('/tmp/memory-phase2.py').write_text(code)
          PY
          python3 /tmp/memory-phase2.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/worldgenCompositeViews.test.ts')
          s = p.read_text()
          old = "const end = bridge.indexOf('pub fn runoff_stage_id', start);"
          new = "const end = bridge.indexOf('pub fn runoff_hash_hex', start);"
          if s.count(old) != 1:
              raise SystemExit('WG-7D drainage section marker target missing')
          p.write_text(s.replace(old, new, 1))
          PY
          cargo fmt --all
      - name: Compile and test Rust
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target wasm32-unknown-unknown
          rustup default "${RUST_VERSION}"
          cargo check --workspace --all-targets
          cargo test -p interlink-worldgen --lib
          cargo check -p interlink-worldgen-wasm --target wasm32-unknown-unknown
      - name: Rebuild browser WASM
        run: |
          cargo install --locked wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}"
          npm run build:worldgen-wasm
      - name: Validate browser and lifecycle contracts
        run: |
          npm ci
          npm run build
          npm run test:ts
      - name: Commit phase 2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust src tests
          git commit -m 'perf(worldgen): compact final L8 solver state [memory-phase2]'
          git push origin HEAD:perf/l8-memory-architecture
