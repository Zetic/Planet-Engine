name: Temporary WG-4 Rift Seaway Integration

on:
  push:
    branches:
      - wg4-rift-seaway-calibration

permissions:
  contents: write

env:
  RUST_VERSION: '1.98.1'
  WASM_BINDGEN_VERSION: '0.2.127'

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Rust and browser target
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target wasm32-unknown-unknown --component rustfmt
          rustup default "${RUST_VERSION}"
      - name: Restore wasm-bindgen CLI cache
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: ${{ runner.os }}-wasm-bindgen-cli-${{ env.WASM_BINDGEN_VERSION }}-rust-${{ env.RUST_VERSION }}
      - name: Install pinned wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo +${RUST_VERSION} install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - name: Install browser dependencies
        run: npm ci
      - name: Apply WG-4 rift maturation integration
        run: python3 scripts/temp-wg4-rift-integration.py
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Test Rust workspace
        run: cargo test --workspace
      - name: Run existing WG-4 ridge morphology acceptance
        run: cargo run --release -p interlink-worldgen-cli --example topography_boundary_acceptance
      - name: Run WG-4 continental-rift seaway acceptance
        run: cargo run --release -p interlink-worldgen-cli --example topography_rift_acceptance
      - name: Rebuild committed WASM package
        run: npm run build:worldgen-wasm
      - name: Build browser modules
        run: npm run build
      - name: Run browser regressions
        run: npm run test:ts
      - name: Run WG-7D physical acceptance
        run: bash scripts/check-wg7d-lake-infill.sh
      - name: Publish validated WG-4 @5 integration
        run: |
          rm scripts/temp-wg4-rift-profile.py
          rm scripts/temp-wg4-rift-conditional.py
          rm scripts/temp-wg4-rift-integration.py
          rm rust/interlink-worldgen-cli/examples/wg4_rift_seaway_profiles.rs
          rm rust/interlink-worldgen-cli/examples/wg4_transition_seaway_profiles.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/interlink-worldgen/src/topography.rs
          git add rust/interlink-worldgen-wasm/tests/topography_bridge.rs
          git add rust/interlink-worldgen-cli/examples/topography_rift_acceptance.rs
          git add docs/worldgen-rewrite/TOPOGRAPHY.md
          git add src/wasm-worldgen
          git add dist/worldgen
          git add scripts/temp-wg4-rift-profile.py scripts/temp-wg4-rift-conditional.py scripts/temp-wg4-rift-integration.py
          git add rust/interlink-worldgen-cli/examples/wg4_rift_seaway_profiles.rs rust/interlink-worldgen-cli/examples/wg4_transition_seaway_profiles.rs
          git commit -m "calibrate: mature continental rifts without broad seaways"
          git push
