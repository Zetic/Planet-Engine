name: Tectonic Synthesis Dev Apply

on:
  push:
    branches: [feat/tectonic-synthesis-cleanup]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tectonic-synthesis-cleanup
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply synthesis edits
        run: python scripts/apply-tectonic-synthesis-cleanup.py
      - name: Apply final synthesis fixes and gates
        run: python scripts/finalize-tectonic-synthesis-cleanup.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Test historical synthesis
        run: cargo test -p interlink-worldgen historical_lithosphere -- --nocapture
      - name: Test event-driven morphology
        run: cargo run --release -p interlink-worldgen-cli --example historical_morphology_acceptance
      - name: Compile browser bridge
        run: cargo check -p interlink-worldgen-wasm --target wasm32-unknown-unknown
      - name: Build browser modules
        run: npm run build
      - name: Run browser regressions
        run: npm run test:ts
      - name: Commit synthesis implementation
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add rust src index.html README.md tests .github/workflows/ci.yml
            git add -u inheritance.html src/worldgen/diagnostics/worldgenInheritanceLabStandalone.ts || true
            git commit -m 'feat(worldgen): unify historical diagnostics in the main lab'
            git push origin HEAD:feat/tectonic-synthesis-cleanup
          fi
