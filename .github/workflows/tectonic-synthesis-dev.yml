name: Tectonic Synthesis Dev Apply

on:
  push:
    branches: [feat/tectonic-synthesis-cleanup]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tectonic-synthesis-cleanup
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply synthesis edits
        run: python scripts/apply-tectonic-synthesis-cleanup.py
      - name: Apply final synthesis fixes and gates
        run: python scripts/finalize-tectonic-synthesis-cleanup.py
      - name: Finalize generated synthesis source
        run: |
          python - <<'PY'
          from pathlib import Path

          orogen = Path('rust/interlink-worldgen/src/orogen_provinces.rs')
          text = orogen.read_text()
          old = '    random, CrustalModel, GeologicalBoundaryRegime, InheritedStructureKind,\n'
          new = '    random, CrustKind, CrustalModel, GeologicalBoundaryRegime, InheritedStructureKind,\n'
          assert text.count(old) == 1, 'expected rewritten orogen import exactly once'
          orogen.write_text(text.replace(old, new, 1))

          history = Path('rust/interlink-worldgen/src/historical_lithosphere.rs')
          text = history.read_text()
          old = (
              '            let local_transition_steps = transition_steps\n'
              '                + if edge_warp > 0.72 && transition_steps < 3 { 1 } else { 0 };\n'
              '            if depth[sample_index] == u16::MAX || depth[sample_index] < local_transition_steps {\n'
          )
          new = (
              '            let local_depth = depth[sample_index];\n'
              '            if local_depth != u16::MAX\n'
              '                && (local_depth.saturating_add(1) < transition_steps\n'
              '                    || (local_depth < transition_steps && edge_warp >= 0.35))\n'
              '            {\n'
          )
          assert text.count(old) == 1, 'expected expanded transitional margin logic exactly once'
          history.write_text(text.replace(old, new, 1))
          PY
      - name: Format Rust
        run: cargo fmt --all
      - name: Test historical synthesis
        run: cargo test -p interlink-worldgen historical_lithosphere -- --nocapture
      - name: Test event-driven morphology
        run: cargo run --release -p interlink-worldgen-cli --example historical_morphology_acceptance
      - name: Compile browser bridge
        run: cargo check -p interlink-worldgen-wasm --target wasm32-unknown-unknown
      - name: Build browser modules
        run: npm run build
      - name: Run browser regressions
        shell: bash
        run: |
          set -o pipefail
          npm run test:ts 2>&1 | tee browser-test.log
      - name: Upload browser regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-log
          path: browser-test.log
          if-no-files-found: ignore
      - name: Commit synthesis implementation
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add rust src index.html README.md tests .github/workflows/ci.yml
            git add -u inheritance.html src/worldgen/diagnostics/worldgenInheritanceLabStandalone.ts || true
            git commit -m 'feat(worldgen): unify historical diagnostics in the main lab'
            git push origin HEAD:feat/tectonic-synthesis-cleanup
          fi
