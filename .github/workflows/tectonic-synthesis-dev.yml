name: Tectonic Synthesis Dev Apply

on:
  push:
    branches: [feat/tectonic-synthesis-cleanup]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tectonic-synthesis-cleanup
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply synthesis edits
        run: python scripts/apply-tectonic-synthesis-cleanup.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Compile and test historical lithosphere
        run: cargo test -p interlink-worldgen historical_lithosphere -- --nocapture
      - name: Commit synthesis implementation
        run: |
          if ! git diff --quiet -- rust/interlink-worldgen/src/historical_lithosphere.rs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add rust/interlink-worldgen/src/historical_lithosphere.rs
            git commit -m 'feat(worldgen): compact modern plates and assemble continental crust'
            git push origin HEAD:feat/tectonic-synthesis-cleanup
          fi
