name: Bootstrap tectonic history rewrite

on:
  push:
    branches:
      - feat/tectonic-history-boundary-systems

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tectonic-history-boundary-systems
          fetch-depth: 0
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Apply tectonic history rewrite
        run: |
          python3 scripts/bootstrap_tectonic_history.py
          git checkout -- .github/workflows/ci.yml
      - name: Validate tectonic core
        run: cargo test -p interlink-worldgen tectonics::tests -- --nocapture
      - name: Compile workspace
        run: cargo check --workspace
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/interlink-worldgen/src/tectonics.rs rust/interlink-worldgen/src/lib.rs docs/worldgen-rewrite/TECTONIC_HISTORY.md
          git commit -m "feat(worldgen): add tectonic history boundary systems"
          git push origin HEAD:feat/tectonic-history-boundary-systems
