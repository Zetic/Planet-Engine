name: Temporary WG-4 Divergent Morphology Profiles

on:
  push:
    branches:
      - wg4-divergent-morphology-calibration

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Apply ridge calibration candidate
        run: python3 scripts/temp-wg4-divergent-profile.py --ridge-direct 0.10 --ridge-history-m 75

      - name: Verify WG-4 ridge and rift acceptance
        run: |
          cargo run --release -p interlink-worldgen-cli --example topography_boundary_acceptance
          cargo run --release -p interlink-worldgen-cli --example topography_rift_acceptance

      - name: Trace interlink-wg7c rift lake from WG-6C through WG-7D
        run: cargo run --release -p interlink-worldgen-cli --example wg4_rift_lake_detail
