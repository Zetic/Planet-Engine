name: Temporary WG-4 Divergent Morphology Profiles

on:
  push:
    branches:
      - wg4-divergent-morphology-calibration

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Control S4 - calibrated oceanic ridge with current rift geometry
        run: |
          git checkout -- rust/interlink-worldgen/src/topography.rs
          python3 scripts/temp-wg4-divergent-profile.py --ridge-direct 0.10 --ridge-history-m 75 --continental-rift-direct 0.10 --continental-rift-width-m 450000
          cargo run --release -p interlink-worldgen-cli --example wg4_divergent_morphology_profiles
          cargo run --release -p interlink-worldgen-cli --example topography_rift_acceptance

      - name: Variant A1 - narrower stronger axial rift
        run: |
          git checkout -- rust/interlink-worldgen/src/topography.rs
          python3 scripts/temp-wg4-divergent-profile.py --ridge-direct 0.10 --ridge-history-m 75 --continental-rift-direct 0.20 --continental-rift-width-m 300000
          cargo run --release -p interlink-worldgen-cli --example wg4_divergent_morphology_profiles
          cargo run --release -p interlink-worldgen-cli --example topography_rift_acceptance

      - name: Variant A2 - focused axial rift
        run: |
          git checkout -- rust/interlink-worldgen/src/topography.rs
          python3 scripts/temp-wg4-divergent-profile.py --ridge-direct 0.10 --ridge-history-m 75 --continental-rift-direct 0.30 --continental-rift-width-m 250000
          cargo run --release -p interlink-worldgen-cli --example wg4_divergent_morphology_profiles
          cargo run --release -p interlink-worldgen-cli --example topography_rift_acceptance

      - name: Variant A3 - deep narrow axial rift
        run: |
          git checkout -- rust/interlink-worldgen/src/topography.rs
          python3 scripts/temp-wg4-divergent-profile.py --ridge-direct 0.10 --ridge-history-m 75 --continental-rift-direct 0.40 --continental-rift-width-m 200000
          cargo run --release -p interlink-worldgen-cli --example wg4_divergent_morphology_profiles
          cargo run --release -p interlink-worldgen-cli --example topography_rift_acceptance

      - name: Variant A4 - very narrow axial spill corridor
        run: |
          git checkout -- rust/interlink-worldgen/src/topography.rs
          python3 scripts/temp-wg4-divergent-profile.py --ridge-direct 0.10 --ridge-history-m 75 --continental-rift-direct 0.50 --continental-rift-width-m 150000
          cargo run --release -p interlink-worldgen-cli --example wg4_divergent_morphology_profiles
          cargo run --release -p interlink-worldgen-cli --example topography_rift_acceptance
