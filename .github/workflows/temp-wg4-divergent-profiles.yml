name: Temporary WG-4 Divergent Morphology Profiles

on:
  push:
    branches:
      - wg4-divergent-morphology-calibration

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Baseline WG-4 @5
        run: cargo run --release -p interlink-worldgen-cli --example wg4_divergent_morphology_profiles

      - name: Variant R1 - lower pure oceanic ridge expression
        run: |
          git checkout -- rust/interlink-worldgen/src/topography.rs
          python3 scripts/temp-wg4-divergent-profile.py --ridge-direct 0.40 --ridge-history-m 350 --continental-rift-basin-reduction 0.00
          cargo run --release -p interlink-worldgen-cli --example wg4_divergent_morphology_profiles
          cargo run --release -p interlink-worldgen-cli --example topography_boundary_acceptance
          cargo run --release -p interlink-worldgen-cli --example topography_rift_acceptance

      - name: Variant L1 - attenuate duplicated continental-rift basin history
        run: |
          git checkout -- rust/interlink-worldgen/src/topography.rs
          python3 scripts/temp-wg4-divergent-profile.py --ridge-direct 0.50 --ridge-history-m 500 --continental-rift-basin-reduction 0.45
          cargo run --release -p interlink-worldgen-cli --example wg4_divergent_morphology_profiles
          cargo run --release -p interlink-worldgen-cli --example topography_boundary_acceptance
          cargo run --release -p interlink-worldgen-cli --example topography_rift_acceptance

      - name: Variant C1 - combined moderate calibration
        run: |
          git checkout -- rust/interlink-worldgen/src/topography.rs
          python3 scripts/temp-wg4-divergent-profile.py --ridge-direct 0.40 --ridge-history-m 350 --continental-rift-basin-reduction 0.45
          cargo run --release -p interlink-worldgen-cli --example wg4_divergent_morphology_profiles
          cargo run --release -p interlink-worldgen-cli --example topography_boundary_acceptance
          cargo run --release -p interlink-worldgen-cli --example topography_rift_acceptance

      - name: Variant C2 - stronger divergent damping
        run: |
          git checkout -- rust/interlink-worldgen/src/topography.rs
          python3 scripts/temp-wg4-divergent-profile.py --ridge-direct 0.35 --ridge-history-m 300 --continental-rift-basin-reduction 0.55
          cargo run --release -p interlink-worldgen-cli --example wg4_divergent_morphology_profiles
          cargo run --release -p interlink-worldgen-cli --example topography_boundary_acceptance
          cargo run --release -p interlink-worldgen-cli --example topography_rift_acceptance
