name: Temporary WG-4 Divergent Morphology Profiles

on:
  push:
    branches:
      - wg4-divergent-morphology-calibration

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Baseline WG-4 @5
        run: cargo run --release -p interlink-worldgen-cli --example wg4_divergent_morphology_profiles

      - name: Variant S1 - stronger ridge-only damping
        run: |
          git checkout -- rust/interlink-worldgen/src/topography.rs
          python3 scripts/temp-wg4-divergent-profile.py --ridge-direct 0.35 --ridge-history-m 300 --continental-rift-basin-reduction 0.00
          cargo run --release -p interlink-worldgen-cli --example wg4_divergent_morphology_profiles
          cargo run --release -p interlink-worldgen-cli --example topography_boundary_acceptance
          cargo run --release -p interlink-worldgen-cli --example topography_rift_acceptance

      - name: Variant S2 - deepest ridge-only candidate
        run: |
          git checkout -- rust/interlink-worldgen/src/topography.rs
          python3 scripts/temp-wg4-divergent-profile.py --ridge-direct 0.30 --ridge-history-m 250 --continental-rift-basin-reduction 0.00
          cargo run --release -p interlink-worldgen-cli --example wg4_divergent_morphology_profiles
          cargo run --release -p interlink-worldgen-cli --example topography_boundary_acceptance
          cargo run --release -p interlink-worldgen-cli --example topography_rift_acceptance
