name: Temporary WG-4 Divergent Morphology Integration

on:
  push:
    branches:
      - wg4-divergent-morphology-calibration

permissions:
  contents: write

env:
  RUST_VERSION: '1.98.1'
  WASM_BINDGEN_VERSION: '0.2.127'

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned Rust and browser target
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup default "${RUST_VERSION}"

      - name: Restore wasm-bindgen CLI cache
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: ${{ runner.os }}-wasm-bindgen-cli-${{ env.WASM_BINDGEN_VERSION }}-rust-${{ env.RUST_VERSION }}

      - name: Install pinned wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo +${RUST_VERSION} install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked

      - name: Install browser dependencies
        run: npm ci

      - name: Apply WG-4 @6 ridge morphology calibration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('rust/interlink-worldgen/src/topography.rs')
          text = path.read_text()
          replacements = [
              (
                  'pub const TOPOGRAPHY_STAGE_VERSION: u32 = 5;',
                  'pub const TOPOGRAPHY_STAGE_VERSION: u32 = 6;',
              ),
              (
                  'const OCEANIC_RIDGE_DIRECT_RESPONSE_SCALE: f64 = 0.50;',
                  'const OCEANIC_RIDGE_DIRECT_RESPONSE_SCALE: f64 = 0.10;',
              ),
              (
                  'p.ridge_uplift_scale_m * ridge_kernel + 500.0 * f64::from(inherited.ridge_history[i]);',
                  'p.ridge_uplift_scale_m * ridge_kernel + 75.0 * f64::from(inherited.ridge_history[i]);',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one WG-4 integration target: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Format Rust workspace
        run: cargo fmt --all

      - name: Test standalone workspace
        run: cargo test --workspace

      - name: Verify WG-4 morphology acceptance
        run: |
          cargo run --release -p interlink-worldgen-cli --example topography_boundary_acceptance
          cargo run --release -p interlink-worldgen-cli --example topography_divergent_morphology_acceptance
          cargo run --release -p interlink-worldgen-cli --example topography_rift_acceptance

      - name: Verify downstream physical stages
        run: |
          bash scripts/check-wg6a-drainage.sh
          bash scripts/check-wg6b-runoff.sh
          bash scripts/check-wg6c-lakes.sh
          bash scripts/check-wg6d-seasonal.sh
          bash scripts/check-wg7a-erosion.sh
          bash scripts/check-wg7b-evolution.sh
          bash scripts/check-wg7c-reconciliation.sh
          bash scripts/check-wg7d-lake-infill.sh

      - name: Rebuild committed browser WASM package
        run: npm run build:worldgen-wasm

      - name: Build browser modules
        run: npm run build

      - name: Run browser regressions
        run: npm run test:ts

      - name: Remove temporary calibration machinery
        run: |
          rm .github/workflows/temp-wg4-divergent-profiles.yml
          rm scripts/temp-wg4-divergent-profile.py
          rm rust/interlink-worldgen-cli/examples/wg4_divergent_morphology_profiles.rs
          rm rust/interlink-worldgen-cli/examples/wg4_rift_lake_detail.rs

      - name: Commit clean WG-4 @6 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(topography): calibrate oceanic ridge morphology"
          git push origin HEAD:wg4-divergent-morphology-calibration
