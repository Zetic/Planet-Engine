name: Temporary WG-4 Divergent Morphology Profiles

on:
  push:
    branches:
      - wg4-divergent-morphology-calibration

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Profile ridge islands and final rift lakes
        run: cargo run --release -p interlink-worldgen-cli --example wg4_divergent_morphology_profiles
