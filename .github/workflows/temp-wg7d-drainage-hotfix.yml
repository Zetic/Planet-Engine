name: Temporary WG-7D Final Drainage Hotfix

on:
  push:
    branches: [fix-wg7d-final-drainage-bridge]

permissions:
  contents: write

env:
  RUST_VERSION: '1.98.1'
  WASM_BINDGEN_VERSION: '0.2.127'

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-wg7d-final-drainage-bridge
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Rust and browser target
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup default "${RUST_VERSION}"
      - name: Restore wasm-bindgen CLI cache
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: ${{ runner.os }}-wasm-bindgen-cli-${{ env.WASM_BINDGEN_VERSION }}-rust-${{ env.RUST_VERSION }}
      - name: Install pinned wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo +${RUST_VERSION} install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - run: npm ci
      - name: Apply final drainage bridge hotfix
        run: python3 scripts/temp-wg7d-drainage-hotfix.py
      - name: Format and test Rust workspace
        run: |
          cargo fmt --all
          cargo test --workspace
      - name: Build committed WASM package
        run: npm run build:worldgen-wasm
      - name: Build browser modules
        run: npm run build
      - name: Run browser regressions
        run: npm run test:ts
      - name: Run WG-7D physical acceptance
        run: bash scripts/check-wg7d-lake-infill.sh
      - name: Verify final drainage bridge has no mixed WG-7B getters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('rust/interlink-worldgen-wasm/src/climate_bridge.rs').read_text()
          start = text.index('    pub fn drainage_stage_id')
          end = text.index('    pub fn runoff_stage_id', start)
          section = text[start:end]
          if re.search(r'self\.evolution\s*\.\s*post_erosion_drainage', section):
              raise SystemExit('stale WG-7B canonical drainage getter remains')
          if 'self.infill.post_infill_drainage' not in section:
              raise SystemExit('WG-7D final drainage source missing')
          PY
      - name: Commit hotfix and remove temporary machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-wg7d-drainage-hotfix.yml scripts/temp-wg7d-drainage-hotfix.py
          git add -A
          git commit -m "fix: route all canonical drainage getters to WG-7D final state"
          git push origin HEAD:fix-wg7d-final-drainage-bridge
