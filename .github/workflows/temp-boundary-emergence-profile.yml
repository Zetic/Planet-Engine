name: Temporary WG-4 Boundary Emergence Integration

on:
  push:
    branches:
      - wg4-boundary-emergence-hardening

permissions:
  contents: write

env:
  RUST_VERSION: '1.98.1'
  WASM_BINDGEN_VERSION: '0.2.127'

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned Rust, rustfmt, and browser target
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup default "${RUST_VERSION}"

      - name: Restore wasm-bindgen CLI cache
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: ${{ runner.os }}-wasm-bindgen-cli-${{ env.WASM_BINDGEN_VERSION }}-rust-${{ env.RUST_VERSION }}

      - name: Install pinned wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo +${RUST_VERSION} install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked

      - name: Install browser dependencies
        run: npm ci

      - name: Apply WG-4 @7 all-regime emergence calibration
        run: |
          python3 scripts/temp-boundary-emergence-transform.py balanced2
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rust/interlink-worldgen/src/topography.rs')
          text = path.read_text()
          old = 'pub const TOPOGRAPHY_STAGE_VERSION: u32 = 6;'
          new = 'pub const TOPOGRAPHY_STAGE_VERSION: u32 = 7;'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one WG-4 stage version 6 target')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format Rust workspace
        run: cargo fmt --all

      - name: Test standalone workspace
        run: cargo test --workspace

      - name: Verify WG-4 morphology acceptance
        run: |
          cargo run --release -p interlink-worldgen-cli --example topography_boundary_acceptance
          cargo run --release -p interlink-worldgen-cli --example topography_divergent_morphology_acceptance
          cargo run --release -p interlink-worldgen-cli --example topography_boundary_morphology_acceptance
          cargo run --release -p interlink-worldgen-cli --example topography_arc_morphology_acceptance
          cargo run --release -p interlink-worldgen-cli --example topography_rift_acceptance

      - name: Verify downstream physical stages
        run: |
          bash scripts/check-wg6a-drainage.sh
          bash scripts/check-wg6b-runoff.sh
          bash scripts/check-wg6c-lakes.sh
          bash scripts/check-wg6d-seasonal.sh
          bash scripts/check-wg7a-erosion.sh
          bash scripts/check-wg7b-evolution.sh
          bash scripts/check-wg7c-reconciliation.sh
          bash scripts/check-wg7d-lake-infill.sh

      - name: Verify WG-5 and L7 convergence controls
        run: |
          cargo run --release -p interlink-worldgen-cli --example climate_calibration -- --seed ci-wg5-calibration --coarse-level 3 --level 4 --plates 12 --skip-orography-intervention
          bash scripts/check-wg5-hydroclimate-closure.sh smoke
          cargo run --release -p interlink-worldgen-cli -- climate --seed ci-wg5-l7 --coarse-level 5 --level 7 --plates 24

      - name: Rebuild committed browser WASM package
        run: npm run build:worldgen-wasm

      - name: Compile browser bridge
        run: cargo check -p interlink-worldgen-wasm --target wasm32-unknown-unknown

      - name: Build browser modules
        run: npm run build

      - name: Verify committed browser output
        run: git diff --exit-code -- dist/worldgen

      - name: Run browser regressions
        run: npm run test:ts

      - name: Remove temporary calibration machinery
        run: |
          rm rust/interlink-worldgen-cli/examples/temp_boundary_emergence_profile.rs
          rm rust/interlink-worldgen-cli/examples/temp_arc_emergence_profile.rs
          rm scripts/temp-boundary-emergence-transform.py

      - name: Commit clean WG-4 @7 integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/interlink-worldgen/src/topography.rs \
                  rust/interlink-worldgen-cli/examples/topography_boundary_morphology_acceptance.rs \
                  rust/interlink-worldgen-cli/examples/topography_arc_morphology_acceptance.rs \
                  rust/interlink-worldgen-wasm/tests/topography_bridge.rs \
                  docs/worldgen-rewrite/TOPOGRAPHY.md \
                  src/wasm-worldgen \
                  rust/interlink-worldgen-cli/examples/temp_boundary_emergence_profile.rs \
                  rust/interlink-worldgen-cli/examples/temp_arc_emergence_profile.rs \
                  scripts/temp-boundary-emergence-transform.py
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
          else
            git commit -m 'feat(topography): harden tectonic boundary emergence'
            git push origin HEAD:wg4-boundary-emergence-hardening
          fi
