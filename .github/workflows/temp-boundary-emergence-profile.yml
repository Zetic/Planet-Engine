name: Temporary Boundary Emergence Profile

on:
  push:
    branches:
      - wg4-boundary-emergence-hardening

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Profile all boundary regimes
        run: cargo run --release -p interlink-worldgen-cli --example temp_boundary_emergence_profile
