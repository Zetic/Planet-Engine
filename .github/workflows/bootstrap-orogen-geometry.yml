name: Finalize inherited-orogen geometry implementation

on:
  push:
    branches:
      - feat/wg4-diversify-inherited-orogen-geometry

permissions:
  contents: write

env:
  RUST_VERSION: '1.98.1'
  WASM_BINDGEN_VERSION: '0.2.127'

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden direct geometry acceptance
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('rust/interlink-worldgen-cli/examples/geology_orogen_geometry_acceptance.rs')
          text = path.read_text()
          start = text.index('    if minimum_core < 0.80 {')
          end_marker = '    Ok(())\n}'
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''    if minimum_core < 0.95 {
              return Err(format!(
                  "orogen core continuity fell too low: {minimum_core:.4}"
              ));
          }
          if !minimum_width_cv.is_finite() || minimum_width_cv < 0.07 {
              return Err(format!(
                  "orogen width variation remained too uniform: min CV {minimum_width_cv:.4}"
              ));
          }
          if mean_cv < 0.09 {
              return Err(format!(
                  "orogen mean width variation remained too uniform: {mean_cv:.4}"
              ));
          }
          if endpoint_ratios.weight <= 0.0 || endpoint_ratios.mean() > 0.985 {
              return Err(format!(
                  "orogen terminations did not taper enough: endpoint/interior {:.4}",
                  endpoint_ratios.mean()
              ));
          }
          if asymmetry.weight <= 0.0 || asymmetry.mean() < 0.055 {
              return Err(format!(
                  "collision-side width asymmetry remained too weak: {:.4}",
                  asymmetry.mean()
              ));
          }
          Ok(())
          }'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Install pinned Rust and browser target
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target wasm32-unknown-unknown
          rustup default "${RUST_VERSION}"
      - name: Validate hardened direct geometry gate
        run: |
          cargo fmt --all
          cargo run --release -p interlink-worldgen-cli --example geology_orogen_geometry_acceptance
      - name: Restore wasm-bindgen CLI cache
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: ${{ runner.os }}-wasm-bindgen-cli-${{ env.WASM_BINDGEN_VERSION }}-rust-${{ env.RUST_VERSION }}
      - name: Install pinned wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo +${RUST_VERSION} install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - name: Rebuild committed browser WASM package
        run: npm run build:worldgen-wasm
      - name: Commit final diagnostic and WASM package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/interlink-worldgen-cli/examples/geology_orogen_geometry_acceptance.rs src/wasm-worldgen
          if git diff --cached --quiet; then
            echo "No finalization changes to commit"
            exit 0
          fi
          git commit -m "test(worldgen): lock inherited-orogen geometry acceptance"
          git push origin HEAD:feat/wg4-diversify-inherited-orogen-geometry
