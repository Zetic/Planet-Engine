name: Bootstrap inherited-orogen geometry implementation

on:
  push:
    branches:
      - feat/wg4-diversify-inherited-orogen-geometry

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Measure accepted v3 baseline geometry
        run: cargo run --release -p interlink-worldgen-cli --example geology_orogen_geometry_acceptance
      - name: Apply conservative WG-3 history geometry candidate
        run: python3 scripts/bootstrap-orogen-geometry.py
      - name: Format and validate focused geology changes
        run: |
          cargo fmt --all
          cargo test -p interlink-worldgen geology::tests -- --nocapture
          cargo run --release -p interlink-worldgen-cli --example geology_orogen_geometry_acceptance
          cargo run --release -p interlink-worldgen-cli --example topography_inherited_orogen_morphology_acceptance
          cargo run --release -p interlink-worldgen-cli --example topography_orogen_profile_acceptance
      - name: Commit implementation without workflow edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/interlink-worldgen/src/geology.rs rust/interlink-worldgen-cli/examples/geology_orogen_geometry_acceptance.rs docs/worldgen-rewrite/TOPOGRAPHY.md
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "feat(worldgen): diversify inherited orogen geometry"
          git push origin HEAD:feat/wg4-diversify-inherited-orogen-geometry
