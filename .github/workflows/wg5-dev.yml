name: Temporary WG-5 development patch

on:
  push:
    branches:
      - worldgen-wg5-coupled-climate

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worldgen-wg5-coupled-climate
      - name: Apply staged WG-5 patch
        run: python scripts/wg5_patch_cli.py
      - name: Commit staged integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/interlink-worldgen-cli/src/main.rs
          git commit -m 'Add WG-5 climate CLI diagnostic'
          git push origin HEAD:worldgen-wg5-coupled-climate
