name: Temporary WG-5 WASM refresh

on:
  push:
    branches:
      - worldgen-wg5-coupled-climate

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worldgen-wg5-coupled-climate
      - name: Prepare pinned browser WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Rebuild committed browser WASM package
        run: npm run build:worldgen-wasm
      - name: Commit refreshed browser WASM package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/wasm-worldgen
          if git diff --cached --quiet; then
            echo 'Committed browser WASM package already matches WG-5 sources.'
            exit 0
          fi
          git commit -m 'Rebuild WG-5 browser WASM package'
          git push origin HEAD:worldgen-wg5-coupled-climate
