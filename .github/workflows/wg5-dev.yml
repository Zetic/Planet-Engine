name: Temporary WG-5 development patch

on:
  push:
    branches:
      - worldgen-wg5-coupled-climate

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worldgen-wg5-coupled-climate
      - name: Apply remaining WG-5 Lab patch
        run: python scripts/wg5_patch_lab_html.py
      - name: Build and test browser protocol
        run: |
          npm ci
          npm run build
          npm test
      - name: Prepare pinned browser WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Rebuild committed browser WASM package
        run: npm run build:worldgen-wasm
      - name: Commit WG-5 Lab and generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html worldgen-lab.html dist/worldgen src/wasm-worldgen
          if git diff --cached --quiet; then
            echo 'WG-5 Lab and generated assets already current.'
            exit 0
          fi
          git commit -m 'Finalize WG-5 Lab and generated assets'
          git push origin HEAD:worldgen-wg5-coupled-climate
