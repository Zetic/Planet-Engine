name: Refresh localized-orogen WASM package

on:
  push:
    branches: [feat/wg4-boundary-localized-orogens]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ contains(github.event.head_commit.message, '[wg4-localized-wasm]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_VERSION: 1.98.1
      WASM_BINDGEN_VERSION: 0.2.127
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wg4-boundary-localized-orogens
      - name: Install pinned Rust and browser target
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target wasm32-unknown-unknown
          rustup default "${RUST_VERSION}"
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - name: Rebuild committed browser WASM package
        run: npm run build:worldgen-wasm
      - name: Commit refreshed package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/wasm-worldgen
          git diff --cached --quiet && exit 0
          git commit -m 'build(worldgen): refresh localized-orogen wasm [wg4-localized-wasm-refreshed]'
          git push origin HEAD:feat/wg4-boundary-localized-orogens
