name: Temporary WG-7B Browser Core Integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'wg7b-bounded-terrain-evolution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Rust stable and browser target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Apply WG-7B browser core transformer
        run: |
          python scripts/temp-wg7b-browser-core.py
          python scripts/temp-wg7b-browser-tests.py
      - name: Format touched Rust bridge files
        run: |
          rustfmt --edition 2021 rust/interlink-worldgen-wasm/src/lib.rs rust/interlink-worldgen-wasm/src/climate_bridge.rs
      - name: Check Rust browser bridge
        run: cargo check -p interlink-worldgen-wasm --target wasm32-unknown-unknown
      - name: Rebuild committed browser WASM package
        run: npm run build:worldgen-wasm
      - name: Build browser modules
        run: npm run build
      - name: Run browser regressions
        run: npm run test:ts
      - name: Remove temporary transformers
        run: rm scripts/temp-wg7b-browser-core.py scripts/temp-wg7b-browser-tests.py
      - name: Commit WG-7B browser core integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/interlink-worldgen-wasm/src/lib.rs rust/interlink-worldgen-wasm/src/climate_bridge.rs src/worldgen/protocol.ts src/worldgen/worldgenWorker.ts src/wasm-worldgen dist/worldgen tests scripts/temp-wg7b-browser-core.py scripts/temp-wg7b-browser-tests.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Integrate WG-7B through browser protocol v16"
            git push origin HEAD:${{ github.head_ref }}
          fi
