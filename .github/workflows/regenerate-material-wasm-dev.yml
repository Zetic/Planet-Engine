name: Regenerate material-aware WASM

on:
  push:
    branches:
      - feat/material-aware-boundary-tectonics

permissions:
  contents: write

env:
  RUST_VERSION: '1.98.1'
  WASM_BINDGEN_VERSION: '0.2.127'

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/material-aware-boundary-tectonics
          fetch-depth: 0
      - name: Install pinned Rust and browser target
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target wasm32-unknown-unknown
          rustup default "${RUST_VERSION}"
      - name: Install pinned wasm-bindgen CLI
        run: cargo +${RUST_VERSION} install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - name: Rebuild browser WASM package
        run: npm run build:worldgen-wasm
      - name: Verify material-aware gates before commit
        run: |
          cargo check -p interlink-worldgen -p interlink-worldgen-cli --all-targets
          cargo run --release -p interlink-worldgen-cli --example plate_crust_identity_acceptance
          cargo run --release -p interlink-worldgen-cli --example boundary_network_geometry_acceptance
      - name: Commit regenerated WASM
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/wasm-worldgen
          git commit -m 'build(worldgen): regenerate material-aware wasm' || exit 0
          git push origin HEAD:feat/material-aware-boundary-tectonics
