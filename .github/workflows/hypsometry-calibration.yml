name: Forward Hypsometry Calibration

on:
  pull_request:
    paths:
      - 'rust/interlink-worldgen/**'
      - 'rust/interlink-worldgen-cli/examples/forward_hypsometry_diagnostic.rs'
      - 'rust/interlink-worldgen-cli/examples/forward_hypsometry_highres.rs'
      - '.github/workflows/hypsometry-calibration.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    name: Forward hypsometry diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run forward hypsometry diagnostic
        run: cargo run --release -p interlink-worldgen-cli --example forward_hypsometry_diagnostic
      - name: Run L6 to L8 reference hypsometry
        run: cargo run --release -p interlink-worldgen-cli --example forward_hypsometry_highres
      - name: Run continental freeboard acceptance
        run: cargo run --release -p interlink-worldgen-cli --example continental_hypsometry_acceptance
