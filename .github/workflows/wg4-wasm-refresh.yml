name: Temporary WG-4 Clean-tree WASM Refresh

on:
  push:
    branches: [wg4-hypsometry-calibration]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'Refresh WG-4 calibrated WASM from clean tree'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg4-hypsometry-calibration
      - name: Install Rust and browser target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: ${{ runner.os }}-wasm-bindgen-cli-0.2.127
      - name: Install pinned wasm-bindgen CLI
        run: |
          if ! command -v wasm-bindgen >/dev/null 2>&1 || ! wasm-bindgen --version | grep -q '0.2.127'; then
            cargo install wasm-bindgen-cli --version 0.2.127 --locked
          fi
      - name: Rebuild package from clean committed sources
        run: npm run build:worldgen-wasm
      - name: Commit clean-tree WASM
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/wasm-worldgen
          if git diff --cached --quiet; then
            echo 'WASM already matches clean source tree.'
          else
            git commit -m 'Refresh WG-4 calibrated WASM from clean tree'
            git push origin HEAD:wg4-hypsometry-calibration
          fi
