name: Temporary WG-7D Physical Cases

on:
  push:
    branches:
      - wg7d-lake-sediment-infill

permissions:
  contents: write

jobs:
  cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg7d-lake-sediment-infill
      - name: Run accepted WG-7B release L4 ancestry
        run: cargo run --release -p interlink-worldgen-cli --example lake_sediment_infill_performance -- --seed ci-wg7b-evolution --coarse-level 3 --level 4 --plates 12 --runs 3
      - name: Run accepted WG-5 ancestry L6
        run: cargo run --release -p interlink-worldgen-cli --example lake_sediment_infill_performance -- --seed ci-wg5-l7 --coarse-level 5 --level 6 --plates 24 --runs 1
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-wg7d-physical-cases.yml
          git commit -m "WG-7D: remove temporary physical-case workflow"
          git push origin HEAD:wg7d-lake-sediment-infill
