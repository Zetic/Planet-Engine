name: PR69 Tectonic Finalize

on:
  pull_request:
    paths:
      - '.github/workflows/pr69-tectonic-debug.yml'

permissions:
  contents: write

concurrency:
  group: pr69-tectonic-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  RUST_VERSION: '1.98.1'
  WASM_BINDGEN_VERSION: '0.2.127'

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Patch the invariant to test distributed structural geometry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("rust/interlink-worldgen/src/orogen_provinces.rs")
          text = path.read_text()

          text = text.replace(
              """    let shear_zone = if structure == InheritedStructureKind::ShearZone as u8 {\n        1.0\n    } else {\n        0.0\n    };\n""",
              "",
              1,
          )

          pattern = re.compile(
              r"    #\[test\]\n    fn structural_belts_are_not_forced_to_the_literal_boundary\(\) \{.*?\n    \}\n\n    #\[test\]\n    fn continental_interiors_receive_persistent_low_amplitude_structure",
              re.S,
          )
          replacement = """    #[test]
              fn structural_belts_are_not_forced_to_the_literal_boundary() {
                  let source = BoundarySource {
                      boundary_index: 0,
                      province_id: 1,
                      kind: OrogenProvinceKind::ContinentalCollision,
                      plate_a: 1,
                      plate_b: 2,
                      overriding_plate: NO_PLATE,
                      hinterland_plate: 1,
                      foreland_or_subducting_plate: 2,
                      along_fraction: 0.5,
                      maturity: 0.72,
                      shortening: 0.78,
                      obliquity: 0.15,
                      curvature: 0.30,
                      width_a_km: 500.0,
                      width_b_km: 420.0,
                      core_strength: 0.85,
                      plateau_eligibility: 0.0,
                  };
                  let inherited = StructureSignals {
                      weak_corridor: 0.90,
                      inherited_belt: 0.90,
                      craton: 0.10,
                      rift: 0.40,
                      transfer: 0.80,
                      paleo_suture: 1.0,
                  };
                  let resistance = 0.25;
                  let boundary = source_profile(source, 1, 0.0, 0.0, resistance, inherited);
                  let displaced = source_profile(source, 1, 240.0, 240.0, resistance, inherited);

                  assert!(displaced.boundary_distance_km >= 200.0);
                  assert!(displaced.mountain > 0.50);
                  assert!(displaced.mountain > boundary.mountain * 2.0);
                  assert!(displaced.root > boundary.root);
              }

              #[test]
              fn continental_interiors_receive_persistent_low_amplitude_structure"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"expected to replace one structural-belt invariant, replaced {count}")
          path.write_text(text)
          PY
      - name: Install pinned Rust and browser target
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target wasm32-unknown-unknown
          rustup default "${RUST_VERSION}"
      - name: Test WG-3.6 invariants
        run: cargo test -p interlink-worldgen orogen_provinces
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Restore wasm-bindgen CLI cache
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: ${{ runner.os }}-wasm-bindgen-cli-${{ env.WASM_BINDGEN_VERSION }}-rust-${{ env.RUST_VERSION }}
      - name: Install pinned wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo +${RUST_VERSION} install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - name: Rebuild committed browser WASM package
        run: npm run build:worldgen-wasm
      - name: Remove temporary PR69 diagnostic workflows
        run: |
          git rm .github/workflows/pr69-tectonic-debug.yml
          git rm -f .github/workflows/pr69-source-export.yml
      - name: Commit verified source and generated package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/interlink-worldgen/src/orogen_provinces.rs src/wasm-worldgen
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(worldgen): verify distributed tectonic morphology"
          git push origin "HEAD:${{ github.head_ref }}"
