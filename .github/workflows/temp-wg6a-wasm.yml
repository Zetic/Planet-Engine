name: Temporary WG-6A WASM Bridge Build

on:
  push:
    branches: [wg6-drainage-topology]

permissions:
  contents: write

concurrency:
  group: temporary-wg6a-wasm
  cancel-in-progress: true

env:
  RUST_VERSION: '1.98.1'
  WASM_BINDGEN_VERSION: '0.2.127'

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg6-drainage-topology
          fetch-depth: 0
      - name: Wire drainage bridge export
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('rust/interlink-worldgen-wasm/src/lib.rs')
          text = path.read_text()
          marker = 'mod climate_bridge;\npub use climate_bridge::WasmWorldgenClimate;\n'
          addition = marker + 'mod drainage_bridge;\npub use drainage_bridge::WasmWorldgenDrainage;\n'
          if 'pub use drainage_bridge::WasmWorldgenDrainage;' not in text:
              if marker not in text:
                  raise SystemExit('could not find climate bridge export marker')
              text = text.replace(marker, addition, 1)
              path.write_text(text)
          PY
      - name: Install pinned Rust and browser target
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target wasm32-unknown-unknown --component rustfmt
          rustup default "${RUST_VERSION}"
      - name: Format and test Rust workspace
        run: |
          cargo fmt --all
          cargo test --workspace
      - name: Install wasm-bindgen CLI under pinned Rust
        run: cargo +${RUST_VERSION} install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked --force
      - name: Rebuild committed browser WASM package
        run: npm run build:worldgen-wasm
      - name: Commit bridge and generated WASM
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/interlink-worldgen-wasm/src/lib.rs rust/interlink-worldgen/src/drainage.rs rust/interlink-worldgen-wasm/src/drainage_bridge.rs rust/interlink-worldgen-wasm/tests/drainage_bridge.rs src/wasm-worldgen
          if git diff --cached --quiet; then
            echo 'No bridge changes to commit.'
            exit 0
          fi
          git commit -m 'Wire WG-6A drainage WASM bridge'
          git push origin HEAD:wg6-drainage-topology
