name: Hotfix WASM protocol rebuild

on:
  push:
    branches: [hotfix-wasm-protocol-v9]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-wasm-protocol-v9
      - name: Install Rust stable and browser target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Restore wasm-bindgen CLI cache
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: ${{ runner.os }}-wasm-bindgen-cli-0.2.127
      - name: Install pinned wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Apply protocol hotfix and regression guard
        run: |
          sed -i 's/pub const WORLDGEN_WASM_PROTOCOL_VERSION: u32 = 8;/pub const WORLDGEN_WASM_PROTOCOL_VERSION: u32 = 9;/' rust/interlink-worldgen-wasm/src/lib.rs
          cat > tests/wasmProtocolParity.test.ts <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import test from 'node:test';

          test('browser and WASM protocol versions remain synchronized', () => {
            const browserProtocol = fs.readFileSync('src/worldgen/protocol.ts', 'utf8');
            const wasmProtocol = fs.readFileSync('rust/interlink-worldgen-wasm/src/lib.rs', 'utf8');
            const browserMatch = browserProtocol.match(/WORLDGEN_PROTOCOL_VERSION\s*=\s*(\d+)/);
            const wasmMatch = wasmProtocol.match(/WORLDGEN_WASM_PROTOCOL_VERSION:\s*u32\s*=\s*(\d+)/);
            assert.ok(browserMatch, 'browser protocol version constant must be present');
            assert.ok(wasmMatch, 'WASM protocol version constant must be present');
            assert.equal(Number(wasmMatch[1]), Number(browserMatch[1]));
          });
          EOF
      - name: Rebuild committed browser WASM package
        run: npm run build:worldgen-wasm
      - name: Commit hotfix outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/interlink-worldgen-wasm/src/lib.rs src/wasm-worldgen tests/wasmProtocolParity.test.ts
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'Fix WASM protocol version parity'
          git push origin HEAD:hotfix-wasm-protocol-v9
