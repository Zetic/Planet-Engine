name: Hotfix stale WASM protocol test

on:
  push:
    branches: [hotfix-wasm-protocol-v9]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-wasm-protocol-v9
      - name: Fix stale protocol assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('rust/interlink-worldgen-wasm/src/lib.rs')
          text = path.read_text()
          old = 'assert_eq!(worldgen_protocol_version(), 8);'
          new = 'assert_eq!(worldgen_protocol_version(), WORLDGEN_WASM_PROTOCOL_VERSION);'
          if old not in text:
              raise SystemExit('stale protocol assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify focused Rust test
        run: cargo test -p interlink-worldgen-wasm --lib wasm_protocol_and_engine_versions_are_explicit
      - name: Commit fix and remove one-use workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/hotfix-fix-stale-protocol-test.yml
          git add rust/interlink-worldgen-wasm/src/lib.rs
          git commit -m 'Fix stale WASM protocol unit test'
          git push origin HEAD:hotfix-wasm-protocol-v9
