name: Temporary WG-6B Fixed-Ancestry Diagnostic

on:
  push:
    branches: [wg6b-runoff-discharge]

concurrency:
  group: temporary-wg6b-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg6b-runoff-discharge
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: WG-6B accepted WG-5 ancestry L6/L7 diagnostic
        run: |
          cargo +1.98.1 run --release -p interlink-worldgen-cli --example runoff_performance -- --seed ci-wg5-l7 --coarse-level 5 --level 6 --plates 24 --runs 1
          cargo +1.98.1 run --release -p interlink-worldgen-cli --example runoff_performance -- --seed ci-wg5-l7 --coarse-level 5 --level 7 --plates 24 --runs 1
