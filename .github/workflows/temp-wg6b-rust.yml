name: Temporary WG-6B Rust Integration

on:
  push:
    branches: [wg6b-runoff-discharge]

permissions:
  contents: write

concurrency:
  group: temporary-wg6b-rust
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg6b-runoff-discharge
          fetch-depth: 0
      - name: Install pinned Rust with rustfmt
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup default 1.98.1
      - name: Apply WG-6B Rust integration
        run: python scripts/temp-wg6b-rust.py
      - name: Format WG-6B Rust files
        run: |
          rustfmt +1.98.1 --edition 2021 rust/interlink-worldgen/src/lib.rs
          rustfmt +1.98.1 --edition 2021 rust/interlink-worldgen/src/runoff.rs
          rustfmt +1.98.1 --edition 2021 rust/interlink-worldgen-wasm/src/climate_bridge.rs
          rustfmt +1.98.1 --edition 2021 rust/interlink-worldgen-wasm/src/lib.rs
          rustfmt +1.98.1 --edition 2021 rust/interlink-worldgen-cli/examples/runoff_performance.rs
      - name: Test standalone workspace
        run: cargo +1.98.1 test --workspace
      - name: Commit WG-6B Rust core
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/interlink-worldgen/src/lib.rs rust/interlink-worldgen/src/runoff.rs rust/interlink-worldgen-wasm/src/climate_bridge.rs rust/interlink-worldgen-wasm/src/lib.rs rust/interlink-worldgen-cli/examples/runoff_performance.rs
          if git diff --cached --quiet; then
            echo 'No WG-6B Rust changes to commit.'
            exit 0
          fi
          git commit -m 'Integrate WG-6B runoff into cumulative Rust pipeline'
          git push origin HEAD:wg6b-runoff-discharge
