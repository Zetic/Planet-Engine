name: Temporary WG-7D Resolution Matrix

on:
  push:
    branches:
      - wg7d-lake-sediment-infill

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg7d-lake-sediment-infill
      - name: Release ancestry L6
        run: cargo run --release -p interlink-worldgen-cli --example lake_sediment_infill_performance -- --seed ci-wg7b-evolution --coarse-level 4 --level 6 --plates 16 --runs 3
      - name: Release ancestry L7
        run: cargo run --release -p interlink-worldgen-cli --example lake_sediment_infill_performance -- --seed ci-wg7b-evolution --coarse-level 5 --level 7 --plates 24 --runs 3
      - name: Fixed WG-5 ancestry L6
        run: cargo run --release -p interlink-worldgen-cli --example lake_sediment_infill_performance -- --seed ci-wg5-l7 --coarse-level 5 --level 6 --plates 24 --runs 3
      - name: Fixed WG-5 ancestry L7
        run: cargo run --release -p interlink-worldgen-cli --example lake_sediment_infill_performance -- --seed ci-wg5-l7 --coarse-level 5 --level 7 --plates 24 --runs 3
      - name: Remove temporary workflow
        if: always()
        run: |
          if git ls-files --error-unmatch .github/workflows/temp-wg7d-resolution-matrix.yml >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm .github/workflows/temp-wg7d-resolution-matrix.yml
            git commit -m "WG-7D: remove temporary resolution matrix"
            git push origin HEAD:wg7d-lake-sediment-infill
          fi
