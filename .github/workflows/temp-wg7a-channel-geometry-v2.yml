name: Temporary WG-7A Channel Geometry Refinement V2

on:
  pull_request:

permissions:
  contents: write

jobs:
  refine:
    if: github.event.pull_request.head.ref == 'wg7a-fluvial-erosion-sediment'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg7a-fluvial-erosion-sediment
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - name: Apply channel-geometry refinement
        run: |
          python scripts/temp-wg7a-channel-geometry.py
          rustfmt --edition 2021 rust/interlink-worldgen/src/erosion.rs rust/interlink-worldgen-cli/examples/erosion_performance.rs
          cargo test -p interlink-worldgen erosion::tests --lib
          bash scripts/check-wg7a-erosion.sh
      - name: Remove temporary tooling
        run: |
          rm -f scripts/temp-wg7a-channel-geometry.py
          rm -f .github/workflows/temp-wg7a-channel-geometry-v2.yml
      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use channel geometry for WG-7A sediment supply'
          git push origin HEAD:wg7a-fluvial-erosion-sediment
