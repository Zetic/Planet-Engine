name: Temporary roadmap post-PR48 handoff

on:
  push:
    branches:
      - docs/roadmap-post-pr48-handoff

permissions:
  contents: write

jobs:
  update-roadmap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/roadmap-post-pr48-handoff
      - name: Update ROADMAP handoff and current status
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('ROADMAP.md')
          text = path.read_text()

          title = '# Planet Engine World Generation: Final Architecture and Implementation Roadmap\n\n'
          if title not in text:
              raise SystemExit('ROADMAP title marker not found')
          if '## Previous Agent' in text or '## Recommended steps for next agent' in text:
              raise SystemExit('handoff sections already present')

          handoff = r'''## Current implementation status — after merged PR #48

As of 2026-09-14, `main` includes merged PR #48 (`feat(worldgen): rework continental macro morphology`) at merge commit `3fc9a9e42042703c4f182646208e71b9c66ab7d9`. The accepted engine is **engine v12**, protocol remains **v18**, and WG-3 geology/continental assembly is now **stage v3**.

WG-3 v3 is no longer future work. It is the current accepted upstream continental baseline. The remaining roadmap starts with reusable hydrostatic water infrastructure and WG-4 initial-ocean/tectonic-relief work, then proceeds into lithology and landscape maturation.

## Previous Agent

This section is a handoff summary of the work completed immediately before this roadmap update. It is intended to give a new agent enough context to continue without re-deriving the recent WG-3 investigation.

### Work completed

- **PR #47 — continental morphology observability — merged.** Added deterministic component/hierarchy, elongation, compactness, satellite-area, constriction, multiscale complexity, multi-plate, and tectonic-coupling diagnostics plus fixed-seed acceptance coverage. This established a measurable baseline before changing generation.
- **PR #48 — WG-3 v3 continental macro morphology — merged.** Reworked continental affinity so continent-scale assembly is controlled by anisotropic nuclei, broad structural fabric, tectonic relationships, boundary bias, and broad deterministic assembly corridors. Short-range structural detail is now restricted to bounded bands near provisional crust margins instead of participating everywhere in the global threshold.
- Assembly corridors are allowed only for compatible same-plate/convergent relationships; divergent and unrelated domains are not artificially bridged.
- Exact area-weighted continental/transitional thresholding is still solved after margin detail, so the crust-area contract remains explicit rather than becoming a by-product of smoothing.
- New acceptance gates retained enough coarse shape complexity while reducing satellite fragments and narrow constrictions. The six-seed L4 directional result moved mean satellite-area fraction from about `0.0023` to `0.0012`, mean constricted fraction from `0.0207` to `0.0137`, and coarse complexity from `9.577` to `7.222` while preserving the minimum accepted complexity floor.
- The PR also exposed a **WG-6D seasonal-lake convergence bug**. The spinup termination condition now requires both relative-volume convergence and the existing lake-surface convergence tolerance, rather than allowing either one independently to stop the solve.
- WG-7D benchmark sediment diagnostics were given sufficient printed precision so the existing conservation check is not falsely tripped by output rounding.
- The WG-4 continental-rift acceptance lower bound was recalibrated from 25% to 24% for the new deterministic WG-3 ensemble; the observed aggregate was about 24.48%. Deep-rift and transitional-rift constraints were not weakened.
- The committed browser WASM package was rebuilt with the pinned Rust `1.98.1` / wasm-bindgen `0.2.127` toolchain. Final Planet Engine Tests and WASM parity were green on the clean PR head before merge.

### Current accepted fixed-seed evidence

The post-merge GitHub Pages calibration packet for `interlink-wg7c` at **L6 → L8, 16 plates, 655,362 samples, engine v12** reports:

- 4 significant continental components;
- continental area CV `1.086`;
- largest/median area ratio `13.620×`;
- maximum elongation `1.612`;
- maximum compactness `23.056`;
- largest continental component spans 9 plates;
- significant component areas of about 143.4M, 46.1M, 10.5M, and 4.6M km²;
- land/ocean about `38.8% / 61.2%`;
- mean land elevation about `1357 m`.

Visual review of the same seed using physical elevation/bathymetry and crust-age views with fine tectonic boundaries was accepted for PR #48: the dominant continent reads as a coherent broad multi-plate landmass rather than a set of tiny regions joined by one-cell bridges; several plate boundaries cross continental interiors; margins show broad embayments/lobes without the previous shredded-edge failure mode dominating the silhouette.

The same packet reports seasonal hydrology using the full 24-year spinup cap with final lake-surface cycle change around `0.0162 m`. That explains why some runs may be materially slower after #48: the corrected WG-6D convergence test can legitimately perform more spinup work. Treat a major persistent performance regression as something to profile, but do not undo the physical convergence requirement merely to restore old timing.

### Important interpretation notes

The Pages calibration packet remains an approximate transport/diagnostic product: continental component area is equal-sample rather than canonical dual-cell area, derived topography summaries are unweighted sample summaries, and the per-lake gross inflow/evaporation budget is incomplete in protocol v18. Use it for deterministic regression and directional comparison, not as the final canonical area/budget authority.

The large post-#48 basin/lake/depression values are **not** a reason to reopen WG-3. They belong to later topography, hydrology, hillslope, glacial, shoreline, and final-rebind calibration. Do not tune WG-5/WG-6 around temporary initial geography simply to make the current intermediate world look final.

## Recommended steps for next agent

The immediate next implementation work should follow the dependency order below. Do not start another WG-3 shape-tuning PR unless multi-seed diagnostics reveal a new reproducible regression.

1. **Extract the reusable hydrostatic surface-water solver from WG-4.** This is the next physical PR. Move the existing sea-level/water-volume solve into a public reusable primitive (proposed `surface_water.rs`) without changing accepted WG-4 output. Require bit-for-bit or explicitly tolerance-defined equivalence for sea level, water depth, submerged mask, target/solved water volume, and closure. If output is identical, do not bump WG-4 semantics merely for the refactor.
2. **Then begin WG-4 vNext tectonic relief / initial-ocean geometry work.** Diagnose ridge, trench, arc, rift, deep-ocean contour, orogen-width, and broad ocean-basin geometry using direct component fields. Fix causal response geometry rather than painting coastlines or adding arbitrary noise. Keep the extracted hydrostatic primitive behavior separate from the relief-generation change.
3. **Add WG-4.5 lithology/substrate as an initially observable, mostly inert state.** Establish deterministic rock/provenance classes plus continuous strength, erodibility, permeability, and weathering properties before making erosion consume them.
4. **Make WG-7A/B lithology-aware only after WG-4.5 is accepted.** Preserve sediment conservation and existing deterministic ancestry; use controlled weak-vs-strong substrate tests.
5. Continue the roadmap in order: WG-7E hillslope maturation → WG-7F glacial geomorphology → WG-7G provisional shoreline/outlets → WG-7H coastal sediment/deltas → WG-7I final hydrostatic shoreline → WG-8A final climate rebind → WG-8B final hydrology → WG-9 soil/ecology/vegetation/biomes → WG-10 resources/derived geography.

For the immediate hydrostatic extraction, preserve the current `interlink-wg7c` hashes and accepted WG-4 water state as the regression target. Do not combine the extraction with WG-4 morphology changes. The purpose of that PR is architectural reuse with zero intentional physical change.

For WG-4 vNext, add or extend observability before broad parameter tuning if current diagnostics cannot distinguish the relevant ocean/relief failure modes. Prefer fixed-seed plus holdout-seed acceptance over screenshot-driven single-seed tuning.

'''
          text = text.replace(title, title + handoff, 1)

          text = text.replace(
              'W2 --> W3["WG-3 vNext<br/>Crust + geological assembly"]',
              'W2 --> W3["WG-3 v3<br/>Crust + geological assembly (implemented)"]',
              1,
          )

          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('| **WG-3** | Continental/oceanic/transitional crust, province assembly'):
                  lines[i] = '| **WG-3** | Continental/oceanic/transitional crust, province assembly, inferred history, spreading age, boundary geological regimes. | **WG-3 v3 merged in PR #48.** Treat macro morphology as the accepted baseline; preserve its geological role and revisit only if ensemble diagnostics expose a reproducible upstream regression. |'
              if line.startswith('| **WG-3 vNext** | **Recommended:** retain anisotropic nuclei/terranes'):
                  lines[i] = '| **WG-3 v3 (merged #48)** | Macro assembly now separates broad continental affinity/assembly corridors from bounded margin detail while preserving tectonic coupling and exact crust-area thresholding. | WG-1 topology + WG-2 kinematics + seed → accepted WG-3 v3 crust/history fields. | Existing morphology acceptance remains regression coverage; no immediate WG-3 generation PR is planned. | **Complete for this roadmap tranche.** Future changes require new multi-seed evidence and a stage-version decision. |'
          text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')

          old = '**Continental crust morphology deserves a targeted upstream rework, but it should not become a coastline simulator.** WG-3 currently builds continents from multiscale anisotropic nuclei, terranes, tectonic relationship terms, a broad structural field, and a shorter-scale field that explicitly roughens continental margins before exact area-weighted thresholding. fileciteturn13file0L2-L2 The appropriate correction is to improve the **large-scale connectivity and silhouette of continental crust**—rifts, terrane chains, embayments, necks, accreted arcs, broad shelves—not to add still more short-range boundary noise.'
          new = '**Continental crust macrostructure has received its targeted upstream rework in merged PR #48.** WG-3 v3 now separates broad continental assembly from bounded margin detail, adds deterministic tectonically compatible assembly corridors, and preserves exact area-weighted crust thresholding. Treat that implementation as the current crustal baseline: future WG-3 work should be evidence-driven regression correction, not a continued search for coastline detail. Final shoreline morphology remains a downstream WG-4/WG-7 responsibility.'
          if old in text:
              text = text.replace(old, new, 1)
          else:
              raise SystemExit('continental morphology architectural paragraph not found')

          text = text.replace(
              '**WG-3 vNext — continental macrostructure.** Preserve the current crust/history concept but shift complexity from short-range margin roughness toward large-scale connected morphology: major cratonic provinces, accreted terrane chains, continental rifts, failed rifts, sutures, broad passive margins, necks between provinces and microcontinental fragments. The current documentation already separates crust province from present plate identity and supports merged multi-plate continents, so this is an evolution of the existing model rather than a conceptual rewrite. fileciteturn13file0L2-L2',
              '**WG-3 v3 — continental macrostructure (implemented in merged PR #48).** The accepted implementation now shifts continent-scale connectivity into broad macro affinity and tectonically compatible assembly corridors while limiting short-range structural detail to provisional margin bands. Multi-plate continental assembly remains supported, exact area-weighted crust thresholds remain explicit, and the stage remains crustal/geological truth rather than a coastline simulator.',
              1,
          )

          text = text.replace(
              'The roadmap should include two upstream corrective revisions before adding many downstream processes.',
              'The roadmap originally called for two upstream corrective revisions before adding many downstream processes. The WG-3 revision is now complete in PR #48; WG-4 vNext remains outstanding.',
              1,
          )

          text = text.replace(
              'Rework continental macrostructure before final world completion.',
              'Continental macrostructure rework is implemented as WG-3 v3 in merged PR #48.',
              1,
          )
          text = text.replace(
              'WG-3 vNext should put more variation into:',
              'WG-3 v3 now puts more variation into:',
              1,
          )
          text = text.replace(
              'It should reduce reliance on short-range threshold roughness as the main source\nof continental-outline complexity.',
              'WG-3 v3 reduces reliance on short-range threshold roughness as the main source\nof continental-outline complexity.',
              1,
          )

          order_pattern = re.compile(
              r'## Recommended implementation order\n\nThe preferred implementation sequence is:\n\n1\. extract reusable hydrostatic surface-water solver with zero WG-4 behavior\n   change;\n2\. rework WG-3 continental macrostructure;\n3\. rework WG-4 tectonic relief response;\n4\. add WG-4\.5 lithology/substrate;\n5\. make WG-7A/B lithology-aware;\n6\. add WG-7E hillslope maturation;\n7\. add WG-7F glacial geomorphology;\n8\. add WG-7G provisional shoreline/outlets;\n9\. add WG-7H delta/coastal sedimentation v1;\n10\. add WG-7I final hydrostatic shoreline;\n11\. refactor/rebind WG-8A final climate;\n12\. add WG-8B final hydrology;\n13\. add WG-9A soil/regolith;\n14\. add WG-9B ecological substrate;\n15\. add WG-9C vegetation/PFT equilibrium;\n16\. add WG-9D biome classification;\n17\. begin WG-10 resource geology and derived geography\.\n'
          )
          replacement = '''## Recommended implementation order

WG-3 v3 continental macrostructure is complete in merged PR #48 and is removed from the forward implementation queue. The preferred sequence from the current `main` baseline is:

1. extract the reusable hydrostatic surface-water solver with zero intentional WG-4 behavior change;
2. rework WG-4 tectonic relief and initial-ocean response geometry;
3. add WG-4.5 lithology/substrate;
4. make WG-7A/B lithology-aware;
5. add WG-7E hillslope maturation;
6. add WG-7F glacial geomorphology;
7. add WG-7G provisional shoreline/outlets;
8. add WG-7H delta/coastal sedimentation v1;
9. add WG-7I final hydrostatic shoreline;
10. refactor/rebind WG-8A final climate;
11. add WG-8B final hydrology;
12. add WG-9A soil/regolith;
13. add WG-9B ecological substrate;
14. add WG-9C vegetation/PFT equilibrium;
15. add WG-9D biome classification;
16. begin WG-10 resource geology and derived geography.
'''
          text, count = order_pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'recommended implementation order replacement count={count}')

          old_tranche = '| **Continental morphology** | WG-3 vNext macro assembly; reduce dependence on short-range margin roughness. | Fixes the earliest likely source of blob-shaped continental structure before downstream stages become calibrated around it. |'
          new_tranche = '| **Continental morphology — COMPLETE (#48)** | WG-3 v3 macro assembly and bounded margin detail are merged. | Freeze this as the current upstream baseline; revisit only with reproducible ensemble evidence. |'
          if old_tranche not in text:
              raise SystemExit('continental morphology tranche row not found')
          text = text.replace(old_tranche, new_tranche, 1)

          text = text.replace(
              'This study therefore changes the earlier idea of immediately making a new post-WG-7D coastline authoritative. **Shoreline reconciliation is still essential, but it should not be the first large generation feature.** The safer sequence is to extract the hydrostatic primitive now, fix the major upstream shape generators, introduce lithology, mature the interior landscape, and only then allow the shoreline to migrate.',
              'With WG-3 v3 now merged, the remaining ordering is more concrete. **Shoreline reconciliation is still essential, but it should not be the next large generation feature.** Extract the hydrostatic primitive next, then improve WG-4 tectonic/ocean geometry, introduce lithology, mature the interior landscape, and only then allow the shoreline to migrate.',
              1,
          )

          path.write_text(text)
          PY
      - name: Verify roadmap markers
        run: |
          grep -q '^## Previous Agent$' ROADMAP.md
          grep -q '^## Recommended steps for next agent$' ROADMAP.md
          grep -q 'WG-3 v3 continental macrostructure is complete in merged PR #48' ROADMAP.md
          grep -q 'aa3fba\|3fc9a9e' ROADMAP.md
      - name: Commit roadmap and remove temporary workflow
        run: |
          rm .github/workflows/temp-roadmap-post-pr48.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md .github/workflows/temp-roadmap-post-pr48.yml
          git commit -m "docs(worldgen): update roadmap after WG-3 v3"
          git push origin HEAD:docs/roadmap-post-pr48-handoff
