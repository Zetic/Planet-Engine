name: Temporary WG-5 Hydroclimate Measurement

on:
  push:
    branches: [wg5-hydroclimate-closure]

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run WG-5 hydroclimate quality ensemble
        run: |
          bash scripts/run-wg5-hydroclimate-closure.sh quality | tee hydroclimate-measurement.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wg5-hydroclimate-measurement
          path: hydroclimate-measurement.txt
