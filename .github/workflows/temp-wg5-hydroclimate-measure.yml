name: Temporary WG-5 Hydroclimate Finalization

on:
  push:
    branches: [wg5-hydroclimate-closure]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable and browser target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Restore wasm-bindgen CLI cache
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: ${{ runner.os }}-wasm-bindgen-cli-0.2.127
      - name: Install pinned wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Apply production hydroclimate closure
        run: |
          python - <<'PY'
          from pathlib import Path
          climate = Path('rust/interlink-worldgen/src/climate.rs')
          text = climate.read_text()
          replacements = [
              ('pub const CLIMATE_STAGE_VERSION: u32 = 4;', 'pub const CLIMATE_STAGE_VERSION: u32 = 5;'),
              ('            self.evaporation_bulk_transfer_coefficient,\n            self.moisture_transport_cfl_limit,', '            self.evaporation_bulk_transfer_coefficient,\n            self.evaporation_energy_fraction,\n            self.moisture_transport_cfl_limit,'),
              ('''                    let potential_mass = evaporation_flux * cell_area_m2[i] * phase_seconds;\n                    potential_evaporation_mass_year[i] += potential_mass;\n                    if ocean[i] {\n                        requested_ocean_evaporation_mass[i] = potential_mass;\n''', '''                    let potential_mass = evaporation_flux * cell_area_m2[i] * phase_seconds;\n                    // PET is a reduced potential surface-water demand, not an\n                    // unlimited aerodynamic saturation-deficit integral. Bound\n                    // land demand by the same latent-energy availability used\n                    // for ocean evaporation so exported aridity remains causal\n                    // to the accepted surface energy budget. Ocean PET remains\n                    // the raw requested flux because actual ocean evaporation\n                    // is energy-limited globally below.\n                    let diagnostic_potential_mass = if ocean[i] {\n                        potential_mass\n                    } else {\n                        let energy_limited_mass = parameters.evaporation_energy_fraction\n                            * absorbed_surface_energy_w_m2[i]\n                            * cell_area_m2[i]\n                            * phase_seconds\n                            / LATENT_HEAT_VAPORIZATION_J_PER_KG;\n                        potential_mass.min(energy_limited_mass.max(0.0))\n                    };\n                    potential_evaporation_mass_year[i] += diagnostic_potential_mass;\n                    if ocean[i] {\n                        requested_ocean_evaporation_mass[i] = potential_mass;\n'''),
          ]
          for old, new in replacements:
              if old not in text: raise SystemExit(f'climate patch target not found: {old[:80]!r}')
              text = text.replace(old, new, 1)
          climate.write_text(text)

          wasm_test = Path('rust/interlink-worldgen-wasm/tests/climate_bridge.rs')
          text = wasm_test.read_text()
          old = '    assert_eq!(output.stage_version(), 4);'
          if old not in text: raise SystemExit('WASM stage-version assertion target not found')
          wasm_test.write_text(text.replace(old, '    assert_eq!(output.stage_version(), 5);', 1))

          hydro_test = Path('rust/interlink-worldgen/tests/hydroclimate_closure.rs')
          text = hydro_test.read_text()
          old_import = '    GeologyRequest, LithosphereRequest, PlanetPhysicalParameters, TectonicsRequest,\n    TopographyRequest,\n'
          new_import = '    ClimateParameters, GeologyRequest, LithosphereRequest, PlanetPhysicalParameters,\n    TectonicsRequest, TopographyRequest, CLIMATE_STAGE_VERSION,\n'
          if old_import not in text: raise SystemExit('hydroclimate import target not found')
          text = text.replace(old_import, new_import, 1)
          marker = '#[test]\nfn hydroclimate_closure_report_is_deterministic_finite_and_diagnostic_only() {'
          addition = '''#[test]\nfn hydroclimate_stage_and_latent_energy_parameter_are_explicit() {\n    assert_eq!(CLIMATE_STAGE_VERSION, 5);\n    let baseline = ClimateParameters::default();\n    let mut changed = baseline;\n    changed.evaporation_energy_fraction *= 0.8;\n    assert_ne!(baseline.parameter_hash(), changed.parameter_hash());\n}\n\n'''
          if marker not in text: raise SystemExit('hydroclimate test insertion target not found')
          hydro_test.write_text(text.replace(marker, addition + marker, 1))
          PY

          cat > scripts/check-wg5-hydroclimate-closure.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          MODE="${1:-smoke}"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "${TMP_DIR}"' EXIT
          run_case() {
            local output="$1" seed="$2" coarse="$3" fine="$4" plates="$5"
            cargo run --release -q -p interlink-worldgen-cli --example hydroclimate_closure -- \
              --seed "${seed}" --coarse-level "${coarse}" --level "${fine}" --plates "${plates}" \
              --skip-orography-intervention | tee "${output}"
          }
          check_single() {
            python - "$1" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding='utf-8').read()
          def grab(pattern):
              m = re.search(pattern, text)
              if not m: raise SystemExit(f'missing hydroclimate metric: {pattern}')
              return float(m.group(1))
          mean_p = grab(r'land_precip_mm mean=([0-9.eE+-]+)')
          p50 = grab(r'land_precip_mm mean=[^\n]* p50=([0-9.eE+-]+)')
          p95 = grab(r'land_precip_mm mean=[^\n]* p95=([0-9.eE+-]+)')
          mean_pet = grab(r'land_pet_mm mean=([0-9.eE+-]+)')
          dry = grab(r'land_aridity[^\n]*below_0_2=([0-9.eE+-]+)')
          humid = grab(r'land_aridity[^\n]*at_least_1=([0-9.eE+-]+)')
          ratio = grab(r'tropical_to_subtropical_ratio=([0-9.eE+-]+)')
          snow = grab(r'persistent_snow_land_fraction=([0-9.eE+-]+)')
          ice = grab(r'sea_ice_ocean_fraction=([0-9.eE+-]+)')
          checks = [(100 <= mean_p <= 3000, f'land precipitation mean {mean_p}'), (0 <= p50 <= p95, f'land precipitation percentiles {p50}, {p95}'), (100 <= mean_pet <= 2500, f'land PET mean {mean_pet}'), (0.05 <= dry <= 0.90, f'dry-land fraction {dry}'), (0.01 <= humid <= 0.60, f'humid-land fraction {humid}'), (1.20 <= ratio <= 10.0, f'tropical/subtropical precipitation ratio {ratio}'), (0 <= snow <= 0.60, f'persistent-snow land fraction {snow}'), (0 <= ice <= 0.60, f'sea-ice ocean fraction {ice}')]
          failures = [msg for ok, msg in checks if not ok]
          if failures: raise SystemExit('WG-5 hydroclimate smoke failed: ' + '; '.join(failures))
          print('WG-5 hydroclimate smoke accepted')
          PY
          }
          check_pair() {
            python - "$1" "$2" <<'PY'
          import re, sys
          def parse(path):
              text = open(path, encoding='utf-8').read()
              def grab(pattern):
                  m = re.search(pattern, text)
                  if not m: raise SystemExit(f'missing hydroclimate metric in {path}: {pattern}')
                  return float(m.group(1))
              return {'precip': grab(r'land_precip_mm mean=([0-9.eE+-]+)'), 'pet': grab(r'land_pet_mm mean=([0-9.eE+-]+)'), 'dry': grab(r'land_aridity[^\n]*below_0_2=([0-9.eE+-]+)'), 'humid': grab(r'land_aridity[^\n]*at_least_1=([0-9.eE+-]+)'), 'ratio': grab(r'tropical_to_subtropical_ratio=([0-9.eE+-]+)'), 'snow': grab(r'persistent_snow_land_fraction=([0-9.eE+-]+)'), 'ice': grab(r'sea_ice_ocean_fraction=([0-9.eE+-]+)')}
          low, high = parse(sys.argv[1]), parse(sys.argv[2])
          rel = lambda a, b: abs(b-a) / max(abs(a), 1e-12)
          failures = []
          if rel(low['precip'], high['precip']) > 0.15: failures.append(f"mean land precipitation drift {rel(low['precip'], high['precip']):.3f}")
          if rel(low['pet'], high['pet']) > 0.15: failures.append(f"mean land PET drift {rel(low['pet'], high['pet']):.3f}")
          if abs(high['snow'] - low['snow']) > 0.08: failures.append(f"persistent snow drift {abs(high['snow']-low['snow']):.3f}")
          if abs(high['ice'] - low['ice']) > 0.08: failures.append(f"sea ice drift {abs(high['ice']-low['ice']):.3f}")
          for label, case in [('L6', low), ('L7', high)]:
              if not (0.05 <= case['dry'] <= 0.90): failures.append(f"{label} dry-land fraction {case['dry']:.3f}")
              if not (0.01 <= case['humid'] <= 0.60): failures.append(f"{label} humid-land fraction {case['humid']:.3f}")
              if not (1.20 <= case['ratio'] <= 10.0): failures.append(f"{label} tropical/subtropical ratio {case['ratio']:.3f}")
          if failures: raise SystemExit('WG-5 hydroclimate quality failed: ' + '; '.join(failures))
          print(f"WG-5 hydroclimate quality accepted: precip drift={rel(low['precip'], high['precip']):.3%}, PET drift={rel(low['pet'], high['pet']):.3%}")
          PY
          }
          case "${MODE}" in
            smoke) run_case "${TMP_DIR}/smoke.txt" ci-wg5-hydroclimate 3 4 12; check_single "${TMP_DIR}/smoke.txt" ;;
            quality) run_case "${TMP_DIR}/l6.txt" ci-wg5-l7 5 6 24; run_case "${TMP_DIR}/l7.txt" ci-wg5-l7 5 7 24; check_single "${TMP_DIR}/l6.txt"; check_single "${TMP_DIR}/l7.txt"; check_pair "${TMP_DIR}/l6.txt" "${TMP_DIR}/l7.txt" ;;
            *) echo "usage: $0 [smoke|quality]" >&2; exit 2 ;;
          esac
          SH
          chmod +x scripts/check-wg5-hydroclimate-closure.sh

          cat > docs/worldgen-rewrite/WG5_HYDROCLIMATE_CLOSURE.md <<'MD'
          # WG-5 hydroclimate closure

          WG-5 Stage 5 closes the reduced Earth-like hydroclimate state that WG-6 hydrology will consume. It does not add rivers, lakes, soil moisture, groundwater, storms, cloud microphysics, or a 3-D atmosphere.

          ## Closure change

          Stage `climate:coupled-surface@5` retains the accepted Stage-4 thermal, wind, ocean-current, moisture-transport, and precipitation equations. The physical precipitation field is intentionally unchanged by this closure pass.

          The exported land potential-evaporation diagnostic is now bounded by the same reduced latent-energy availability fraction used by ocean evaporation. Previously PET integrated unrestricted aerodynamic saturation-deficit demand on land while ocean evaporation was energy-limited. That made PET and the derived aridity index strongly resolution-sensitive even when the conserved water cycle itself had converged.

          The `evaporation_energy_fraction` is also now included in `ClimateParameters::parameter_hash()`. Changing this physical closure parameter therefore changes the climate identity as required.

          ## Fixed-ancestry resolution evidence

          Reference seed `ci-wg5-l7`, coarse L5, 24 plates:

          | Metric | L6 | L7 |
          | --- | ---: | ---: |
          | samples | 40,962 | 163,842 |
          | mean land precipitation | 764.353 mm/yr | 712.658 mm/yr |
          | mean land PET, Stage 4 | 1,933.743 mm/yr | 2,824.906 mm/yr |
          | mean land PET, Stage 5 | 949.582 mm/yr | 1,004.102 mm/yr |
          | Stage-5 PET L6→L7 drift | — | 5.7% |
          | persistent-snow land fraction | 0.1317 | 0.1642 |
          | sea-ice ocean fraction | 0.1835 | 0.1987 |

          Stage 5 reduces PET resolution drift from roughly 46% to roughly 5.7% without changing precipitation, thermal state, winds, currents, or moisture conservation. Native-cell precipitation percentiles and spatial coefficient of variation remain diagnostic rather than cross-resolution acceptance metrics because L7 intentionally resolves finer spatial structure.

          ## Permanent acceptance

          `scripts/check-wg5-hydroclimate-closure.sh` provides `smoke` low-resolution structural bounds and `quality` fixed-ancestry L6↔L7 acceptance for precipitation, PET, dry/humid land fractions, cryosphere area, and tropical-to-subtropical rainfall structure. The existing WG-5 L7 gate remains authoritative for thermal convergence and global moisture conservation.

          ## WG-5 → WG-6 forcing contract

          WG-6 may consume WG-4 surface elevation and land/ocean mask plus WG-5 annual/seasonal precipitation, temperature, potential evaporation, moisture balance, snowfall fraction, persistent-snow potential, and hydrologically relevant sea-ice potential. WG-6 must not depend on WG-5 implementation details such as moisture CFL substeps, convergence-precipitation efficiency, solver iteration counts, or limiter occupancy.

          ## Deferred

          Performance optimization is deliberately separate from hydroclimate closure. WG-5 can now be optimized against the Stage-5 accepted outputs without moving the physical target. Hydrology, runoff routing, drainage basins, rivers, lakes, groundwater, erosion, and sediment remain downstream stages.
          MD

      - name: Format focused Rust files
        run: rustfmt --edition 2021 rust/interlink-worldgen/src/climate.rs rust/interlink-worldgen/tests/hydroclimate_closure.rs rust/interlink-worldgen-wasm/tests/climate_bridge.rs
      - name: Recheck focused closure tests
        run: |
          cargo test -p interlink-worldgen --test hydroclimate_closure
          cargo test -p interlink-worldgen-wasm --test climate_bridge
          bash scripts/check-wg5-hydroclimate-closure.sh smoke
      - name: Rebuild committed WASM package
        run: npm run build:worldgen-wasm
      - name: Commit production closure sources
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/interlink-worldgen/src/climate.rs \
                  rust/interlink-worldgen-wasm/tests/climate_bridge.rs \
                  rust/interlink-worldgen/tests/hydroclimate_closure.rs \
                  scripts/check-wg5-hydroclimate-closure.sh \
                  docs/worldgen-rewrite/WG5_HYDROCLIMATE_CLOSURE.md \
                  src/wasm-worldgen
          git commit -m "Close WG-5 hydroclimate state"
          git push origin HEAD:wg5-hydroclimate-closure
