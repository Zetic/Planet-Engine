name: Tune material-aware plate field

on:
  push:
    branches:
      - feat/material-aware-boundary-tectonics

permissions:
  contents: write

jobs:
  tune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/material-aware-boundary-tectonics
          fetch-depth: 0
      - name: Apply material-aware field calibration
        run: |
          python3 scripts/tune-material-aware.py
          python3 scripts/tune-material-centroid-cores.py
          python3 scripts/tune-material-local-affinity.py
          python3 scripts/tune-material-domain-balance.py
          cargo fmt --all
      - name: Validate tuned field
        run: |
          cargo check -p interlink-worldgen -p interlink-worldgen-cli --all-targets
          cargo run --release -p interlink-worldgen-cli --example plate_crust_identity_acceptance
          cargo run --release -p interlink-worldgen-cli --example boundary_network_geometry_acceptance
      - name: Commit tuned source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+Zetic@users.noreply.github.com
          git add rust/interlink-worldgen/src/boundary_plate_geometry.rs
          git commit -m 'feat(worldgen): calibrate material-aware plate field' || exit 0
          git push origin HEAD:feat/material-aware-boundary-tectonics
