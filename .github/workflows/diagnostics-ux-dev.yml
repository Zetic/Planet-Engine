name: Apply diagnostics UX refactor

on:
  push:
    branches:
      - refactor/diagnostics-observability

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/diagnostics-observability
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply refactor
        run: python3 scripts/apply-diagnostics-ux-refactor.py
      - name: Build browser modules
        run: npm run build
      - name: Run browser regressions
        run: npm run test:ts
      - name: Commit validated refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html styles/worldgenLab.css src/worldgen/diagnostics/worldgenClimateLabStandalone.ts dist tests/worldgenDiagnosticsUx.test.ts
          git commit -m "refactor(lab): organize diagnostics and add legends"
          git push origin HEAD:refactor/diagnostics-observability