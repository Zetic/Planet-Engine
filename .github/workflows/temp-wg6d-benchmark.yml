name: Temporary WG-6D Benchmark

on:
  pull_request:

jobs:
  benchmark:
    if: github.event.pull_request.head.ref == 'wg6d-seasonal-hydrology'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Benchmark fixed WG-6D cases
        run: |
          cargo run --release -p interlink-worldgen-cli --example seasonal_performance -- --seed ci-wg6d-seasonal --coarse-level 3 --level 4 --plates 12 --runs 1
          cargo run --release -p interlink-worldgen-cli --example seasonal_performance -- --seed ci-wg6d-seasonal --coarse-level 4 --level 6 --plates 16 --runs 1
          cargo run --release -p interlink-worldgen-cli --example seasonal_performance -- --seed ci-wg6d-seasonal --coarse-level 5 --level 7 --plates 24 --runs 1
      - name: Benchmark accepted WG-5 ancestry
        run: |
          cargo run --release -p interlink-worldgen-cli --example seasonal_performance -- --seed ci-wg5-l7 --coarse-level 5 --level 6 --plates 24 --runs 1
          cargo run --release -p interlink-worldgen-cli --example seasonal_performance -- --seed ci-wg5-l7 --coarse-level 5 --level 7 --plates 24 --runs 1
