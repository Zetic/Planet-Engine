name: Regenerate WG-4.5 WASM package

on:
  push:
    branches:
      - feat/wg45-lithology-substrate

permissions:
  contents: write

env:
  RUST_VERSION: '1.98.1'
  WASM_BINDGEN_VERSION: '0.2.127'

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wg45-lithology-substrate
      - name: Install pinned Rust and browser target
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target wasm32-unknown-unknown
          rustup default "${RUST_VERSION}"
      - name: Restore wasm-bindgen CLI cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: ${{ runner.os }}-wasm-bindgen-cli-${{ env.WASM_BINDGEN_VERSION }}-rust-${{ env.RUST_VERSION }}
      - name: Install pinned wasm-bindgen CLI
        run: |
          if ! command -v wasm-bindgen >/dev/null || ! wasm-bindgen --version | grep -q "${WASM_BINDGEN_VERSION}"; then
            cargo +${RUST_VERSION} install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
          fi
      - name: Rebuild committed browser WASM package
        run: npm run build:worldgen-wasm
      - name: Commit rebuilt WASM package
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/wasm-worldgen
          git commit -m 'build(worldgen): regenerate WG-4.5 WASM package' || exit 0
          git push origin HEAD:feat/wg45-lithology-substrate
