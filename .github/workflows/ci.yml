name: Planet Engine Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser protocol and diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build browser modules
        run: npm run build
      - name: Verify committed browser output
        run: git diff --exit-code -- dist/worldgen
      - name: Run browser regressions
        run: npm run test:ts

  rust:
    name: Rust causal-engine correctness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable and browser target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Compile workspace and all targets
        run: cargo check --workspace --all-targets
      - name: Test pre-orogenic causal cut
        run: cargo test -p interlink-worldgen pre_orogenic
      - name: Test tectonic orogen province invariants
        run: cargo test -p interlink-worldgen orogen_provinces
      - name: Smoke-test tectonic causal foundations
        run: |
          cargo run -p interlink-worldgen-cli --example tectonic_history_smoke
          cargo run -p interlink-worldgen-cli --example pre_orogenic_lithosphere_smoke
          cargo run -p interlink-worldgen-cli --example tectonic_orogen_provinces_smoke
          cargo run -p interlink-worldgen-cli --example tectonic_topography_cutover_smoke
      - name: Verify historical lithosphere lineage and projection
        run: cargo run --release -p interlink-worldgen-cli --example historical_lithosphere_acceptance
      - name: Verify event-driven tectonic morphology
        run: cargo run --release -p interlink-worldgen-cli --example historical_morphology_acceptance
      - name: Verify historical passive-margin shelves
        run: cargo test -p interlink-worldgen historical_passive_margins_create_bounded_shelf_subsidence
      - name: Smoke-test historical morphology through WG-7D
        run: |
          cargo run --release -p interlink-worldgen-cli --bin calibration-report -- --seed ci-historical-morphology-downstream --coarse-level 3 --level 4 --plates 12 --format json > /tmp/historical-morphology-world.json
          python3 -c "import json; p=json.load(open('/tmp/historical-morphology-world.json')); assert p['schema']=='planet-engine-calibration@1'; assert p['run']['engine_version']==16; assert p['run']['sample_count']==2562; assert 0.0 < p['topography']['land_area_fraction'] < 1.0; assert p['hydrology']['lake_count'] >= 0"
      - name: Verify L5 to L8 historical memory and performance
        run: cargo run --release -p interlink-worldgen-cli --example historical_lithosphere_performance
      - name: Compile browser bridge
        run: cargo check -p interlink-worldgen-wasm --target wasm32-unknown-unknown

  legacy-observation:
    name: Legacy calibration telemetry (non-blocking)
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Full legacy workspace tests
        continue-on-error: true
        run: cargo test --workspace
      - name: Legacy physical diagnostics
        continue-on-error: true
        run: |
          cargo run -p interlink-worldgen-cli -- inheritance --seed ci-inheritance --coarse-level 4 --level 6 --plates 18
          cargo run -p interlink-worldgen-cli -- topography --seed ci-wg4 --coarse-level 4 --level 6 --plates 18
          cargo run -p interlink-worldgen-cli -- climate --seed ci-wg5 --coarse-level 3 --level 4 --plates 12
          cargo run -p interlink-worldgen-cli -- profile
      - name: Legacy compact calibration packet
        continue-on-error: true
        run: |
          cargo run --release -p interlink-worldgen-cli --bin calibration-report -- --seed ci-calibration-packet --coarse-level 3 --level 4 --plates 12 --format json > /tmp/planet-calibration.json
          python3 -c "import json; p=json.load(open('/tmp/planet-calibration.json')); assert p['schema']=='planet-engine-calibration@1'; assert p['run']['sample_count']==2562; assert p['hydrology']['lake_count'] >= 0"
      - name: Legacy canonical L5→L8 full-pipeline smoke
        continue-on-error: true
        run: |
          cargo run --release -p interlink-worldgen-cli --bin calibration-report -- --seed ci-l8-canonical --coarse-level 5 --level 8 --plates 16 --format json > /tmp/planet-l8-calibration.json
          python3 -c "import json; p=json.load(open('/tmp/planet-l8-calibration.json')); assert p['schema']=='planet-engine-calibration@1'; assert p['run']['coarse_level']==5; assert p['run']['fine_level']==8; assert p['run']['sample_count']==655362; assert p['hydrology']['lake_count'] >= 0"
      - name: Legacy WG-3 continental assembly diversity
        continue-on-error: true
        run: cargo run --release -p interlink-worldgen-cli --example continental_shape_acceptance
      - name: Legacy WG-4 ridge morphology
        continue-on-error: true
        run: cargo run --release -p interlink-worldgen-cli --example topography_boundary_acceptance
      - name: Legacy WG-4 ridge response profile
        continue-on-error: true
        run: cargo run --release -p interlink-worldgen-cli --example topography_ridge_profile_acceptance
      - name: Legacy WG-4 connected ridge islands
        continue-on-error: true
        run: cargo run --release -p interlink-worldgen-cli --example topography_divergent_morphology_acceptance
      - name: Legacy WG-4 all-regime morphology
        continue-on-error: true
        run: cargo run --release -p interlink-worldgen-cli --example topography_boundary_morphology_acceptance
      - name: Legacy WG-4 oceanic arcs
        continue-on-error: true
        run: cargo run --release -p interlink-worldgen-cli --example topography_arc_morphology_acceptance
      - name: Legacy WG-4 continental rifts
        continue-on-error: true
        run: cargo run --release -p interlink-worldgen-cli --example topography_rift_acceptance
      - name: Legacy WG-4 rift response profile
        continue-on-error: true
        run: cargo run --release -p interlink-worldgen-cli --example topography_rift_profile_acceptance
      - name: Legacy WG-4 active-collision response
        continue-on-error: true
        run: cargo run --release -p interlink-worldgen-cli --example topography_orogen_profile_acceptance
      - name: Legacy WG-4 inherited-orogen morphology
        continue-on-error: true
        run: cargo run --release -p interlink-worldgen-cli --example topography_inherited_orogen_morphology_acceptance
      - name: Legacy WG-3 inherited-orogen source geometry
        continue-on-error: true
        run: cargo run --release -p interlink-worldgen-cli --example geology_orogen_geometry_acceptance
      - name: Legacy WG-6A drainage
        continue-on-error: true
        run: bash scripts/check-wg6a-drainage.sh
      - name: Legacy WG-6B runoff
        continue-on-error: true
        run: bash scripts/check-wg6b-runoff.sh
      - name: Legacy WG-5→WG-6 hydroclimate partition
        continue-on-error: true
        run: cargo run --release -p interlink-worldgen-cli --example hydroclimate_partition_acceptance
      - name: Legacy WG-6C lakes
        continue-on-error: true
        run: bash scripts/check-wg6c-lakes.sh
      - name: Legacy WG-6D seasonal hydrology
        continue-on-error: true
        run: bash scripts/check-wg6d-seasonal.sh
      - name: Legacy WG-7A erosion
        continue-on-error: true
        run: bash scripts/check-wg7a-erosion.sh
      - name: Legacy WG-7B terrain evolution
        continue-on-error: true
        run: bash scripts/check-wg7b-evolution.sh
      - name: Legacy WG-7C reconciliation
        continue-on-error: true
        run: bash scripts/check-wg7c-reconciliation.sh
      - name: Legacy WG-7D lake infill
        continue-on-error: true
        run: bash scripts/check-wg7d-lake-infill.sh
      - name: Legacy WG-5 calibration report
        continue-on-error: true
        run: cargo run --release -p interlink-worldgen-cli --example climate_calibration -- --seed ci-wg5-calibration --coarse-level 3 --level 4 --plates 12 --skip-orography-intervention
      - name: Legacy WG-5 hydroclimate closure
        continue-on-error: true
        run: bash scripts/check-wg5-hydroclimate-closure.sh smoke
      - name: Legacy WG-5 L7 convergence/conservation
        continue-on-error: true
        run: cargo run --release -p interlink-worldgen-cli -- climate --seed ci-wg5-l7 --coarse-level 5 --level 7 --plates 24
