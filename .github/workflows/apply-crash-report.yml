name: Apply worldgen crash report integration

on:
  push:
    branches: [feat/worldgen-crash-report]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[crash-report-driver]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/worldgen-crash-report
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply debugger fixes
        run: python3 scripts/fix-crash-recorder-env.py
      - name: Install dependencies
        run: npm ci
      - name: Build browser modules
        run: npm run build
      - name: Run TypeScript regressions
        run: npm run test:ts
      - name: Commit debugger fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src dist
          git diff --cached --quiet && exit 0
          git commit -m 'perf(worldgen): keep crash recorder instrumentation lightweight [crash-report-applied]'
          git push origin HEAD:feat/worldgen-crash-report
