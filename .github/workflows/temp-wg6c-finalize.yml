name: Temporary WG-6C Finalize

on:
  push:
    branches: [wg6c-lakes-closed-basins]

permissions:
  contents: write

concurrency:
  group: temporary-wg6c-finalize
  cancel-in-progress: true

env:
  RUST_VERSION: '1.98.1'
  WASM_BINDGEN_VERSION: '0.2.127'

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg6c-lakes-closed-basins
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install pinned Rust and browser target
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target wasm32-unknown-unknown
          rustup default "${RUST_VERSION}"
      - name: Restore wasm-bindgen CLI cache
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: ${{ runner.os }}-wasm-bindgen-cli-${{ env.WASM_BINDGEN_VERSION }}-rust-${{ env.RUST_VERSION }}
      - name: Install pinned wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo +${RUST_VERSION} install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - name: Document final WG-6C contract
        run: python scripts/temp-wg6c-finalize.py
      - name: Rebuild committed browser WASM package
        run: npm run build:worldgen-wasm
      - name: Build browser modules
        run: npm run build
      - name: Run browser regressions
        run: npm run test:ts
      - name: Run Rust workspace regressions
        run: cargo +${RUST_VERSION} test --workspace
      - name: Run permanent WG-6C smoke gate
        run: bash scripts/check-wg6c-lakes.sh
      - name: Commit WG-6C documentation and packaged parity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/worldgen-rewrite/WG6_HYDROLOGY.md src/wasm-worldgen dist/worldgen
          git commit -m 'Finalize WG-6C documentation and WASM parity'
          git push origin HEAD:wg6c-lakes-closed-basins
