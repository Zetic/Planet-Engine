name: Continental hypsometry development

on:
  push:
    branches:
      - calibrate/continental-hypsometry

permissions:
  contents: write

concurrency:
  group: continental-hypsometry-dev
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: calibrate/continental-hypsometry
          fetch-depth: 0
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Apply candidate continental freeboard calibration
        run: python3 scripts/apply-continental-hypsometry-calibration.py
      - name: Compile calibration target
        run: cargo check -p interlink-worldgen -p interlink-worldgen-cli --all-targets
      - name: Measure continental hypsometry
        run: cargo run --release -p interlink-worldgen-cli --example continental_hypsometry_acceptance
      - name: Preserve WG-4 tectonic topology acceptance
        run: cargo run --release -p interlink-worldgen-cli --example tectonic_topography_cutover_smoke
      - name: Preserve passive-margin shelves
        run: cargo test -p interlink-worldgen historical_passive_margins_create_bounded_shelf_subsidence
      - name: Commit validated calibration source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/interlink-worldgen/src/historical_topography.rs rust/interlink-worldgen/src/lib.rs rust/interlink-worldgen-cli/examples/tectonic_topography_cutover_smoke.rs
          git commit -m 'calibrate(worldgen): raise stable continental freeboard' || exit 0
          git push origin HEAD:calibrate/continental-hypsometry
