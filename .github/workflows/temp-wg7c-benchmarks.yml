name: Temporary WG-7C Benchmark Matrix

on:
  push:
    branches: [wg7c-post-erosion-hydrology]

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: release-l4
            seed: ci-wg7b-evolution
            coarse: 3
            level: 4
            plates: 12
          - label: release-l6
            seed: ci-wg7b-evolution
            coarse: 4
            level: 6
            plates: 16
          - label: release-l7
            seed: ci-wg7b-evolution
            coarse: 5
            level: 7
            plates: 24
          - label: ancestry-l6
            seed: ci-wg5-l7
            coarse: 5
            level: 6
            plates: 24
          - label: ancestry-l7
            seed: ci-wg5-l7
            coarse: 5
            level: 7
            plates: 24
    runs-on: ubuntu-24.04
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg7c-post-erosion-hydrology
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Benchmark WG-7C
        run: |
          cargo run --release -p interlink-worldgen-cli --example post_erosion_hydrology_performance -- \
            --seed "${{ matrix.seed }}" \
            --coarse-level "${{ matrix.coarse }}" \
            --level "${{ matrix.level }}" \
            --plates "${{ matrix.plates }}" \
            --runs 3
