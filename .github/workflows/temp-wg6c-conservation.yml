name: Temporary WG-6C Conservation Fix

on:
  push:
    branches: [wg6c-lakes-closed-basins]

permissions:
  contents: write

concurrency:
  group: temporary-wg6c-conservation
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg6c-lakes-closed-basins
          fetch-depth: 0
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Apply active-depression conservation fix
        run: python scripts/temp-wg6c-conservation.py
      - name: Format changed Rust source
        run: rustfmt +1.98.1 rust/interlink-worldgen/src/lakes.rs
      - name: Run WG-6C Rust regressions
        run: cargo +1.98.1 test -p interlink-worldgen lakes::tests
      - name: Verify WG-6C conservation at accepted resolutions
        run: |
          cargo +1.98.1 run --release -p interlink-worldgen-cli --example lake_performance -- --seed ci-wg6c-lakes --coarse-level 3 --level 4 --plates 12 --runs 1
          cargo +1.98.1 run --release -p interlink-worldgen-cli --example lake_performance -- --seed ci-wg6c-lakes --coarse-level 4 --level 6 --plates 16 --runs 1
          cargo +1.98.1 run --release -p interlink-worldgen-cli --example lake_performance -- --seed ci-wg6c-lakes --coarse-level 5 --level 7 --plates 24 --runs 1
      - name: Commit WG-6C conservation correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/interlink-worldgen/src/lakes.rs
          git commit -m 'Conserve realized flow across active lake depressions'
          git push origin HEAD:wg6c-lakes-closed-basins
