name: Temporary WG-7B Lab and Docs Integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'wg7b-bounded-terrain-evolution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply WG-7B Lab/docs transformer
        run: python scripts/temp-wg7b-lab-docs.py
      - name: Build browser modules
        run: npm run build
      - name: Run browser regressions
        run: npm run test:ts
      - name: Remove temporary transformer
        run: rm scripts/temp-wg7b-lab-docs.py
      - name: Commit WG-7B Lab/docs integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html docs/worldgen-rewrite src/worldgen/diagnostics/worldgenClimateLabStandalone.ts dist/worldgen/diagnostics/worldgenClimateLabStandalone.js tests scripts/temp-wg7b-lab-docs.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Integrate WG-7B into the cumulative Lab and docs"
            git push origin HEAD:${{ github.head_ref }}
          fi
