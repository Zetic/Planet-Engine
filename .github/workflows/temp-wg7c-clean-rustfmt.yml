name: Temporary WG-7C Rustfmt Cleanup

on:
  push:
    branches:
      - wg7c-post-erosion-hydrology

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg7c-post-erosion-hydrology
          fetch-depth: 0
      - name: Restore unrelated rustfmt churn
        run: |
          git fetch origin main
          git checkout origin/main -- \
            rust/interlink-worldgen-cli/examples/drainage_performance.rs \
            rust/interlink-worldgen-cli/examples/hydroclimate_closure.rs \
            rust/interlink-worldgen-cli/examples/terrain_evolution_performance.rs \
            rust/interlink-worldgen/src/hydroclimate.rs \
            rust/interlink-worldgen/tests/crust_plate_independence.rs \
            rust/interlink-worldgen/tests/geology_ensemble.rs \
            rust/interlink-worldgen/tests/tectonic_plate_distribution.rs \
            rust/interlink-worldgen/tests/topography_ensemble.rs
      - name: Commit cleanup and self-clean
        run: |
          rm .github/workflows/temp-wg7c-clean-rustfmt.yml
          git config user.name "Zetic"
          git config user.email "105380590+Zetic@users.noreply.github.com"
          git add -A
          git commit -m "WG-7C: remove unrelated rustfmt churn"
          git push origin HEAD:wg7c-post-erosion-hydrology
