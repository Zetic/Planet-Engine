name: Temporary WG-4 Boundary Calibration

on:
  push:
    branches:
      - wg4-boundary-emergence-calibration

permissions:
  contents: write

env:
  RUST_VERSION: '1.98.1'
  WASM_BINDGEN_VERSION: '0.2.127'

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Rust and browser target
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target wasm32-unknown-unknown --component rustfmt
          rustup default "${RUST_VERSION}"
      - name: Restore wasm-bindgen CLI cache
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: ${{ runner.os }}-wasm-bindgen-cli-${{ env.WASM_BINDGEN_VERSION }}-rust-${{ env.RUST_VERSION }}
      - name: Install pinned wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo +${RUST_VERSION} install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - name: Install browser dependencies
        run: npm ci
      - name: Apply WG-4 boundary calibration
        run: python3 scripts/temp-wg4-boundary-calibration.py
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Test Rust workspace
        run: cargo test --workspace
      - name: Run WG-4 L5→L7 boundary acceptance
        run: cargo run --release -p interlink-worldgen-cli --example topography_boundary_acceptance
      - name: Rebuild committed WASM package
        run: npm run build:worldgen-wasm
      - name: Build browser modules
        run: npm run build
      - name: Run browser regressions
        run: npm run test:ts
      - name: Run WG-7D physical acceptance
        run: bash scripts/check-wg7d-lake-infill.sh
      - name: Commit calibrated WG-4 integration
        run: |
          rm .github/workflows/temp-wg4-boundary-calibration.yml
          rm scripts/temp-wg4-boundary-calibration.py
          rm rust/interlink-worldgen-cli/examples/wg4_boundary_calibration.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "calibrate: reduce emergent oceanic ridge relief"
          git push
