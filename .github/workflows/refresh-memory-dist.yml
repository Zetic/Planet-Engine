name: Refresh memory branch browser output

on:
  push:
    branches: [perf/l8-memory-architecture]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ contains(github.event.head_commit.message, '[dist-driver]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/l8-memory-architecture
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild committed browser output
        run: npm run build
      - name: Commit generated dist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/worldgen
          git diff --cached --quiet && exit 0
          git commit -m 'build(worldgen): refresh protocol 19 browser output [dist-refresh]'
          git push origin HEAD:perf/l8-memory-architecture
