name: Temporary WG-4 Hypsometry Sweep

on:
  push:
    branches: [wg4-hypsometry-calibration]

permissions:
  contents: read

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        scenario: [baseline, iso075, iso060, iso050, balanced_a, balanced_b]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Apply scenario
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path('rust/interlink-worldgen/src/topography.rs')
          s = p.read_text()
          scenario = os.environ['SCENARIO']
          values = {
              'baseline': {},
              'iso075': {'isostatic_scale: 1.0':'isostatic_scale: 0.75'},
              'iso060': {'isostatic_scale: 1.0':'isostatic_scale: 0.60'},
              'iso050': {'isostatic_scale: 1.0':'isostatic_scale: 0.50'},
              'balanced_a': {
                  'isostatic_scale: 1.0':'isostatic_scale: 0.60',
                  'inherited_orogeny_scale_m: 1_900.0':'inherited_orogeny_scale_m: 1_400.0',
                  'collision_uplift_scale_m: 3_600.0':'collision_uplift_scale_m: 2_800.0',
                  'collision_width_m: 850_000.0':'collision_width_m: 650_000.0',
                  'mantle_dynamic_scale_m: 1_000.0':'mantle_dynamic_scale_m: 800.0',
              },
              'balanced_b': {
                  'isostatic_scale: 1.0':'isostatic_scale: 0.55',
                  'inherited_orogeny_scale_m: 1_900.0':'inherited_orogeny_scale_m: 1_200.0',
                  'collision_uplift_scale_m: 3_600.0':'collision_uplift_scale_m: 2_400.0',
                  'collision_width_m: 850_000.0':'collision_width_m: 600_000.0',
                  'mantle_dynamic_scale_m: 1_000.0':'mantle_dynamic_scale_m: 650.0',
              },
          }[scenario]
          for old, new in values.items():
              if old not in s:
                  raise SystemExit(f'missing anchor: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Topography reference metrics
        run: cargo run --release -q -p interlink-worldgen-cli -- topography --seed interlink-wg5 --coarse-level 4 --level 6 --plates 16
      - name: Climate calibration reference metrics
        run: cargo run --release -q -p interlink-worldgen-cli --example climate_calibration -- --seed interlink-wg5 --coarse-level 4 --level 6 --plates 16 --skip-orography-intervention
