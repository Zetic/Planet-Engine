name: Temporary WG-6D Final Benchmark

on:
  pull_request:

permissions:
  contents: read

jobs:
  benchmark:
    if: github.event.pull_request.head.ref == 'wg6d-seasonal-hydrology'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Benchmark fixed release cases
        run: |
          set -euxo pipefail
          cargo run --release -p interlink-worldgen-cli --example seasonal_performance -- --seed ci-wg6c-lakes --coarse-level 3 --level 4 --plates 12 --runs 3
          cargo run --release -p interlink-worldgen-cli --example seasonal_performance -- --seed ci-wg6c-lakes --coarse-level 4 --level 6 --plates 16 --runs 3
          cargo run --release -p interlink-worldgen-cli --example seasonal_performance -- --seed ci-wg6c-lakes --coarse-level 5 --level 7 --plates 24 --runs 3
      - name: Benchmark accepted WG-5 ancestry
        run: |
          set -euxo pipefail
          cargo run --release -p interlink-worldgen-cli --example seasonal_performance -- --seed ci-wg5-l7 --coarse-level 5 --level 6 --plates 24 --runs 3
          cargo run --release -p interlink-worldgen-cli --example seasonal_performance -- --seed ci-wg5-l7 --coarse-level 5 --level 7 --plates 24 --runs 3
