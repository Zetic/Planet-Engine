name: Temporary WG-5 Evaporation Wind-Cap Sweep

on:
  push:
    branches: [wg5-moisture-transport-rebuild]

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        evap_wind_cap: ['4.0', '6.0', '8.0']
    name: evap-cap-${{ matrix.evap_wind_cap }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg5-moisture-transport-rebuild
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Apply moisture prototype
        env:
          EVAP_BULK: '0.0015'
          MOISTURE_SUBSTEPS: '4'
          MOISTURE_CFL: '0.90'
          CONVERGENCE_RH: '0.60'
          CONVERGENCE_EFF: '0.35'
          MOISTURE_SPEED_CAP: '1.0'
          EVAP_WIND_CAP: ${{ matrix.evap_wind_cap }}
        run: |
          set -euo pipefail
          python scripts/wg5_moisture_patch.py
          python scripts/wg5_moisture_adaptive_patch.py
          python scripts/wg5_moisture_adaptive_fix.py
          python scripts/wg5_moisture_speedcap_patch.py
          python scripts/wg5_moisture_speedcap_fix.py
          python scripts/wg5_moisture_substeps64_patch.py
          python scripts/wg5_evap_windcap_sweep_patch.py
          python scripts/wg5_moisture_evap_diagnostics_patch.py
          cargo fmt --all
          cargo check -p interlink-worldgen
          cargo check -p interlink-worldgen-cli --examples
      - name: Run fixed-coarse L6
        run: |
          set -euo pipefail
          cargo run --release -p interlink-worldgen-cli --example climate_calibration -- --seed ci-wg5-l7 --coarse-level 5 --level 6 --plates 24 --skip-orography-intervention
      - name: Run fixed-coarse L7
        run: |
          set -euo pipefail
          cargo run --release -p interlink-worldgen-cli --example climate_calibration -- --seed ci-wg5-l7 --coarse-level 5 --level 7 --plates 24 --skip-orography-intervention
