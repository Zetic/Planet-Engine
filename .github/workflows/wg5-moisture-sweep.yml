name: Temporary WG-5 Moisture Sweep

on:
  push:
    branches: [wg5-moisture-transport-rebuild]

jobs:
  adaptive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg5-moisture-transport-rebuild
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Apply adaptive moisture prototype
        env:
          EVAP_BULK: '0.0015'
          MOISTURE_SUBSTEPS: '4'
          MOISTURE_CFL: '0.90'
          CONVERGENCE_RH: '0.60'
          CONVERGENCE_EFF: '0.35'
        run: |
          set -euo pipefail
          python scripts/wg5_moisture_patch.py
          python scripts/wg5_moisture_adaptive_patch.py
          cargo fmt --all
          cargo check -p interlink-worldgen
          cargo check -p interlink-worldgen-cli --examples
      - name: Run reference L6 calibration
        run: |
          set -euo pipefail
          cargo run --release -p interlink-worldgen-cli --example climate_calibration -- --seed interlink-wg5 --coarse-level 4 --level 6 --plates 16 --skip-orography-intervention
      - name: Run L7 calibration
        run: |
          set -euo pipefail
          cargo run --release -p interlink-worldgen-cli --example climate_calibration -- --seed ci-wg5-l7 --coarse-level 5 --level 7 --plates 24 --skip-orography-intervention
