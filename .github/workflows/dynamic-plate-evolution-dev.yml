name: Dynamic Plate Evolution Development

on:
  push:
    branches: [feat/dynamic-plate-evolution]
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_VERSION: '1.98.1'
  WASM_BINDGEN_VERSION: '0.2.127'

jobs:
  validate-and-land:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust and browser target
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup default "${RUST_VERSION}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Apply dynamic plate cutover
        run: python scripts/apply-dynamic-plate-evolution.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Compile workspace
        run: cargo check --workspace --all-targets
      - name: Run dynamic plate unit tests
        run: cargo test -p interlink-worldgen dynamic_modern_boundaries_cut_across_ancestral_cells -- --nocapture
      - name: Run dynamic plate geometry acceptance
        run: cargo run -p interlink-worldgen-cli --example dynamic_plate_geometry_acceptance
      - name: Run historical lithosphere acceptance
        run: cargo run -p interlink-worldgen-cli --example historical_lithosphere_acceptance
      - name: Run historical morphology acceptance
        run: cargo run -p interlink-worldgen-cli --example historical_morphology_acceptance
      - name: Run WG-4 topography acceptance
        run: cargo run -p interlink-worldgen-cli --example tectonic_topography_cutover_smoke
      - name: Install pinned wasm-bindgen CLI
        run: cargo +${RUST_VERSION} install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - name: Regenerate committed WASM package
        run: npm run build:worldgen-wasm
      - name: Build browser modules
        run: npm run build
      - name: Run browser regressions
        run: npm run test:ts
      - name: Commit validated cutover
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/interlink-worldgen/src/lib.rs \
            rust/interlink-worldgen/src/historical_api.rs \
            rust/interlink-worldgen/src/historical_lithosphere.rs \
            rust/interlink-worldgen/src/historical_frontend.rs \
            rust/interlink-worldgen-cli/examples/historical_lithosphere_acceptance.rs \
            .github/workflows/ci.yml \
            src/wasm-worldgen
          if git diff --cached --quiet; then
            echo 'No generated cutover changes to commit.'
          else
            git commit -m 'feat(worldgen): evolve modern plate geometry dynamically'
            git push
          fi
