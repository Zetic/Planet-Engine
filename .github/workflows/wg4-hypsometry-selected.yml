name: Temporary WG-4 Selected Hypsometry Validation

on:
  push:
    branches: [wg4-hypsometry-calibration]

permissions:
  contents: read

jobs:
  selected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Apply selected calibration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('rust/interlink-worldgen/src/topography.rs')
          s = p.read_text()
          replacements = {
              'pub const TOPOGRAPHY_STAGE_VERSION: u32 = 1;':'pub const TOPOGRAPHY_STAGE_VERSION: u32 = 2;',
              'isostatic_scale: 1.0':'isostatic_scale: 0.55',
              'inherited_orogeny_scale_m: 1_900.0':'inherited_orogeny_scale_m: 1_200.0',
              'collision_uplift_scale_m: 3_600.0':'collision_uplift_scale_m: 2_400.0',
              'collision_width_m: 850_000.0':'collision_width_m: 600_000.0',
              'mantle_dynamic_scale_m: 1_000.0':'mantle_dynamic_scale_m: 650.0',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing anchor: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: L4 topography ensemble
        run: |
          for seed in wg4-e0 wg4-e1 wg4-e2 wg4-e3 wg4-e4; do
            echo "=== ${seed} ==="
            cargo run --release -q -p interlink-worldgen-cli -- topography --seed "${seed}" --coarse-level 3 --level 4 --plates 12
          done
      - name: L6 calibration ensemble
        run: |
          for seed in interlink-wg5 wg5-cal-a wg5-cal-b wg5-cal-c; do
            echo "=== ${seed} ==="
            cargo run --release -q -p interlink-worldgen-cli --example climate_calibration -- --seed "${seed}" --coarse-level 4 --level 6 --plates 16 --skip-orography-intervention
          done
      - name: L7 climate acceptance
        run: cargo run --release -q -p interlink-worldgen-cli -- climate --seed ci-wg5-l7 --coarse-level 5 --level 7 --plates 24
