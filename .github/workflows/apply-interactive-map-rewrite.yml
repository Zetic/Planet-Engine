name: Apply interactive equirectangular viewer rewrite

on:
  push:
    branches: [feat/interactive-equirectangular-view]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[interactive-map-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/interactive-equirectangular-view
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source rewrite
        run: python3 scripts/apply-interactive-map-rewrite.py
      - name: Install browser dependencies
        run: npm ci
      - name: Build browser modules
        run: npm run build
      - name: Run browser regressions
        run: npm run test:ts
      - name: Commit viewer rewrite and generated browser output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worldgen/diagnostics/worldgenClimateLabStandalone.ts \
                  src/worldgen/diagnostics/worldgenClimateMath.ts \
                  styles/worldgenLab.css \
                  index.html \
                  docs/worldgen-rewrite/L8_VIEWER_USABILITY.md \
                  tests/l8Viewer.test.ts \
                  dist
          git commit -m "feat(viewer): add interactive inverse-rasterized map [interactive-map-applied]"
          git push origin HEAD:feat/interactive-equirectangular-view
