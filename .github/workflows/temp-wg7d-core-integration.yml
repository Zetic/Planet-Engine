name: Temporary WG-7D Core Integration

on:
  push:
    branches:
      - wg7d-lake-sediment-infill

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg7d-lake-sediment-infill
      - name: Apply WG-7D core integration
        run: python3 scripts/temp-wg7d-core-integration.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Test Rust workspace
        run: cargo test --workspace
      - name: Commit WG-7D core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-wg7d-core-integration.yml scripts/temp-wg7d-core-integration.py
          git add rust/interlink-worldgen/src/lib.rs rust/interlink-worldgen/src/evolution.rs rust/interlink-worldgen/src/infill.rs
          git commit -m "WG-7D: add bounded lake sediment infill core"
          git push origin HEAD:wg7d-lake-sediment-infill
