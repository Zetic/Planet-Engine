name: Temporary WG-4 Rift Seaway Profiles

on:
  push:
    branches:
      - wg4-rift-seaway-calibration

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Baseline WG-4 @4
        run: cargo run --release -p interlink-worldgen-cli --example wg4_rift_seaway_profiles
      - name: Variant A - remove weak-rift floor
        run: |
          git checkout -- rust/interlink-worldgen/src/topography.rs
          python3 scripts/temp-wg4-rift-profile.py --direct-scale 1.00 --base 0.10 --history-floor 0.45 --inherited-weight 0.45
          cargo run --release -p interlink-worldgen-cli --example wg4_rift_seaway_profiles
      - name: Variant B - maturity-weighted 0.75 direct
        run: |
          git checkout -- rust/interlink-worldgen/src/topography.rs
          python3 scripts/temp-wg4-rift-profile.py --direct-scale 0.75 --base 0.10 --history-floor 0.35 --inherited-weight 0.40
          cargo run --release -p interlink-worldgen-cli --example wg4_rift_seaway_profiles
      - name: Variant C - maturity-weighted 0.60 direct
        run: |
          git checkout -- rust/interlink-worldgen/src/topography.rs
          python3 scripts/temp-wg4-rift-profile.py --direct-scale 0.60 --base 0.10 --history-floor 0.25 --inherited-weight 0.35
          cargo run --release -p interlink-worldgen-cli --example wg4_rift_seaway_profiles
      - name: Variant D - maturity-weighted 0.50 direct
        run: |
          git checkout -- rust/interlink-worldgen/src/topography.rs
          python3 scripts/temp-wg4-rift-profile.py --direct-scale 0.50 --base 0.10 --history-floor 0.20 --inherited-weight 0.30
          cargo run --release -p interlink-worldgen-cli --example wg4_rift_seaway_profiles
