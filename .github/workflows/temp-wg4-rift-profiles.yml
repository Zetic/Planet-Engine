name: Temporary WG-4 Rift Seaway Profiles

on:
  push:
    branches:
      - wg4-rift-seaway-calibration

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Baseline WG-4 @4 continental rifts
        run: cargo run --release -p interlink-worldgen-cli --example wg4_rift_seaway_profiles
      - name: Baseline WG-4 @4 transitional divergence
        run: cargo run --release -p interlink-worldgen-cli --example wg4_transition_seaway_profiles
      - name: Apply conditional continental-rift candidate
        run: python3 scripts/temp-wg4-rift-conditional.py
      - name: Candidate continental rifts
        run: cargo run --release -p interlink-worldgen-cli --example wg4_rift_seaway_profiles
      - name: Candidate transitional divergence
        run: cargo run --release -p interlink-worldgen-cli --example wg4_transition_seaway_profiles
