name: Temporary WG-4 Rift Seaway Profiles

on:
  push:
    branches:
      - wg4-rift-seaway-calibration

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Baseline WG-4 @4
        run: cargo run --release -p interlink-worldgen-cli --example wg4_rift_seaway_profiles
      - name: Variant E - low explicit rift relief
        run: |
          git checkout -- rust/interlink-worldgen/src/topography.rs
          python3 scripts/temp-wg4-rift-profile.py --direct-scale 0.25 --base 0.05 --history-floor 0.10 --inherited-weight 0.15
          cargo run --release -p interlink-worldgen-cli --example wg4_rift_seaway_profiles
      - name: Variant F - minimal explicit rift relief
        run: |
          git checkout -- rust/interlink-worldgen/src/topography.rs
          python3 scripts/temp-wg4-rift-profile.py --direct-scale 0.10 --base 0.05 --history-floor 0.05 --inherited-weight 0.05
          cargo run --release -p interlink-worldgen-cli --example wg4_rift_seaway_profiles
      - name: Variant G - no explicit rift boundary/history depression
        run: |
          git checkout -- rust/interlink-worldgen/src/topography.rs
          python3 scripts/temp-wg4-rift-profile.py --direct-scale 0.00 --base 0.00 --history-floor 0.00 --inherited-weight 0.00
          cargo run --release -p interlink-worldgen-cli --example wg4_rift_seaway_profiles
