name: Planet Engine WASM Parity

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust/**'
      - 'scripts/build-worldgen-wasm.sh'
      - 'src/wasm-worldgen/**'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust/**'
      - 'scripts/build-worldgen-wasm.sh'
      - 'src/wasm-worldgen/**'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: '1.98.1'
  WASM_BINDGEN_VERSION: '0.2.127'

jobs:
  package:
    name: Packaged WASM parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
      - name: Install pinned Rust and browser target
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target wasm32-unknown-unknown
          rustup default "${RUST_VERSION}"
      - name: Restore wasm-bindgen CLI cache
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: ${{ runner.os }}-wasm-bindgen-cli-${{ env.WASM_BINDGEN_VERSION }}-rust-${{ env.RUST_VERSION }}
      - name: Install pinned wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo +${RUST_VERSION} install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - name: Record packaging toolchain
        run: |
          rustc --version
          wasm-bindgen --version
      - name: Rebuild committed browser WASM package
        run: npm run build:worldgen-wasm
      - name: Upload rebuilt WASM package
        uses: actions/upload-artifact@v4
        with:
          name: worldgen-wasm-package
          path: src/wasm-worldgen
          retention-days: 3
      - name: Sync generated package for PR B
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/material-history-tectonic-morphology'
        run: |
          if ! git diff --quiet -- src/wasm-worldgen; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/wasm-worldgen
            git commit -m 'build(worldgen): refresh generated wasm package'
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - name: Verify committed WASM package parity
        run: git diff --exit-code -- src/wasm-worldgen
