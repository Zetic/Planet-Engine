name: Topography Blocker Fix

on:
  push:
    branches: [feat/tectonic-synthesis-cleanup]

permissions:
  contents: write

env:
  RUST_VERSION: '1.98.1'
  WASM_BINDGEN_VERSION: '0.2.127'

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tectonic-synthesis-cleanup
          fetch-depth: 0
      - name: Install pinned Rust and browser target
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup default "${RUST_VERSION}"
      - name: Restore wasm-bindgen CLI cache
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: ${{ runner.os }}-wasm-bindgen-cli-${{ env.WASM_BINDGEN_VERSION }}-rust-${{ env.RUST_VERSION }}
      - name: Install pinned wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo +${RUST_VERSION} install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply validated physical fix
        run: |
          python scripts/diagnose-topography-blocker.py
          git restore rust/interlink-worldgen-cli/examples/tectonic_topography_cutover_smoke.rs
          cargo fmt --all
      - name: Verify passive-margin adapter
        run: cargo test -p interlink-worldgen historical_passive_margins_create_bounded_shelf_subsidence
      - name: Verify tectonic topography cutover
        run: cargo run -p interlink-worldgen-cli --example tectonic_topography_cutover_smoke
      - name: Verify historical lithosphere
        run: cargo run --release -p interlink-worldgen-cli --example historical_lithosphere_acceptance
      - name: Verify event-driven morphology
        run: cargo run --release -p interlink-worldgen-cli --example historical_morphology_acceptance
      - name: Regenerate committed browser WASM package
        run: npm run build:worldgen-wasm
      - name: Build browser modules
        run: npm run build
      - name: Verify committed browser output
        run: git diff --exit-code -- dist/worldgen
      - name: Run browser regressions
        run: npm run test:ts
      - name: Commit physical fix and regenerated WASM
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/interlink-worldgen/src/causal_pipeline.rs rust/interlink-worldgen/src/historical_topography.rs src/wasm-worldgen
          git commit -m 'fix(worldgen): preserve active-orogen topographic support'
          git push origin HEAD:feat/tectonic-synthesis-cleanup
