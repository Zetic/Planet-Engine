name: Topography Blocker Fix

on:
  push:
    branches: [feat/tectonic-synthesis-cleanup]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tectonic-synthesis-cleanup
          fetch-depth: 0
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Apply diagnostic patch
        run: python scripts/diagnose-topography-blocker.py
      - name: Run diagnostic smoke
        run: cargo run -p interlink-worldgen-cli --example tectonic_topography_cutover_smoke
