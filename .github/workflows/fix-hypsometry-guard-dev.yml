name: Harden continental hypsometry guard

on:
  push:
    branches:
      - calibrate/continental-hypsometry

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: calibrate/continental-hypsometry
          fetch-depth: 0
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Apply guard correction
        run: python3 scripts/fix-hypsometry-guard.py
      - name: Validate calibration
        run: |
          cargo check -p interlink-worldgen -p interlink-worldgen-cli --all-targets
          cargo run --release -p interlink-worldgen-cli --example continental_hypsometry_acceptance
          cargo test -p interlink-worldgen historical_passive_margins_create_bounded_shelf_subsidence
      - name: Commit guard correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/interlink-worldgen/src/historical_topography.rs
          git commit -m 'fix(worldgen): apply freeboard without margin dependency' || exit 0
          git push origin HEAD:calibrate/continental-hypsometry
