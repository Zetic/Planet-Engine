name: Temporary WG-5 L7 convergence diagnostic

on:
  push:
    branches:
      - worldgen-wg5-coupled-climate

jobs:
  l7-extended-spinup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Raise diagnostic spin-up ceiling only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('rust/interlink-worldgen/src/climate.rs')
          s = p.read_text()
          old = '            maximum_spinup_years: 10,'
          assert old in s
          p.write_text(s.replace(old, '            maximum_spinup_years: 24,', 1))
          PY
      - name: Profile L7 coupled climate with extended spin-up
        run: |
          /usr/bin/time -v cargo run --release -p interlink-worldgen-cli -- climate --seed wg5-accept-l7 --coarse-level 5 --level 7 --plates 24
