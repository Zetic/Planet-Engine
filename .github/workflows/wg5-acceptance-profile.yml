name: Temporary WG-5 L7 advection-strength calibration

on:
  push:
    branches:
      - worldgen-wg5-coupled-climate

jobs:
  adv-020:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set ocean advection coupling 0.020
        run: |
          sed -i 's/ocean_advection_relaxation: 0.025/ocean_advection_relaxation: 0.020/' rust/interlink-worldgen/src/climate.rs
      - name: Run L7 acceptance
        run: |
          cargo run --release -p interlink-worldgen-cli -- climate --seed wg5-accept-l7 --coarse-level 5 --level 7 --plates 24 | tee /tmp/wg5.txt
          python scripts/wg5_assert_acceptance.py /tmp/wg5.txt

  adv-015:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
