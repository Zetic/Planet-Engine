name: Temporary WG-5 L7 spinup trace

on:
  push:
    branches:
      - worldgen-wg5-coupled-climate

jobs:
  trace:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Instrument annual convergence
        run: python scripts/wg5_spinup_trace.py
      - name: Trace L7 climate
        run: cargo run --release -p interlink-worldgen-cli -- climate --seed wg5-accept-l7 --coarse-level 5 --level 7 --plates 24
