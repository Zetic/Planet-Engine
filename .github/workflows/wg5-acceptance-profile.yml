name: Temporary WG-5 CLI acceptance hardening

on:
  push:
    branches:
      - worldgen-wg5-coupled-climate

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worldgen-wg5-coupled-climate
      - name: Make climate diagnostic enforce acceptance
        run: python scripts/wg5_cli_acceptance_patch.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Validate Rust workspace
        run: cargo test --workspace
      - name: Validate native climate diagnostic
        run: |
          cargo run --release -p interlink-worldgen-cli -- climate --seed wg5-cli-accept --coarse-level 3 --level 4 --plates 12
      - name: Commit CLI acceptance contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/interlink-worldgen-cli/src/main.rs
          git commit -m 'Make WG-5 CLI fail non-converged climate diagnostics'
          git push origin HEAD:worldgen-wg5-coupled-climate
