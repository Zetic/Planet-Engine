name: Temporary WG-7C Browser Regression Compatibility

on:
  push:
    branches: [wg7c-post-erosion-hydrology]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg7c-post-erosion-hydrology
          fetch-depth: 0
      - name: Advance cumulative browser regressions to WG-7C
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changed = []
          for path in sorted(Path('tests').glob('*.test.ts')):
              s = path.read_text()
              updated = s
              updated = updated.replace('assert.equal(WORLDGEN_PROTOCOL_VERSION, 16);', 'assert.equal(WORLDGEN_PROTOCOL_VERSION, 17);')
              updated = updated.replace('protocol v16', 'protocol v17')
              updated = updated.replace('THROUGH WG-7B', 'THROUGH WG-7C')
              updated = updated.replace('through WG-7B', 'through WG-7C')
              updated = updated.replace('Current physical frontier: WG-7B', 'Current physical frontier: WG-7C')
              if updated != s:
                  path.write_text(updated)
                  changed.append(str(path))

          # Make the cumulative Lab prose include the new final stage explicitly.
          path = Path('index.html')
          s = path.read_text()
          old = 'WG-7A fluvial erosion/sediment diagnostics, and WG-7B bounded terrain evolution in one cumulative Rust/WASM result.'
          new = 'WG-7A fluvial erosion/sediment diagnostics, WG-7B bounded terrain evolution, and WG-7C post-erosion hydrology reconciliation in one cumulative Rust/WASM result.'
          if old in s:
              path.write_text(s.replace(old, new, 1))
              changed.append(str(path))

          # The memory-conscious bridge no longer stores these pre-reconciliation state types.
          path = Path('rust/interlink-worldgen-wasm/src/climate_bridge.rs')
          s = path.read_text()
          updated = s.replace('DrainageRequest, DrainageState,', 'DrainageRequest,')
          updated = updated.replace('LakeRequest, LakeState,', 'LakeRequest,')
          updated = updated.replace('RunoffRequest, RunoffState,', 'RunoffRequest,')
          updated = updated.replace('SeasonalHydrologyRequest, SeasonalHydrologyState,', 'SeasonalHydrologyRequest,')
          if updated != s:
              path.write_text(updated)
              changed.append(str(path))

          print('updated:', ', '.join(changed) if changed else 'none')
          PY
          rustfmt --edition 2021 rust/interlink-worldgen-wasm/src/climate_bridge.rs
      - name: Commit compatibility updates if needed
        run: |
          git config user.name "Zetic"
          git config user.email "105380590+Zetic@users.noreply.github.com"
          git add tests index.html rust/interlink-worldgen-wasm/src/climate_bridge.rs
          if git diff --cached --quiet; then
            echo "No compatibility changes remain."
            exit 0
          fi
          git commit -m "WG-7C: advance cumulative browser regressions"
          git push origin HEAD:wg7c-post-erosion-hydrology
