name: Temporary WG-7D Composite Views

on:
  push:
    branches:
      - wg7d-lake-sediment-infill

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg7d-lake-sediment-infill
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply composite-view transform
        run: python3 scripts/temp-wg7d-composite-views.py
      - name: Build browser modules
        run: npm run build
      - name: Run browser regressions
        run: npm run test:ts
      - name: Commit permanent composite views
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-wg7d-composite-views.yml scripts/temp-wg7d-composite-views.py
          git add index.html src/worldgen/diagnostics/worldgenClimateLabStandalone.ts dist/worldgen/diagnostics/worldgenClimateLabStandalone.js tests/worldgenCompositeViews.test.ts
          git commit -m "Lab: add composite physical-world views"
          git push origin HEAD:wg7d-lake-sediment-infill
