name: Boundary Network Tectonics Development

on:
  push:
    branches: [feat/boundary-network-tectonics]
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_VERSION: '1.98.1'
  WASM_BINDGEN_VERSION: '0.2.127'

jobs:
  validate-and-land:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust and browser target
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup default "${RUST_VERSION}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply boundary-first cutover
        run: |
          python scripts/apply-boundary-network-cutover.py
          python scripts/tune-boundary-network-topography.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Compile workspace
        run: cargo check --workspace --all-targets
      - name: Run WG-4 topography acceptance
        run: cargo run -p interlink-worldgen-cli --example tectonic_topography_cutover_smoke
      - name: Run boundary-first geometry acceptance
        run: cargo run -p interlink-worldgen-cli --example boundary_network_geometry_acceptance
      - name: Run dynamic migration geometry acceptance
        run: cargo run -p interlink-worldgen-cli --example dynamic_plate_geometry_acceptance
      - name: Run historical lithosphere acceptance
        run: cargo run -p interlink-worldgen-cli --example historical_lithosphere_acceptance
      - name: Run historical morphology acceptance
        run: cargo run -p interlink-worldgen-cli --example historical_morphology_acceptance
      - name: Install pinned wasm-bindgen CLI
        run: cargo +${RUST_VERSION} install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - name: Regenerate committed WASM package
        run: npm run build:worldgen-wasm
      - name: Build browser modules
        run: npm run build
      - name: Run browser regressions
        run: npm run test:ts
      - name: Commit validated boundary-first cutover
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml \
            rust/interlink-worldgen/src/lib.rs \
            rust/interlink-worldgen/src/boundary_plate_geometry.rs \
            rust/interlink-worldgen/src/dynamic_plate_evolution.rs \
            rust/interlink-worldgen/src/causal_pipeline.rs \
            rust/interlink-worldgen-cli/examples/boundary_network_geometry_acceptance.rs \
            rust/interlink-worldgen-cli/examples/tectonic_topography_cutover_smoke.rs \
            src/wasm-worldgen
          if git diff --cached --quiet; then
            echo 'No generated boundary-first changes to commit.'
          else
            git commit -m 'feat(worldgen): synthesize modern plates from boundary fields'
            git push
          fi
