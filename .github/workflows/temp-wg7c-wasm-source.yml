name: Temporary WG-7C WASM Source Integration

on:
  push:
    branches: [wg7c-post-erosion-hydrology]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg7c-post-erosion-hydrology
          fetch-depth: 0
      - name: Install Rust stable and wasm target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Integrate WG-7C into cumulative WASM bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('rust/interlink-worldgen-wasm/src/climate_bridge.rs')
          s = p.read_text()

          old = '''    generate_initial_topography, generate_lakes_closed_basins, generate_lithosphere,\n    generate_runoff_discharge, generate_seasonal_hydrology, generate_tectonics,'''
          new = '''    generate_initial_topography, generate_lakes_closed_basins, generate_lithosphere,\n    generate_post_erosion_hydrology, generate_runoff_discharge, generate_seasonal_hydrology,\n    generate_tectonics,'''
          if old not in s: raise SystemExit('WG-7C bridge function import target missing')
          s = s.replace(old, new, 1)

          old = '''    LakeState, LithosphereRequest, PlanetPhysicalParameters, RunoffRequest, RunoffState,\n    SeasonalHydrologyRequest, SeasonalHydrologyState, TectonicsRequest, TerrainEvolutionRequest,\n    TerrainEvolutionState, TopographyRequest, TopographyState, WORLDGEN_ENGINE_VERSION,'''
          new = '''    LakeState, LithosphereRequest, PlanetPhysicalParameters, PostErosionHydrologyRequest,\n    PostErosionHydrologyState, RunoffRequest, RunoffState, SeasonalHydrologyRequest,\n    SeasonalHydrologyState, TectonicsRequest, TerrainEvolutionRequest, TerrainEvolutionState,\n    TopographyRequest, TopographyState, WORLDGEN_ENGINE_VERSION,'''
          if old not in s: raise SystemExit('WG-7C bridge type import target missing')
          s = s.replace(old, new, 1)

          if 'const GENERATION_STAGE_COUNT: u32 = 16;' not in s:
              raise SystemExit('WG-7C stage-count target missing')
          s = s.replace('const GENERATION_STAGE_COUNT: u32 = 16;', 'const GENERATION_STAGE_COUNT: u32 = 17;', 1)

          old = '''    drainage: DrainageState,\n    runoff: RunoffState,\n    lakes: LakeState,\n    seasonal: SeasonalHydrologyState,\n    erosion: FluvialErosionState,\n    evolution: TerrainEvolutionState,'''
          new = '''    erosion: FluvialErosionState,\n    evolution: TerrainEvolutionState,\n    reconciliation: PostErosionHydrologyState,'''
          if old not in s: raise SystemExit('WG-7C bridge retained-state target missing')
          s = s.replace(old, new, 1)

          old = '''        report_generation_progress(progress, "bounded-terrain-evolution", 14, 1, 1);\n        let precipitation_phase_rate_mm_year = diagnostics.precipitation_phase_rate_mm_year;'''
          new = '''        report_generation_progress(progress, "bounded-terrain-evolution", 14, 1, 1);\n\n        report_generation_progress(progress, "post-erosion-hydrology", 15, 0, 1);\n        let reconciliation = generate_post_erosion_hydrology(\n            &fine_topology,\n            &terrain,\n            &climate,\n            &diagnostics,\n            &drainage,\n            &runoff,\n            &lakes,\n            &seasonal,\n            &evolution,\n            planet,\n            &PostErosionHydrologyRequest::new(seed.as_str()),\n        )\n        .map_err(|error| JsValue::from_str(&error.to_string()))?;\n        report_generation_progress(progress, "post-erosion-hydrology", 15, 1, 1);\n        let precipitation_phase_rate_mm_year = diagnostics.precipitation_phase_rate_mm_year;'''
          if old not in s: raise SystemExit('WG-7C bridge generation insertion target missing')
          s = s.replace(old, new, 1)

          old = '''            terrain,\n            climate,\n            drainage,\n            runoff,\n            lakes,\n            seasonal,\n            erosion,\n            evolution,\n            planet,'''
          new = '''            terrain,\n            climate,\n            erosion,\n            evolution,\n            reconciliation,\n            planet,'''
          if old not in s: raise SystemExit('WG-7C bridge self-init target missing')
          s = s.replace(old, new, 1)

          # Final browser hydrology is the reconciled state. Pre-erosion hydrology survives only as compact hashes/metrics.
          s = s.replace('self.drainage', 'self.evolution.post_erosion_drainage')
          s = s.replace('self.runoff', 'self.reconciliation.reconciled_runoff')
          s = s.replace('self.lakes', 'self.reconciliation.reconciled_lakes')
          s = s.replace('self.seasonal', 'self.reconciliation.reconciled_seasonal')

          marker = '''    pub fn evolution_stage_id(&self) -> String {'''
          if marker not in s: raise SystemExit('WG-7C reconciliation accessor insertion marker missing')
          accessors = '''    pub fn reconciliation_stage_id(&self) -> String {\n        self.reconciliation.stage.id.to_owned()\n    }\n    pub fn reconciliation_stage_version(&self) -> u32 {\n        self.reconciliation.stage.version\n    }\n    pub fn reconciliation_stage_seed_hex(&self) -> String {\n        format!("{:016x}", self.reconciliation.stage.derived_seed)\n    }\n    pub fn post_erosion_hydrology_hash_hex(&self) -> String {\n        self.reconciliation.metrics.post_erosion_hydrology_hash_hex()\n    }\n    pub fn reconciliation_parameter_hash_hex(&self) -> String {\n        self.reconciliation.metrics.reconciliation_parameter_hash_hex()\n    }\n    pub fn reconciliation_topography_hash_hex(&self) -> String {\n        format!("{:016x}", self.reconciliation.metrics.topography_hash)\n    }\n    pub fn reconciliation_climate_hash_hex(&self) -> String {\n        format!("{:016x}", self.reconciliation.metrics.climate_hash)\n    }\n    pub fn reconciliation_pre_erosion_drainage_hash_hex(&self) -> String {\n        format!("{:016x}", self.reconciliation.metrics.pre_erosion_drainage_hash)\n    }\n    pub fn reconciliation_pre_erosion_runoff_hash_hex(&self) -> String {\n        format!("{:016x}", self.reconciliation.metrics.pre_erosion_runoff_hash)\n    }\n    pub fn reconciliation_pre_erosion_lake_hash_hex(&self) -> String {\n        format!("{:016x}", self.reconciliation.metrics.pre_erosion_lake_hash)\n    }\n    pub fn reconciliation_pre_erosion_seasonal_hash_hex(&self) -> String {\n        format!("{:016x}", self.reconciliation.metrics.pre_erosion_seasonal_hash)\n    }\n    pub fn reconciliation_terrain_evolution_hash_hex(&self) -> String {\n        format!("{:016x}", self.reconciliation.metrics.terrain_evolution_hash)\n    }\n    pub fn reconciliation_evolved_surface_hash_hex(&self) -> String {\n        format!("{:016x}", self.reconciliation.metrics.evolved_surface_hash)\n    }\n    pub fn reconciliation_post_erosion_drainage_hash_hex(&self) -> String {\n        format!("{:016x}", self.reconciliation.metrics.post_erosion_drainage_hash)\n    }\n    pub fn reconciliation_reconciled_runoff_hash_hex(&self) -> String {\n        self.reconciliation.metrics.reconciled_runoff_hash_hex()\n    }\n    pub fn reconciliation_reconciled_lake_hash_hex(&self) -> String {\n        self.reconciliation.metrics.reconciled_lake_hash_hex()\n    }\n    pub fn reconciliation_reconciled_seasonal_hash_hex(&self) -> String {\n        self.reconciliation.metrics.reconciled_seasonal_hash_hex()\n    }\n    pub fn pre_erosion_lake_count(&self) -> u32 {\n        self.reconciliation.metrics.pre_erosion_lake_count\n    }\n    pub fn post_erosion_lake_count(&self) -> u32 {\n        self.reconciliation.metrics.post_erosion_lake_count\n    }\n    pub fn lake_kind_changed_sample_count(&self) -> u32 {\n        self.reconciliation.metrics.lake_kind_changed_sample_count\n    }\n    pub fn lake_added_sample_count(&self) -> u32 {\n        self.reconciliation.metrics.lake_added_sample_count\n    }\n    pub fn lake_removed_sample_count(&self) -> u32 {\n        self.reconciliation.metrics.lake_removed_sample_count\n    }\n    pub fn flow_regime_changed_sample_count(&self) -> u32 {\n        self.reconciliation.metrics.flow_regime_changed_sample_count\n    }\n    pub fn maximum_absolute_lake_depth_change_m(&self) -> f64 {\n        self.reconciliation.metrics.maximum_absolute_lake_depth_change_m\n    }\n    pub fn maximum_absolute_annual_realized_discharge_change_m3_s(&self) -> f64 {\n        self.reconciliation\n            .metrics\n            .maximum_absolute_annual_realized_discharge_change_m3_s\n    }\n    pub fn maximum_absolute_flow_presence_change(&self) -> f64 {\n        self.reconciliation.metrics.maximum_absolute_flow_presence_change\n    }\n    pub fn reconciled_runoff_conservation_relative_error(&self) -> f64 {\n        self.reconciliation\n            .metrics\n            .reconciled_runoff_conservation_relative_error\n    }\n    pub fn reconciled_lake_water_balance_relative_error(&self) -> f64 {\n        self.reconciliation\n            .metrics\n            .reconciled_lake_water_balance_relative_error\n    }\n    pub fn reconciled_seasonal_routing_relative_error(&self) -> f64 {\n        self.reconciliation\n            .metrics\n            .reconciled_seasonal_routing_relative_error\n    }\n    pub fn reconciled_seasonal_water_balance_relative_error(&self) -> f64 {\n        self.reconciliation\n            .metrics\n            .reconciled_seasonal_water_balance_relative_error\n    }\n    pub fn reconciliation_lake_kind_changed_mask(&self) -> Vec<u8> {\n        self.reconciliation.lake_kind_changed_mask.clone()\n    }\n    pub fn reconciliation_lake_depth_delta_m(&self) -> Vec<f32> {\n        self.reconciliation.lake_depth_delta_m.clone()\n    }\n    pub fn reconciliation_annual_realized_discharge_delta_m3_s(&self) -> Vec<f32> {\n        self.reconciliation\n            .annual_realized_discharge_delta_m3_s\n            .clone()\n    }\n    pub fn reconciliation_flow_regime_changed_mask(&self) -> Vec<u8> {\n        self.reconciliation.flow_regime_changed_mask.clone()\n    }\n    pub fn reconciliation_flow_presence_delta(&self) -> Vec<f32> {\n        self.reconciliation.flow_presence_delta.clone()\n    }\n\n'''
          s = s.replace(marker, accessors + marker, 1)
          p.write_text(s)

          p = Path('rust/interlink-worldgen-wasm/src/lib.rs')
          s = p.read_text()
          if 'pub const WORLDGEN_WASM_PROTOCOL_VERSION: u32 = 16;' not in s:
              raise SystemExit('WG-7C WASM protocol target missing')
          p.write_text(s.replace('pub const WORLDGEN_WASM_PROTOCOL_VERSION: u32 = 16;', 'pub const WORLDGEN_WASM_PROTOCOL_VERSION: u32 = 17;', 1))
          PY
          rustfmt --edition 2021 rust/interlink-worldgen-wasm/src/climate_bridge.rs rust/interlink-worldgen-wasm/src/lib.rs
      - name: Check WASM bridge
        run: cargo check -p interlink-worldgen-wasm --target wasm32-unknown-unknown
      - name: Commit source integration and self-clean
        run: |
          rm .github/workflows/temp-wg7c-wasm-source.yml
          git config user.name "Zetic"
          git config user.email "105380590+Zetic@users.noreply.github.com"
          git add -A
          git commit -m "WG-7C: integrate final hydrology into WASM source"
          git push origin HEAD:wg7c-post-erosion-hydrology
