name: Temp Hydroclimate Partition Profile

on:
  push:
    branches:
      - wg5-wg6-hydroclimate-partition-calibration

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare L6 multires climate to full L7 reference for visible seed
        run: cargo run --release -p interlink-worldgen-cli --example climate_performance -- --seed interlink-wg7c --coarse-level 5 --level 7 --plates 16 --runs 1 --climate-level 6 --compare-reference
