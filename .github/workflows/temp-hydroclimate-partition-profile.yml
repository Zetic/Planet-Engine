name: Temp Hydroclimate Partition Profile

on:
  push:
    branches:
      - wg5-wg6-hydroclimate-partition-calibration

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply experimental split land PET energy budget
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('rust/interlink-worldgen/src/climate.rs')
          text = path.read_text()
          old_fraction = '''parameters.evaporation_energy_fraction
                            * absorbed_surface_energy_w_m2[i]'''
          new_fraction = '''0.70
                            * absorbed_surface_energy_w_m2[i]'''
          if text.count(old_fraction) != 1:
              raise SystemExit(f'expected one land PET energy fraction site, found {text.count(old_fraction)}')
          text = text.replace(old_fraction, new_fraction, 1)
          old_cap = 'potential_mass.min(energy_limited_mass.max(0.0))'
          if text.count(old_cap) != 1:
              raise SystemExit(f'expected one land PET min-cap, found {text.count(old_cap)}')
          text = text.replace(old_cap, 'energy_limited_mass.max(0.0)', 1)
          path.write_text(text)
          PY
      - name: Profile six-seed hydroclimate partition
        run: |
          mkdir -p profiling-results
          cargo run --release -p interlink-worldgen-cli --example temp_hydroclimate_partition_profile 2>&1 | tee profiling-results/split-land-pet-control.txt
      - name: Profile visible-seed runoff
        run: |
          cargo run --release -p interlink-worldgen-cli --example runoff_performance -- --seed interlink-wg7c --coarse-level 5 --level 7 --plates 16 --runs 1 2>&1 | tee -a profiling-results/split-land-pet-control.txt
      - name: Profile visible-seed lakes
        run: |
          cargo run --release -p interlink-worldgen-cli --example lake_performance -- --seed interlink-wg7c --coarse-level 5 --level 7 --plates 16 --runs 1 2>&1 | tee -a profiling-results/split-land-pet-control.txt
      - name: Persist control result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profiling-results/split-land-pet-control.txt
          git commit -m "chore: persist split land PET control [skip ci]"
          git push
