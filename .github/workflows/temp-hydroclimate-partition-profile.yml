name: Temp Hydroclimate Partition Profile

on:
  push:
    branches:
      - wg5-wg6-hydroclimate-partition-calibration

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply experimental energy-only land PET diagnostic
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('rust/interlink-worldgen/src/climate.rs')
          text = path.read_text()
          old = '''                        potential_mass.min(energy_limited_mass.max(0.0))'''
          new = '''                        energy_limited_mass.max(0.0)'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one land PET min-cap, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Profile six-seed hydroclimate partition
        run: |
          mkdir -p profiling-results
          cargo run --release -p interlink-worldgen-cli --example temp_hydroclimate_partition_profile 2>&1 | tee profiling-results/energy-only-pet-control.txt
      - name: Profile visible-seed runoff
        run: |
          cargo run --release -p interlink-worldgen-cli --example runoff_performance -- --seed interlink-wg7c --coarse-level 5 --level 7 --plates 16 --runs 1 2>&1 | tee -a profiling-results/energy-only-pet-control.txt
      - name: Profile visible-seed lakes
        run: |
          cargo run --release -p interlink-worldgen-cli --example lake_performance -- --seed interlink-wg7c --coarse-level 5 --level 7 --plates 16 --runs 1 2>&1 | tee -a profiling-results/energy-only-pet-control.txt
      - name: Persist control result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profiling-results/energy-only-pet-control.txt
          git commit -m "chore: persist energy-only PET control [skip ci]"
          git push
