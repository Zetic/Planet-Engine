name: Temp Hydroclimate Partition Profile

on:
  push:
    branches:
      - wg5-wg6-hydroclimate-partition-calibration

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply experimental land ET recycling
        run: python scripts/temp_apply_land_et_recycling.py
      - name: Profile recycled hydroclimate partition
        run: cargo run --release -p interlink-worldgen-cli --example temp_hydroclimate_partition_profile
