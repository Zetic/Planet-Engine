name: Temp Hydroclimate Partition Commit

on:
  push:
    branches:
      - wg5-wg6-hydroclimate-partition-calibration

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - name: Reapply previously validated production patch
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          workflow_path = '.github/workflows/temp-hydroclimate-partition-profile.yml'
          source = subprocess.check_output(
              ['git', 'show', f'HEAD^:{workflow_path}'],
              text=True,
          )

          py_start_marker = "          python - <<'PY'\n"
          py_end_marker = "\n          PY\n"
          py_start = source.index(py_start_marker) + len(py_start_marker)
          py_end = source.index(py_end_marker, py_start)
          patch_block = source[py_start:py_end]
          patch_block = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in patch_block.splitlines()
          ) + '\n'
          exec(compile(patch_block, '<validated-stage7-patch>', 'exec'), {})

          rs_start_marker = (
              "          cat > rust/interlink-worldgen-cli/examples/"
              "hydroclimate_partition_acceptance.rs <<'RS'\n"
          )
          rs_end_marker = "\n          RS\n"
          rs_start = source.index(rs_start_marker) + len(rs_start_marker)
          rs_end = source.index(rs_end_marker, rs_start)
          rust_block = source[rs_start:rs_end]
          rust_block = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in rust_block.splitlines()
          ) + '\n'
          Path(
              'rust/interlink-worldgen-cli/examples/hydroclimate_partition_acceptance.rs'
          ).write_text(rust_block)
          PY
          cargo fmt --all
      - name: Recheck hydroclimate partition acceptance
        run: cargo run --release -p interlink-worldgen-cli --example hydroclimate_partition_acceptance
      - name: Commit permanent production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            docs/worldgen-rewrite/WG5_HYDROCLIMATE_CLOSURE.md \
            docs/worldgen-rewrite/WG5_PERFORMANCE.md \
            rust/interlink-worldgen/src/climate.rs \
            rust/interlink-worldgen/tests/hydroclimate_closure.rs \
            rust/interlink-worldgen-wasm/tests/climate_bridge.rs \
            rust/interlink-worldgen-cli/examples/hydroclimate_partition_acceptance.rs
          git status --short
          git commit -m "fix(worldgen): recalibrate land hydroclimate partition [skip ci]"
          git push
