name: Temporary WG-5 current projection hardening

on:
  push:
    branches:
      - worldgen-wg5-coupled-climate

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worldgen-wg5-coupled-climate
      - name: Apply conservative ocean-current projection
        run: python scripts/wg5_pressure_projection.py
      - name: Validate Rust climate core
        run: cargo test --workspace
      - name: Prepare pinned browser WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Rebuild browser WASM package
        run: npm run build:worldgen-wasm
      - name: Commit hardened projection and generated WASM
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/interlink-worldgen/src/climate.rs rust/interlink-worldgen/tests/climate_ensemble.rs src/wasm-worldgen
          git commit -m 'Harden WG-5 ocean current mass projection'
          git push origin HEAD:worldgen-wg5-coupled-climate
