name: Temporary WG-5 conservative ocean heat transport

on:
  push:
    branches:
      - worldgen-wg5-coupled-climate

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worldgen-wg5-coupled-climate
      - name: Couple SST to projected ocean-edge transport
        run: python scripts/wg5_ocean_heat_flux.py
      - name: Validate Rust climate core
        run: cargo test --workspace
      - name: Commit conservative ocean heat transport
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/interlink-worldgen/src/climate.rs
          git commit -m 'Use projected ocean transports for WG-5 heat advection'
          git push origin HEAD:worldgen-wg5-coupled-climate
