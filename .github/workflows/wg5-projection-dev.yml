name: Temporary WG-5 final integration

on:
  push:
    branches:
      - worldgen-wg5-coupled-climate

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worldgen-wg5-coupled-climate
      - name: Apply final WG-5 integration hardening
        run: python scripts/wg5_finalize_integration.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build and test browser surface
        run: |
          npm ci
          npm run build
          npm run test:ts
      - name: Validate Rust workspace
        run: cargo test --workspace
      - name: Prepare pinned browser WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Rebuild committed browser WASM package
        run: npm run build:worldgen-wasm
      - name: Commit final WG-5 integration outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/worldgen-rewrite/WG5_CLIMATE.md src/worldgen/diagnostics/worldgenClimateLabStandalone.ts tests/wg5Climate.test.ts tests/worldgenRewrite.test.ts dist/worldgen src/wasm-worldgen
          git commit -m 'Finalize WG-5 climate integration and diagnostics'
          git push origin HEAD:worldgen-wg5-coupled-climate
