name: Temporary WG-5 projection parameter cleanup

on:
  push:
    branches:
      - worldgen-wg5-coupled-climate

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worldgen-wg5-coupled-climate
      - name: Remove obsolete current-smoothing parameter
        run: python scripts/wg5_finalize_projection_params.py
      - name: Validate Rust climate core
        run: cargo test --workspace
      - name: Prepare pinned browser WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Rebuild browser WASM package
        run: npm run build:worldgen-wasm
      - name: Commit final projection parameter contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/interlink-worldgen/src/climate.rs src/wasm-worldgen
          git commit -m 'Finalize WG-5 ocean projection parameters'
          git push origin HEAD:worldgen-wg5-coupled-climate
