name: Temporary WG-7A Deposition Visualization Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'wg7a-fluvial-erosion-sediment'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wg7a-fluvial-erosion-sediment
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Apply WG-7A deposition visualization fix
        run: python scripts/temp-wg7a-deposition-visual.py
      - name: Build and test browser diagnostics
        run: |
          npm run build
          npm run test:ts
      - name: Remove temporary tooling
        run: |
          rm -f scripts/temp-wg7a-deposition-visual.py
          rm -f .github/workflows/temp-wg7a-deposition-visual.yml
      - name: Commit WG-7A deposition visualization fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Show terminal ocean sediment deposition in WG-7A Lab'
          git push origin HEAD:wg7a-fluvial-erosion-sediment
